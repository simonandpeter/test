<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gallery of Saints</title>
<meta name="description" content="The saints of the Orthodox Church, church by church — Russian, Romanian and Greek, each in its own calendar." />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e5e4dd" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1412" />
<!-- One gold cell — the attested mark from the veneration badge, the only
     place gold appears in the product. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='%23a98237'/%3E%3C/svg%3E" />

<script>
  // Theme before first paint. Runs ahead of any stylesheet so the first
  // painted frame is already the right colour — later would flash, and would
  // also fire the theme fade on load. Reads the same key settings.js owns: a
  // stored 'light' or 'dark' is the reader's choice; anything else (nothing,
  // or the old 'system') means follow the OS (author, 2026-08-22).
  (function () {
    try {
      var theme = JSON.parse(localStorage.getItem('gos-settings') || '{}').theme;
      var dark =
        theme === 'dark' ||
        (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {
      /* storage disabled — system-light default, harmless */
    }
  })();
</script>
</head>
<body>
  <div id="veil">
    <div class="veil-name">Gallery of Saints</div>
    <div class="veil-line"></div>
  </div>

  <header class="chrome">
    <a class="site-name" href="/">Gallery of Saints</a>
    <nav class="site-nav" id="site-nav" aria-label="Site"></nav>
    <div class="chrome-corner">
      <!-- The calendar control names the church the site reads and opens the
           chooser in the panel below the header (author, 2026-08-22; it was
           Select Tradition until then); the theme toggle is a sun/moon icon.
           Today's date stood here from 2026-08-21 to 2026-08-22. -->
      <button id="church-open" type="button" class="church-open utility"
        aria-controls="church-panel" aria-expanded="false"></button>
      <button id="theme-toggle" type="button" class="icon-button"></button>
    </div>
  </header>
  <div class="church-panel" id="church-panel" hidden></div>

  <main class="chrome">
    <div id="view"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
