<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test</title>

<script>
  // Applied before <style> even parses, so the very first paint already
  // has the right theme — doing this later (e.g. in the main script at
  // the bottom of <body>) would show a flash of the wrong theme first,
  // and would also visibly trigger the 2s fade on every page load.
  (function () {
    try {
      if (localStorage.getItem('dark-mode') === '1') document.documentElement.classList.add('dark');
    } catch (e) { /* private-mode / storage disabled — default to light, harmless */ }
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root{
    --bg: #ffffff;
    --ink: #1c1a16;
    --ink-soft: #55524a;
    --line-grey: #b7b1a2;
    --line-grey-soft: #e2ddd0;
    --rubric: #8a2e26;
    --hl: #f5e05a;
  }
  /* Dark mode — toggled via .dark on <html> (not <body>) so the very
     first paint already has the right background, no flash. Only --bg
     and --ink are exact values from the brief (rgb(15,13,15) /
     rgb(245,245,245)); the rest are this file's existing accent colours
     re-tuned to the same relative roles (soft text, dividers, the red
     accent, the quote highlight) so they read correctly against a
     near-black background instead of disappearing or glaring. */
  html.dark{
    --bg: rgb(15,13,15);
    --ink: rgb(245,245,245);
    --ink-soft: rgb(170,166,158);
    --line-grey: rgb(90,86,79);
    --line-grey-soft: rgb(38,35,32);
    --rubric: rgb(214,109,97);
    --hl: rgb(199,169,58);
  }
  /* Applies to every element with its own background/text/border colour
     — deliberately broad rather than an enumerated list, since that list
     would need updating every time a new coloured element is added.
     Elements with their own more specific transition (hover states, the
     loading bar's pulse) keep that faster one; CSS resolves per-property
     by specificity, so this only fills in the elements that don't
     already declare their own. */
  *{ box-sizing:border-box; transition: background-color 2s ease, color 2s ease, border-color 2s ease, fill 2s ease, stroke 2s ease; }

  /* ---- loading screen ---------------------------------------------
     Opacity and colour only. The site's rule that position/rotation/scale
     are tweened in JS rather than CSS is about animations that have to
     stay in sync with measured layout; nothing here moves, so a keyframe
     is the simpler tool and it runs off the main thread. */
  #loading-screen{
    position:fixed; inset:0; z-index:200;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    /* Runs once on paint, whether that's the first page load or the
       fresh navigation "tap to refresh" performs (location.reload() —
       see its own comment) — a real reload re-runs this animation from
       frame 0 with no extra code needed. animation-fill-mode:forwards
       holds it at opacity:1 once done, so the .done class below (a plain
       property change, not a keyframe) can still transition it back out. */
    animation:loading-screen-in .5s ease forwards;
    /* Fades itself out, then is removed from the DOM entirely so it can
       never intercept a tap once the site is live. */
    transition:opacity .55s ease, background-color 2s ease;
  }
  @keyframes loading-screen-in{ to{ opacity:1; } }
  /* animation:none is required here, not optional polish: CSS animations
     outrank transitions on the same property, so as long as
     loading-screen-in's forwards-fill is still "running" opacity:0 from a
     plain rule is silently ignored and the element just vanishes on
     remove() instead of fading. Clearing the animation in this same rule
     hands opacity back to the transition. */
  #loading-screen.done{ animation:none; opacity:0; pointer-events:none; }
  .loading-stack{
    text-align:center;
    padding:24px;
    max-width:min(560px, 88vw);
    animation:loading-breathe 3.4s ease-in-out infinite;
  }
  .loading-stack p{
    margin:0 0 9px 0;
    font-size:15px;
    line-height:1.55;
    color:var(--ink);
    font-style:italic;
    /* Greek, Cyrillic, Arabic, Chinese and Devanagari all need to fall
       through to whatever the platform ships (Noto on Android) — Times
       has no glyphs for most of these, and without a fallback the lines
       would render as tofu boxes. */
    font-family:'Times New Roman', Times, 'Noto Serif', 'Noto Naskh Arabic',
                'Noto Serif Devanagari', 'Noto Serif CJK SC', serif;
  }
  .loading-stack p[lang="ar"]{ font-size:17px; }
  .loading-stack p[lang="zh"], .loading-stack p[lang="hi"]{ font-style:normal; }
  .loading-ref{
    margin-top:16px !important;
    font-style:normal !important;
    font-size:11px !important;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .loading-bar{
    margin:26px auto 0 auto;
    width:min(240px, 60vw);
    height:1px;
    background:var(--line-grey);
    animation:loading-pulse 1.8s ease-in-out infinite;
  }
  @keyframes loading-breathe{
    0%, 100% { opacity:0.25; }
    50%      { opacity:1; }
  }
  @keyframes loading-pulse{
    0%, 100% { background:var(--line-grey); }
    50%      { background:var(--ink); }
  }
  /* Respect a stated preference for less motion: the screen still appears
     and still tells the reader what is happening, it just holds steady. */
  @media (prefers-reduced-motion: reduce){
    .loading-stack{ animation:none; opacity:1; }
    .loading-bar{ animation:none; background:var(--ink-soft); }
  }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Times New Roman', Times, serif;
    overflow:hidden;
    /* .25s is inherited from when each saint image shipped in two
       background-baked variants and the page had to finish fading in step
       with the image swap, or the two surfaces visibly drifted apart
       mid-toggle. The images are cropped to the icon now and no longer
       swap, so nothing is being matched — but the whole site's surfaces
       (header, mobile panel, chapter headers) were tuned to this same .25s
       against the slow 2s ambient text fade, and that contrast is the look.
       Changing it is a design decision, not a cleanup. */
    transition:background-color .25s ease, color 2s ease;
  }
  a{ color:inherit; }

  /* ---------------- Header ---------------- */
  header{
    position:relative;
    z-index:50;
    height:30px;
    background:var(--bg);
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--line-grey-soft);
    padding:0 20px;
    /* Matches the body/.saint-card .25s background fade (see body's own
       comment) — without this it inherits the sitewide `*` rule's 2s
       background-color duration and visibly lags the rest of the page
       during a theme toggle. */
    transition:background-color .25s ease, color 2s ease, border-color 2s ease;
  }
  header .brand{
    flex:1 1 0%;
    display:flex;
    align-items:center;
    font-size:16px;
    letter-spacing:0.08em;
    white-space:nowrap;
  }
  header nav{
    flex:1 1 0%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  header nav a{
    cursor:pointer;
    padding-bottom:3px;
    border-bottom:1px solid transparent;
    white-space:nowrap;
    /* color kept at the sitewide 2s ambient text pace (see body's own
       comment on why text stays slow while backgrounds fade fast) — it
       used to run at .3s like the hover border-color, which meant an
       inactive link (e.g. "Armory") settled into its new theme colour
       well before the header around it finished fading, reading as a
       flicker/pop against the still-mid-fade backdrop. border-color stays
       fast — that one's just hover feedback, not part of the theme fade. */
    transition:border-color .3s ease, color 2s ease;
  }
  header nav a:hover,
  header nav a.active{
    color:var(--rubric);
    border-color:var(--rubric);
  }
  header .spacer{
    flex:1 1 0%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
  }
  #dark-toggle{
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    font:inherit;
    color:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:color .3s ease;
  }
  #dark-toggle:hover{ color:var(--rubric); }
  #dark-toggle svg{ width:16px; height:16px; }

  @media (max-width:700px){
    header .brand{ font-size:14px; }
    header nav{ gap:34px; justify-content:flex-end; padding-right:4px; }
  }

  main{ height:calc(100vh - 30px); height:calc(100dvh - 30px); position:relative; }

  .view{ position:absolute; inset:0; display:none; }
  .view.active{ display:block; }

  .label{
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--rubric);
    margin-bottom:12px;
    text-align:center;
  }

  /* ---------------- Hall of Saints — carousel ---------------- */
  /* touch-action:pan-x, not the bare default — verified via CDP tracing:
     an element with no touch-action override routes scrollLeft writes
     through Chromium's slow main-thread path; pan-x (like :none) gets
     the fast composited-scroll path, but still permits native touch
     panning unlike :none. setLocked() (attachLoopScroll) only swaps to
     :none for the brief window a modal tween needs the row still, then
     restores pan-x/pan-y — never plain 'auto', which would lose the
     fast path again. */
  /* Column flex so the track takes the view's whole height — the order nav
     is out of flow (below), so nothing sits above the deck and
     layoutHallCards() starts the cards at the very top of the view.
     min-height:0 because a flex item's default min-height:auto would refuse
     to shrink below its content and let the row overflow the view instead. */
  #hall-view.active{ display:flex; flex-direction:column; }
  /* Out of flow, sitting in the dead band beneath the cards: .saint-item's
     margin-bottom already reserves 40px + safe area under the deck, so the
     nav costs the images no height at either end. */
  #hall-order-nav{
    position:absolute; z-index:5;
    right:20px;
    bottom:calc(11px + env(safe-area-inset-bottom));
    display:flex; align-items:center;
    gap:28px;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  #hall-order-nav a{
    cursor:pointer;
    padding-bottom:3px;
    border-bottom:1px solid transparent;
    white-space:nowrap;
    color:var(--ink-soft);
    /* Same split as the page header's nav: border-color is hover feedback
       and stays fast, colour rides the slow ambient text fade. */
    transition:border-color .3s ease, color 2s ease;
  }
  #hall-order-nav a:hover,
  #hall-order-nav a.active{ color:var(--rubric); border-color:var(--rubric); }
  /* Ordering only means anything while the row is on screen, so the nav
     leaves with it — same .2s as .saint-item's own dim, so the row and its
     control read as one thing going and coming back together. */
  #hall-order-nav{ transition:opacity 0.2s ease; }
  #hall-order-nav.dim{ opacity:0; pointer-events:none; }

  #hall-track{
    flex:1;
    min-height:0;
    display:flex;
    align-items:flex-start;
    gap:10px;
    overflow-x:auto;
    overflow-y:hidden;
    touch-action:pan-x;
    -webkit-user-select:none;
    user-select:none;
    scrollbar-width:none;
  }
  #hall-track::-webkit-scrollbar{ display:none; }
  #hall-status{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-style:italic; color:var(--ink-soft); font-size:14px;
  }

  .saint-item{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:10px;
    margin-bottom:calc(40px + env(safe-area-inset-bottom));
    cursor:pointer;
    /* Keep this short — was 1s, but every DOM clone in the row (a small
       saint count means loopSafeList + the clone buffer produce a
       dozen-plus copies of the same saint) has .dim removed at once when
       a modal closes. At 1s that's a full second of many clones visible
       at different mid-fade opacities — reads as duplicate images
       flashing in, worst on desktop where more of the row is in view. */
    transition:opacity 0.2s ease;
  }
  .saint-item.dim{ opacity:0; pointer-events:none; }

  /* Size comes from the image's own pixel dimensions, applied as custom
     properties by layoutHallCards() rather than as inline width/height —
     an inline value would outrank the .selected override below, which the
     modal tween needs to be able to win. */
  .saint-card{
    flex:0 0 auto;
    width:var(--card-w);
    height:var(--card-h);
    overflow:hidden;
    contain:layout paint;
    /* Deliberately NO background-color, and nothing to transition. Painting
       var(--bg) here and fading it alongside the page looks equivalent but
       is not: it makes the card a SECOND surface animating the same colour
       as the canvas, on its own paint layer (contain:paint). Measured off a
       phone capture, the card's fade ran ~15ms — one frame — ahead of the
       canvas, and since .25s covers 241 luminance levels, one frame of skew
       is a ~21-level step with a hard card-shaped edge: visible rectangles
       during a theme toggle. Transparent means the canvas is the only
       surface painting the theme, so there is nothing left to fall out of
       step. */
  }
  .saint-card{ position:relative; }
  .saint-card img{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none; /* suppress the browser's built-in image-hover search icon */
    /* Deliberately no background-color here either — same reason as the
       card: an undecoded img box shows the page through it regardless, and
       giving .thumb an opaque background just makes its blur() filter
       composite an opaque full-card rect every frame for nothing. */
  }
  /* Thumb paints first (tiny, always cached fast) and sits underneath;
     the full-res image fades in over it once decoded, so a fast scroll
     shows a blurred likeness instead of a blank card. */
  .saint-card img.thumb{
    position:absolute; inset:0;
    filter:blur(8px);
    transform:scale(1.08); /* hides the blur's soft edge fringe */
    transition:opacity .25s ease;
  }
  .saint-card img.full{
    position:relative;
    opacity:0;
    transition:opacity .25s ease;
  }
  .saint-card img.full.loaded{ opacity:1; }
  /* The open/close tween sets width/height directly (JS, not CSS
     transitions — see TWEEN's own comment), which forces a real layout
     + repaint + re-rasterize of the image bitmap on every single frame.
     On a real device with a real (non-trivial) image and a weaker GPU,
     that re-rasterization can visibly lag a frame or more behind the
     container it's supposed to fill — seen as a stale, differently-sized
     "ghost" of the same image bleeding through underneath the current
     frame. will-change promotes the element to its own compositing layer
     ahead of time rather than only once the animation is already
     under way, which is what actually reduces that catch-up lag. */
  .saint-item.selected{ will-change:top, left, width, height; }
  /* opacity included alongside width/height: without it, a phone GPU
     already busy re-rasterizing this image every frame for the width/
     height tween (see the comment above) can skip promoting a compositing
     layer for the .full image's load-in fade until that fade is already
     underway, which shows as a hard pop instead of the smooth reveal an
     unselected card gets. */
  .saint-item.selected .saint-card img{ will-change:width, height, opacity; }

  /* margin-top is set per item by layoutHallCards(), not here: it is
     whatever distance drops this name onto the fixed name line — a set
     fraction of the viewport height, shared by every saint — from the
     bottom of this saint's own image, however short that image is.
     Clamped to 2 lines so a long name can't push the intro below it out
     of the space left underneath. */
  .saint-caption{
    font-size:11px;
    line-height:14px;
    letter-spacing:0.08em;
    text-align:center;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
    overflow:hidden;
    transition:color .3s ease;
  }
  /* Clamped for the same reason as the caption: the space below the name
     line is finite, and an unbounded intro would run into the deck's
     bottom edge. */
  .saint-intro{
    margin-top:6px;
    font-size:11px;
    line-height:14px;
    text-align:center;
    color:var(--ink-soft);
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3;
    overflow:hidden;
    transition:color .3s ease;
  }
  .saint-item:hover .saint-caption{ color:var(--rubric); }

  /* The old @media(max-width:768px) card/caption overrides are gone: card
     height and the caption's 2-line budget are now computed by
     layoutHallCards() from the real track height and safe-area margin, so
     one code path covers both, and the safe-area buffer can't be
     overflowed on either. */

  .saint-item.selected{ position:fixed; z-index:40; margin:0; }
  .saint-item.selected .saint-card{ box-shadow:none !important; }
  /* The card keeps its own --card-h in both layouts now. It used to be
     forced to fill the whole wrapper in compact mode, because the image
     shrank to a small dock there and the caption was hidden; neither is
     true any more — the image is the same size open as closed, in both
     layouts, so there is nothing left to stretch. */
  .item-placeholder{ flex:0 0 auto; visibility:hidden; }

  /* ---------------- Hall Modal — desktop three-column layout ----------------
     Contents list | saint card | selected content. The card is the
     position:fixed .saint-item itself, tweened into the middle column by
     computeHallTarget(); the two panels here sit either side of the gap it
     lands in. Column widths come from layoutModalColumns(), which is the
     only place that knows the card's measured width. */
  #hall-contents, #hall-modal-text{
    position:fixed;
    top:var(--modal-top); height:calc(100% - var(--modal-top) - var(--modal-pad));
    opacity:0;
    transition:opacity 1s ease;
    z-index:41;
    pointer-events:none;
  }
  #hall-contents{
    left:var(--modal-pad);
    width:var(--modal-contents-w);
    overflow-y:auto;
    scrollbar-width:none;
  }
  #hall-contents::-webkit-scrollbar{ display:none; }
  #hall-modal-text{
    left:calc(var(--modal-pad) + var(--modal-contents-w) + var(--modal-gap) + var(--modal-card-w) + var(--modal-gap));
    right:var(--modal-pad);
  }
  #hall-contents.reveal, #hall-modal-text.reveal{ opacity:1; pointer-events:auto; }

  /* Same visual language as .chapter-header — these are the same chapters,
     listed rather than stacked. */
  .contents-item{
    display:block; width:100%; text-align:left;
    background:none; border:none; font-family:inherit;
    font-size:13px; letter-spacing:0.03em; line-height:1.45;
    color:var(--ink-soft); cursor:pointer;
    padding:9px 4px;
    border-bottom:1px solid var(--line-grey-soft);
    transition:color .3s ease;
  }
  .contents-item:hover{ color:var(--rubric); }
  .contents-item.active{ color:var(--rubric); }
  .contents-item[disabled]{ opacity:0.3; pointer-events:none; }

  .desktop-content-pane{ display:none; height:100%; }
  .desktop-content-pane.active{ display:block; }
  #desktop-quotes-pane{ overflow:hidden; }
  #desktop-chapters-pane{
    overflow-y:auto;
    scrollbar-width:none;
  }
  #desktop-chapters-pane::-webkit-scrollbar{ display:none; }

  .quotes-track{
    display:flex;
    flex-direction:column;
    height:100%;
    overflow-x:hidden;
    overflow-y:auto;
    touch-action:pan-y; /* see the touch-action comment above #hall-track — pan-y is this axis's equivalent */
    -webkit-user-select:none;
    user-select:none;
    scrollbar-width:none;
  }
  .quotes-track::-webkit-scrollbar{ display:none; }
  .quotes-track .q{
    flex:0 0 auto;
    height:44px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-style:italic;
    font-size:14px;
    color:var(--ink-soft);
    padding:0 14px;
    border-bottom:1px solid var(--line-grey-soft);
    cursor:pointer;
    transition:color .3s ease;
  }
  .quotes-track .q:hover{ color:var(--rubric); }
  /* Both layouts: quotes read as prose, not as a ticker — left aligned, set
     at the chapter body's own 15px, and free to be however tall the wrapped
     text needs. Variable row heights are only safe because attachLoopScroll
     measures real offsets rather than assuming every row is one fixed
     stride. */
  #mobile-quotes-pane .q,
  #desktop-quotes-pane .q{
    height:auto;
    display:block;
    text-align:left;
    font-size:15px;
    line-height:1.7;
    padding:16px 18px;
  }
  #desktop-quotes-pane .q{ padding:16px 4px; }

  /* Fills whichever pane holds it — #desktop-chapters-pane and
     #mobile-texts-pane are the scroll roots now, so this must not introduce
     a second one inside them. */
  .chapters-panel{
    width:100%;
    max-height:none;
    overflow:visible;
  }
  .chapter-header{
    display:block; width:100%; text-align:left;
    background:var(--bg); border:none; font-family:inherit;
    font-size:14px; letter-spacing:0.03em;
    color:var(--ink); cursor:pointer;
    padding:10px 4px; border-bottom:1px solid var(--line-grey-soft);
    /* background-color matches the body/.saint-card .25s fade, not the
       sitewide 2s default — otherwise this lags visibly behind the rest
       of the page during a theme toggle. */
    transition:color .3s ease, background-color .25s ease;
  }
  .chapter-header:hover{ color:var(--rubric); }
  /* top:0 in both layouts now. In compact this used to need an explicit
     offset matching the sticky hero bar's measured height, because the
     scroll root was the whole panel and the bar overlaid its top. The bar
     is gone and #mobile-texts-pane is its own scroll root starting below
     the mode nav, so zero is genuinely the top of the scrolling area. */
  .chapter.revealed .chapter-header{
    position:sticky; top:0; z-index:2;
  }
  /* An earlier chapter's header that's been scrolled past and superseded
     by a later one — see stickyObserver's comment in
     createChapterController. opacity, not display:none, so it still
     participates in position:sticky's own layout math and comes back
     instantly (no re-render) the moment scrolling carries it below the
     sticky line again. */
  .chapter.header-passed .chapter-header{ opacity:0; pointer-events:none; }
  /* Desktop's flat pane (createFlatChaptersController) never toggles
     .header-passed and every chapter is always .revealed, so the sticky/
     hover-hand affordances that make sense for mobile's accordion would
     just be noise here — plain non-interactive section headers instead. */
  #hall-chapters-desktop .chapter-header{ position:static; cursor:default; }
  #hall-chapters-desktop .chapter-header:hover{ color:var(--ink); }
  .chapter-body{ display:none; font-size:15px; line-height:1.7; color:var(--ink-soft); padding:12px 4px 26px 4px; }
  .chapter-body p{ margin-bottom:1em; }
  .chapter.revealed .chapter-body{ display:block; }
  .chapter-start-sentinel, .chapter-end-sentinel{ height:1px; }
  /* Height set by createChapterController's syncTail() — see its comment. */
  .chapters-tail{ flex:0 0 auto; }
  .chapters-panel:not(.has-open) .chapters-tail{ height:0 !important; }
  .chapters-panel.has-open .chapter:not(.revealed){ display:none; }
  .quote-anchor{ transition:background-color 1s ease; border-radius:2px; }
  .quote-anchor.hl{ background-color:var(--hl); transition:background-color .2s ease; cursor:pointer; }

  #hall-close{
    position:fixed; top:44px; right:6vw; z-index:42;
    width:34px; height:34px;
    border:1px solid var(--line-grey);
    background:var(--bg);
    display:none; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .3s ease, transform .3s ease, background-color 2s ease;
  }
  #hall-close.show{ display:flex; }
  #hall-close:hover{ border-color:var(--rubric); transform:rotate(90deg); }

  /* ---------------- Hall Modal — compact (mobile-style) layout ----------------
     Driven by body.modal-compact, toggled in JS based on available width
     rather than a fixed viewport breakpoint — see isModalCompact(). This is
     deliberately separate from the header's own @media(max-width:700px). */

     the screen. It stays exactly the size it is in the deck and only slides
     to the centre, the same move desktop makes — so this panel is whatever
     is left BELOW it, starting at the bottom of the saint's name.
     --mobile-panel-top is measured from the open card by
     syncMobilePanelTop(); the 50% fallback only ever applies for the frame
     before that first measurement lands. */
  #hall-mobile-panel{ display:none; }
  body.modal-compact #hall-contents, body.modal-compact #hall-modal-text{ display:none; }
  body.modal-compact #hall-mobile-panel{
    display:flex;
    flex-direction:column;
    position:fixed;
    top:var(--mobile-panel-top, 50%); left:0; right:0; bottom:0;
    opacity:0; pointer-events:none;
    /* background-color matches the body/.saint-card .25s fade, not the
       sitewide 2s default — this panel IS "the rest of the background"
       once a saint card is open on mobile, so it must fade in step with
       it rather than lagging behind. */
    transition:opacity .5s ease, background-color .25s ease;

     nav — this is the third instance of the same control. */
  #hall-mode-nav{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    gap:28px;
    padding:10px 0 8px 0;

     for most saints that currently leaves none. Show the mode as
     unavailable rather than offering a tab that opens on nothing. */
  #hall-mode-nav.no-quotes a[data-mode="quotes"]{

  .mobile-mode-pane{ display:none; flex:1; min-height:0; }

  /* A plain vertical reading column. It was previously a horizontal rack of

    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-y:auto;
    overflow-x:hidden;

<script>
/* =====================================================================
   CONFIG — fill these in with your actual repo details. Without them,
   the site can't ask GitHub what folders exist under assets/saints/,
   and falls back to a small built-in demo so the page still works.
===================================================================== */
const GITHUB_OWNER  = 'simonandpeter';
const GITHUB_REPO   = 'test';
const GITHUB_BRANCH = 'main';

/* The desktop split-panel layout needs real room: the chapters panel
   maxes out at 420px, centred in the right half, and must clear the
   centred card. Computed directly (collision check) rather than a fixed
   pixel breakpoint — independent of the header's own 700px breakpoint,
   since this is about panel geometry, not device type. */
/* Widest card currently rendered in the deck, published by
   layoutHallCards(). isModalCompact() measures against this rather than
   against whichever saint was tapped: cards are sized from their own
   images now, so per-saint widths differ by 50px or more, and using the
   tapped one would hand a narrow saint the split-panel layout at a
   viewport width where a wide saint gets the compact one. The layout a
   given screen produces should not depend on which picture you opened. */
let deckMaxCardW = 0;

/* Desktop modal columns: contents list | saint card | selected content.
   The first two are fixed widths so the layout does not shift as you move
   between saints of different proportions; the content column takes
   whatever is left. */
const MODAL_CONTENTS_W = 240;
const MODAL_GAP = 40;
const MODAL_PAD = 28;

function modalTextWidth(cardW) {
  return window.innerWidth - 2 * MODAL_PAD - MODAL_CONTENTS_W - 2 * MODAL_GAP - cardW;
}

function isModalCompact(origRect) {
  /* Compact once the content column would be narrower than the card beside
     it — at that point the reading column has become the cramped part of a
     layout built around it, and the stacked layout serves it better.
     Measured against the widest card in the deck rather than the tapped
     saint's, so the same screen always resolves the same way whichever
     picture you opened. */
  const cardW = deckMaxCardW || origRect.width;
  return modalTextWidth(cardW) < cardW;
}

/* Publishes the column geometry the CSS reads. Kept here rather than in the
   stylesheet because the middle column's width is the card's measured
   width, which only layoutHallCards() knows. */
function layoutModalColumns() {
  const root = document.documentElement.style;
  root.setProperty('--modal-pad', MODAL_PAD + 'px');
  root.setProperty('--modal-gap', MODAL_GAP + 'px');
  root.setProperty('--modal-top', (HEADER_H + MODAL_PAD) + 'px');
  root.setProperty('--modal-contents-w', MODAL_CONTENTS_W + 'px');
  root.setProperty('--modal-card-w', Math.round(deckMaxCardW) + 'px');
}

/* =====================================================================
   NAV
===================================================================== */
let armoryEverVisible = false;
document.querySelectorAll('header nav a').forEach(a => {
  a.addEventListener('click', () => {
    document.querySelectorAll('header nav a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    const target = a.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(`${target}-view`).classList.add('active');
    /* Freeze whichever view just left. Its idle drift would otherwise keep
       running against a display:none track, and that is what made the row
       jump on the way back: a hidden element reports scrollLeft 0 and
       refuses writes, so drift re-seeded its position from 0 and then wrote
       that near-zero value back the instant the view was displayed again,
       throwing away wherever the reader actually was. */
    if (target === 'armory') { hallDrift.pause(); armoryDrift.resume(); }
    else { armoryDrift.pause(); hallDrift.resume(); }

    // Elements inside a display:none view are never laid out by the
    // browser, so any offsetLeft-based measurement taken while hidden
    // reads as 0 and stays wrong forever, even long after the tab
    // becomes visible. Re-measure once it's actually on screen.
    requestAnimationFrame(() => {
      if (target === 'armory') {
        armoryInertia.measure();
        if (!armoryEverVisible) {
          // Armory starts hidden (Hall is the default tab), so its very
          // first resetTo() — inside renderArmory() — also ran while
          // hidden and landed on a wrong position. Correct it just this
          // once; don't repeat this on later visits or it'd yank the
          // user's own scroll position back to the start every time.
          armoryEverVisible = true;
          const first = armoryTrack.children[ARMORY_BUFFER];
          if (first) armoryInertia.resetTo(first.offsetTop);
        }
      } else {
        // Card sizes may have been invalidated by a resize that happened
        // while this view was hidden (layoutHallCards bails on a
        // zero-height track), so re-lay-out before measuring off it.
        layoutHallCards();
        hallInertia.measure();
      }
    });
  });
});

/* Theme is now nothing but a class on <html>.

   It used to be an orchestrated three-phase sequence: fade every visible
   saint image out, flip the class, wait for the page background to really
   finish fading, then fade the images back in once the new variant had
   decoded. All of that existed for one reason — each image had the theme's
   background colour baked into its own pixels, so a light-padded image
   revealed over a dark page read as a hard-edged white rectangle, and the
   two had to be choreographed to hide the swap.

   The images are now cropped to the painted icon itself, with no padding
   of either colour, so there is no second variant to swap to and nothing
   to hide. See crop_saints.py for the measurement that established the
   light and dark files were otherwise the same artwork. */
function applyTheme(isDark) {
  document.documentElement.classList.toggle('dark', isDark);
  try { localStorage.setItem('dark-mode', isDark ? '1' : '0'); } catch (e) { /* private-mode / storage disabled — toggle still works, just won't persist across reloads */ }
}

document.getElementById('dark-toggle').addEventListener('click', () => {
  applyTheme(!document.documentElement.classList.contains('dark'));
});

/* =====================================================================
   TWEEN — every position/rotation/scale animation in this file runs
   through this. No CSS transitions on those properties anywhere —
   see the note at the bottom of the file for why.
===================================================================== */
function tween(duration, onFrame, onComplete) {
  const ease = t => 1 - Math.pow(1 - t, 3);
  const start = performance.now();
  function step(now) {
    const raw = Math.min(1, (now - start) / duration);
    onFrame(ease(raw), raw);
    if (raw < 1) requestAnimationFrame(step);
    else if (onComplete) onComplete();
  }
  requestAnimationFrame(step);
}
function lerp(a, b, t) { return a + (b - a) * t; }

/* Reserves an item's row slot with a same-sized placeholder while the real
   element goes position:fixed, and dims/undims the rest of the row around
   it. Takes an already-measured rect rather than measuring itemEl itself,
   so the caller controls exactly which box is being reserved. */
function createPlaceholder(el, rect, className) {
  const placeholder = document.createElement('div');
  placeholder.className = className;
  placeholder.style.width = rect.width + 'px';
  placeholder.style.height = rect.height + 'px';
  placeholder.style.marginTop = getComputedStyle(el).marginTop;
  placeholder.style.marginBottom = getComputedStyle(el).marginBottom;
  el.after(placeholder);
  return placeholder;
}
function setSiblingsDim(track, itemSelector, exceptEl, dim) {
  track.querySelectorAll(itemSelector).forEach(el => {
    if (dim && el === exceptEl) return;
    el.classList.toggle('dim', dim);
  });
}

/* =====================================================================
   SHARED — infinite-loop carousel, driven by native touch/wheel scrolling
   (not custom JS physics). Native scrolling is what lets Chromium put
   this on its own composited scroll layer — touch-action:none would
   disqualify it and force scrollLeft writes onto the slower main-thread
   path, which is where visible jitter comes from.

   Trade-off: a native scroller has a true edge, and a correction can
   only be applied when it's safe to write scrollLeft (mid-momentum, a
   write on Android cancels the fling outright). So corrections are
   deferred until a gesture and its momentum have plausibly finished,
   backed by a generous clone buffer so a fling has room to run its
   course first. Comfortable for today's dataset sizes; an extremely
   small dataset narrows that margin.
===================================================================== */
function attachLoopScroll(trackEl, bufferCount, getItemCount, opts = {}) {
  const axis = opts.axis || 'x';
  const easeFactor = opts.easeFactor ?? 0.16; // wheel: fraction of the remaining distance closed per frame
  const scrollProp = axis === 'x' ? 'scrollLeft' : 'scrollTop';
  const offsetProp = axis === 'x' ? 'offsetLeft' : 'offsetTop';
  /* Called before anything that would move the track programmatically or
     respond to wheel input. Backed by dynamically toggling touch-action
     on trackEl (see setLocked below) for touch, since native panning
     can't be intercepted after the fact the way a wheel event can. */
  const blocked = opts.blocked || (() => false);

  let targetScroll = 0;
  let isEasing = false;
  let raf = null;
  /* The row's geometry, read from real offsets rather than multiplied out
     from one item's size. Deck cards are sized from their own image's
     pixel dimensions, so there is no single stride that describes the row.
     Measured offsets stay exact regardless: cyclicSlice fills head and
     tail with literal copies of body items, so the rendered row really is
     periodic with period bodySpan whatever the individual widths are, and
     a ±bodySpan correction always lands on identical content. */
  let headSpan = 0;   // where the first real (non-clone) item starts
  let bodySpan = 0;   // one full period — first real item to first tail item
  let lowerBound = 0; // one item in from the DOM's true leading edge

  function measure() {
    const count = getItemCount();
    const first = trackEl.children[bufferCount];
    const afterBody = trackEl.children[bufferCount + count];
    const edge = trackEl.children[1];
    const newBody = (first && afterBody) ? (afterBody[offsetProp] - first[offsetProp]) : 0;
    if (bodySpan && newBody && bodySpan !== newBody) {
      // item sizes changed (e.g. window resized) — rescale the current
      // position by the same ratio so it stays valid instead of drifting
      // further from reality with every resize until scrolling wedges
      const ratio = newBody / bodySpan;
      trackEl[scrollProp] = trackEl[scrollProp] * ratio;
      targetScroll = targetScroll * ratio;
    }
    bodySpan = newBody;
    headSpan = first ? first[offsetProp] : 0;
    lowerBound = edge ? edge[offsetProp] : 0;
  }

  function checkLoop() {
    if (bodySpan <= 0) return;
    const upperBound = headSpan + bodySpan;
    const pos = trackEl[scrollProp];
    if (pos < lowerBound) {
      const n = Math.ceil((lowerBound - pos) / bodySpan);
      trackEl[scrollProp] += n * bodySpan;
      targetScroll += n * bodySpan;
    } else if (pos > upperBound) {
      const n = Math.ceil((pos - upperBound) / bodySpan);
      trackEl[scrollProp] -= n * bodySpan;
      targetScroll -= n * bodySpan;
    }
  }

  function tick() {
    const current = trackEl[scrollProp];
    const diff = targetScroll - current;
    if (Math.abs(diff) < 0.5) {
      trackEl[scrollProp] = targetScroll;
      isEasing = false;
      raf = null;
      checkLoop();
      return;
    }
    trackEl[scrollProp] = current + diff * easeFactor;
    checkLoop();
    raf = requestAnimationFrame(tick);
  }

  function wrapTarget() {
    if (bodySpan <= 0) return;
    const upperBound = headSpan + bodySpan;
    if (targetScroll < lowerBound) {
      targetScroll += Math.ceil((lowerBound - targetScroll) / bodySpan) * bodySpan;
    } else if (targetScroll > upperBound) {
      targetScroll -= Math.ceil((targetScroll - upperBound) / bodySpan) * bodySpan;
    }
    /* Bring current into the SAME wrap-generation as the target, computed
       fresh from the actual gap each call — NOT by re-applying "shift
       current by whatever we just shifted target by". That simpler
       version compounds: a burst of wheel events faster than one paint
       (a real trackpad can do this) fires wrapTarget() several times
       before current ever moves, and each shift stacks on the last,
       walking current straight to the true DOM edge (verified: as few
       as 5-7 rapid events). Recomputing fresh instead converges toward
       the same small residual gap no matter how many times it runs. */
    if (bodySpan > 0) {
      const gap = trackEl[scrollProp] - targetScroll;
      const n = Math.round(gap / bodySpan);
      if (n !== 0) trackEl[scrollProp] -= n * bodySpan;
    }
  }

  trackEl.addEventListener('wheel', (e) => {
    if (blocked()) { e.preventDefault(); return; }
    let delta;
    if (axis === 'x') {
      delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    } else {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      delta = e.deltaY;
      e.stopPropagation();
    }
    if (!delta) return;
    e.preventDefault();
    targetScroll += delta;
    wrapTarget();
    isEasing = true;
    if (!raf) raf = requestAnimationFrame(tick);
  }, { passive: false });

  let touchActive = false;

  trackEl.addEventListener('scroll', () => {
    /* This was the one input path into checkLoop() that never checked
       blocked() — every other one (wheel, touch) does. A resize event
       (the address bar hiding while scrolling inside an open modal's
       panel is a very common way to trigger one on mobile) calls
       measure(), which rescales scrollLeft to stay proportionally valid
       — necessary, not something to skip — and that write fires this
       listener. Without the guard, checkLoop() could then silently wrap
       the row by a whole body-span while the modal is open and the row
       is hidden behind it. Since the small dataset means several DOM
       clones of the same saint exist across the buffer, the visible
       effect on close was a "ghost" of the same image fading in at the
       old position while the real one returned somewhere else — a
       different, still-visible clone catching the same undim step. */
    if (isEasing || blocked()) return;
    targetScroll = trackEl[scrollProp];
    if (touchActive) return; // don't write to scrollLeft mid-gesture — see touchstart/touchend below
    checkLoop();
  });

  // Native touch/momentum scrolling can keep driving scrollLeft for a
  // while after the finger lifts, and correcting it (writing to
  // scrollLeft) while a gesture or its momentum is still active doesn't
  // just fail to stick — on Android it desyncs the browser's own
  // touch-scroll tracking for the element, so it stops responding to
  // further touches altogether. Suppress corrections for the whole
  // gesture, plus a generous settle window afterwards, then correct once
  // it's safe.
  trackEl.addEventListener('touchstart', () => {
    touchActive = true;
    /* A touch always wins over a still-converging wheel ease (easeFactor
       is gentle, so a big glide takes several frames to settle) —
       otherwise tick() keeps overwriting scrollLeft under the touch and
       the two fight, barely moving anything. Stop the ease outright and
       hand off to native panning. */
    isEasing = false;
    if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
  }, { passive: true });
  trackEl.addEventListener('touchend', () => {
    setTimeout(() => { touchActive = false; }, 700);
    [750, 1200].forEach(delay => {
      setTimeout(() => {
        if (isEasing) return;
        targetScroll = trackEl[scrollProp];
        checkLoop();
      }, delay);
    });
  }, { passive: true });

  return {
    measure,
    // Average, not exact — items no longer share one width. Its only
    // consumer is createHallPromoteObserver's rootMargin, which is already
    // a deliberate approximation.
    getStride: () => { const n = getItemCount(); return n ? bodySpan / n : 0; },
    resetTo(value) { trackEl[scrollProp] = value; targetScroll = value; },
    // For external drivers (idle drift) that move scrollLeft themselves
    // outside of this module's own wheel/tick logic. Runs the loop-wrap
    // check synchronously, in the caller's own frame, rather than the
    // caller having to wait for the native 'scroll' event this module
    // also listens to — which fires async and isn't guaranteed to land
    // before the caller's next update, risking the two racing each other.
    syncAndWrap() {
      if (isEasing || blocked()) return 0;
      const before = trackEl[scrollProp];
      targetScroll = before;
      checkLoop();
      return trackEl[scrollProp] - before; // 0 on ordinary frames; the exact jump size only when a loop-wrap correction actually fired
    },
    /* Toggles the element between native-pannable (default, for
       compositor smoothness) and programmatic-only (during a modal
       tween, so a stray swipe can't move the row mid-animation).
       touch-action is read at gesture start, so this only ever takes
       effect for the NEXT touch — safe to call mid-tween. */
    setLocked(v) { trackEl.style.touchAction = v ? 'none' : (axis === 'x' ? 'pan-x' : 'pan-y'); }
  };
}

/* Idle auto-scroll, deliberately kept separate from attachLoopScroll's own
   wheel/touch logic. It only ever does one thing — nudge scrollLeft
   forward — but calls back into the loop API's own syncAndWrap()
   synchronously after each nudge, so the infinite-loop wrap is checked in
   the same frame rather than via an async 'scroll' event racing against
   drift's own next update. */
function attachIdleDrift(trackEl, loopApi, opts = {}) {
  const idleMs = opts.idleMs ?? 5000;
  const speed = opts.speed ?? 22; // px/s — the speed drift cruises at once it's ramped up
  /* Drift ramps up on the exact mirror of tick()'s wheel-ease decay:
     velocity rises toward `speed` by closing the remaining gap by this
     same fraction each frame. Reusing tick()'s own constant (not a
     separate tuned value) is what makes it a true inverse. */
  const rampFactor = opts.rampFactor ?? 0.16;
  const scrollProp = (opts.axis || 'x') === 'x' ? 'scrollLeft' : 'scrollTop';

  let lastInteraction = performance.now();
  let paused = false;
  let active = false;
  let pos = null;
  let currentSpeed = 0;
  let lastFrame = performance.now();

  function markInteraction() {
    lastInteraction = performance.now();
    active = false;
    pos = null;
    currentSpeed = 0;
  }
  trackEl.addEventListener('wheel', markInteraction, { passive: true });
  // touch gestures never fire 'wheel' — without these, drift had no way to
  // know mobile scrolling was happening at all, and kept nudging scrollLeft
  // on top of it, fighting the user's own touch-scroll.
  trackEl.addEventListener('touchstart', markInteraction, { passive: true });
  trackEl.addEventListener('touchmove', markInteraction, { passive: true });

  function frame(now) {
    const dt = Math.min(now - lastFrame, 50);
    lastFrame = now;
    // An unrendered track can't scroll: it reads back 0 and ignores writes,
    // so drifting against one silently resets the position it will restore
    // the moment the view is shown again. Callers also pause on view
    // switch; this is the backstop for any path that doesn't.
    if (!paused && !trackEl.clientWidth && !trackEl.clientHeight) { active = false; pos = null; currentSpeed = 0; }
    else if (!paused) {
      const idleFor = now - lastInteraction;
      if (idleFor > idleMs) {
        if (!active) { active = true; pos = trackEl[scrollProp]; currentSpeed = 0; }
        // Same shape as tick()'s deceleration, run toward `speed` instead
        // of toward zero — accelerates quickly at first, then eases into
        // cruising speed rather than snapping straight to it.
        currentSpeed += (speed - currentSpeed) * rampFactor;
        pos += currentSpeed * (dt / 1000);
        trackEl[scrollProp] = pos;
        // synchronous correction, right here, no waiting on an async event —
        // add the delta, don't replace pos with the (rounded) DOM readback
        pos += loopApi.syncAndWrap();
      } else if (active) {
        active = false;
        pos = null;
        currentSpeed = 0;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    pause() { paused = true; active = false; pos = null; currentSpeed = 0; },
    resume() { paused = false; lastInteraction = performance.now(); }
  };
}

function cyclicSlice(list, start, count) {
  const out = [];
  const n = list.length;
  if (n === 0) return out;
  for (let i = 0; i < count; i++) out.push(list[((start + i) % n + n) % n]);
  return out;
}

// With very few unique items, the infinite-loop's body span is so small
// relative to normal scroll speed that it wraps almost continuously —
// which looks and feels like it's stuck bouncing in place rather than
// scrolling smoothly, even though the position math is correct. Virtually
// repeating the real items (looping over them with modulo) up to a
// minimum count fixes this without duplicating any real data or state.
const MIN_LOOP_COUNT = 10;
function loopSafeList(list) {
  const n = list.length;
  if (n === 0) return [];
  if (n >= MIN_LOOP_COUNT) return list;
  const reps = Math.ceil(MIN_LOOP_COUNT / n);
  const out = [];
  for (let r = 0; r < reps; r++) out.push(...list);
  return out;
}

/* items: [{text, ...}]; onItemClick receives the item */
/* Attaches the scroll loop exactly ONCE per container. Re-rendering the
   same carousel repeatedly (e.g. opening a new saint's modal) must reuse
   this, not call attachLoopScroll again — every call adds its own
   wheel/scroll listeners to the same persistent DOM node, and several of
   them competing for the same scrollTop is what eventually broke this. */
function createQuoteCarousel(containerEl, rows, blocked) {
  const buffer = Math.max(rows, 24); // generous, so fast wheel-flicks never outrun the clone buffer (same fix as the Armory rack)
  let items = [];
  const loop = attachLoopScroll(containerEl, buffer, () => items.length, { axis: 'y', blocked });

  function render(newItems, onItemClick) {
    items = newItems;
    containerEl.innerHTML = '';
    if (!items.length) return;
    const head = cyclicSlice(items, items.length - buffer, buffer);
    const tail = cyclicSlice(items, 0, buffer);
    const full = [...head, ...items, ...tail];
    full.forEach(item => {
      const el = document.createElement('div');
      el.className = 'q';
      el.textContent = `\u201C${item.text}\u201D`;
      if (onItemClick) el.addEventListener('click', (e) => { e.stopPropagation(); onItemClick(item); });
      containerEl.appendChild(el);
    });
    requestAnimationFrame(remeasure);
  }

  // Also called from outside whenever this carousel goes from hidden to
  // visible: offsets read while display:none are all zero, so the geometry
  // captured then has to be retaken before the loop can wrap correctly.
  function remeasure() {
    loop.measure();
    const first = containerEl.children[buffer];
    if (first) loop.resetTo(first.offsetTop);
  }

  return { render, remeasure, setLocked: loop.setLocked };
}

/* =====================================================================
   DATA — one folder per saint under assets/saints/, auto-discovered
   via the GitHub API (one call lists the whole repo tree). For each
   folder: the first image file becomes the card art, quotes.txt (one
   quote per line) becomes the key sayings, and every other .txt file
   becomes a chapter — ordered numerically by the number at the start
   of its filename (so "11." sorts after "9.", not between "1." and
   "2."). Add a folder, the carousel picks it up automatically.
===================================================================== */
function naturalCompare(a, b) {
  const na = parseInt((a.match(/^\d+/) || ['999999'])[0], 10);
  const nb = parseInt((b.match(/^\d+/) || ['999999'])[0], 10);
  if (na !== nb) return na - nb;
  return a.localeCompare(b);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Wraps exact substring matches in <span class="quote-anchor" data-idx="n">
   so a click on the matching carousel quote can scrollIntoView + highlight
   it directly, with no runtime text-searching at click time. */
function buildChapterHtml(rawBody, anchors) {
  let html = '';
  let cursor = 0;
  [...anchors].sort((a, b) => a.offset - b.offset).forEach(a => {
    html += escapeHtml(rawBody.slice(cursor, a.offset));
    const chunk = rawBody.slice(a.offset, a.offset + a.length);
    html += `<span class="quote-anchor" data-idx="${a.quoteIndex}">${escapeHtml(chunk)}</span>`;
    cursor = a.offset + a.length;
  });
  html += escapeHtml(rawBody.slice(cursor));
  return html.split(/\n{2,}/).map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`).join('');
}

/* For each quote, find the first chapter containing it verbatim. Quotes
   with no exact match anywhere are dropped from the carousel entirely
   (per spec — no link, no display). */
function linkQuotesToChapters(quoteLines, chapters) {
  const linked = [];
  quoteLines.forEach((text) => {
    for (let ci = 0; ci < chapters.length; ci++) {
      const offset = chapters[ci].body.indexOf(text);
      if (offset !== -1) {
        linked.push({ text, chapterIndex: ci, offset });
        break;
      }
    }
  });
  return linked.map((lq, i) => ({ ...lq, quoteIndex: i }));
}

/* Saint folders carry a sortable year-of-death prefix: four digits then
   B/C for BC/AD — "0353C St Antony the Great", "1450B Moses". Neither
   belongs on screen, so this turns it back into readable form.
   `display` is what the reader sees; `base` is the bare name, used for
   matching Armory quote sources (which have no year prefix) — matching
   on `display` instead would break attribution the moment a folder was
   renamed. */
function parseSaintFolder(folder) {
  const m = /^(\d{1,4})\s*([BbCc])[\s._\-—]*(.+)$/.exec(folder.trim());
  if (!m) return { display: folder, base: folder, sortKey: null };
  const year = parseInt(m[1], 10);
  const isBC = m[2].toUpperCase() === 'B';
  const era = isBC ? 'BC' : 'AD';
  const base = m[3].trim();
  if (!base) return { display: folder, base: folder, sortKey: null };
  /* Alphabetical folder order breaks across the era boundary ("1450B
     Moses" falls between "0353C" and "1859C") and runs BC years
     backwards. Signing the year (BC negative) fixes both with one
     numeric sort. */
  return { display: `${year}${era} ${base}`, base, sortKey: isBC ? -year : year };
}

/* intro.txt: an optional feast-day line, then the prose shown under the
   name in the deck. The feast line is what Calendar ordering sorts on;
   a saint without one keeps its chronological position, so the ordering
   converts itself over as intro.txt files are added rather than needing
   every saint to have one at once. */
const MONTH_NAMES = ['january','february','march','april','may','june',
                     'july','august','september','october','november','december'];

function parseFeastDate(raw) {
  const s = raw.trim().toLowerCase();
  let month = 0;
  for (let i = 0; i < MONTH_NAMES.length; i++) {
    if (new RegExp(`\\b${MONTH_NAMES[i].slice(0, 3)}`).test(s)) { month = i + 1; break; }
  }
  if (month) {
    const day = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?\b/);
    return day ? { month, day: +day[1] } : null;
  }
  // Purely numeric ("17/01", "01-17"). Whichever number can't be a month
  // is the day; when both could be, read it day-first to match the
  // written form ("17 January") the rest of this parser expects.
  const nums = s.match(/\b\d{1,2}\b/g);
  if (!nums || nums.length < 2) return null;
  const a = +nums[0], b = +nums[1];
  if (a > 12 && b >= 1 && b <= 12) return { month: b, day: a };
  if (b > 12 && a >= 1 && a <= 12) return { month: a, day: b };
  if (a >= 1 && a <= 31 && b >= 1 && b <= 12) return { month: b, day: a };
  return null;
}

function parseIntro(raw) {
  const lines = (raw || '').replace(/\r/g, '').split('\n');
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  let feast = null;
  const m = i < lines.length && /^\s*feast(?:\s*day)?\s*[:–—-]\s*(.+)$/i.exec(lines[i]);
  if (m) { feast = parseFeastDate(m[1]); i++; }
  return {
    feast,
    feastKey: feast ? feast.month * 100 + feast.day : null,
    text: lines.slice(i).join('\n').trim()
  };
}

const FALLBACK_IMAGE_W = 521;
const FALLBACK_IMAGE_H = 1250;
const IMAGE_PROBE_TIMEOUT_MS = 2500;

/* Card geometry comes from each image's real pixel dimensions rather than
   a shared aspect ratio, so they have to be known before the first layout:
   a card that resized after its own image decoded would shift every
   caption baseline and invalidate the offsets the carousel's loop-wrap
   already measured.

   Deliberately the FULL image, not the far cheaper -thumb: two thumb
   generators are in use (make_thumbs.py emits a fixed 24px width,
   render_v3_saints.py divides by 4), so thumb pixel dimensions are not on
   a common scale across saints — and a common scale is the whole basis of
   the deck's sizing. Reading them would render a make_thumbs saint about
   five times the size of a render_v3 one. The full images are ~100KB and
   are fetched on sight anyway (HALL_PROMOTE_DWELL is 0), so this only
   moves that fetch behind the loading screen, warming the cache for it.

   A saint whose probe fails or hangs falls back to the deck's historical
   1:2.4 proportions instead of blocking the whole render. */
function probeImageSizes(saints) {
  return Promise.all(saints.map(s => new Promise(resolve => {
    let settled = false;
    const done = (w, h) => {
      if (settled) return;
      settled = true;
      s.imgW = w; s.imgH = h;
      resolve();
    };
    const timer = setTimeout(() => done(FALLBACK_IMAGE_W, FALLBACK_IMAGE_H), IMAGE_PROBE_TIMEOUT_MS);
    const probe = new Image();
    probe.onload = () => { clearTimeout(timer); done(probe.naturalWidth, probe.naturalHeight); };
    probe.onerror = () => { clearTimeout(timer); done(FALLBACK_IMAGE_W, FALLBACK_IMAGE_H); };
    probe.src = s.image;
  })));
}

function saintMatchesSource(saint, source) {
  const src = source.trim().toLowerCase();
  return (saint.base || saint.name).toLowerCase() === src
      || saint.name.toLowerCase() === src;
}

function placeholderIconDataUri() {
  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
    <rect width="200" height="300" fill="#fdfdfc"/>
    <circle cx="100" cy="70" r="34" fill="none" stroke="#8a2e26" stroke-width="1" opacity="0.7"/>
    <circle cx="100" cy="95" r="26" fill="none" stroke="#55524a" stroke-width="1"/>
    <path d="M100 121 C60 128 48 190 48 280 L152 280 C152 190 140 128 100 121 Z" fill="none" stroke="#55524a" stroke-width="1"/>
  </svg>`;
  return 'data:image/svg+xml;base64,' + btoa(svg);
}

/* Small built-in demo, used only if GITHUB_OWNER/REPO above are left
   unconfigured or the API call fails — so the page still demonstrates
   its own features (including a quote that's deliberately excluded
   because it has no exact match, to show that behaviour working). */
function fallbackSaints() {
  const chaptersA = [
    { title: '1. Early Life', body: `He was born in Egypt of good and prosperous parents. In his eighteenth year he heard the Gospel read in church.\n\nHearing it, he gave away all he owned and began to live a life of discipline near his village.` },
    { title: '2. Into the Desert', body: `He withdrew further into the desert, shutting himself in an old fort for nearly twenty years.\n\nHe who sits in solitude and is quiet hath escaped from three wars: hearing, speech, and sight.` }
  ];
  const chaptersB = [
    { title: '1. On Silence', body: `Keep your mind in hell, and despair not.\n\nSilence is not always the mark of wisdom, but it is nearly always its safest form.` }
  ];
  return [
    {
      id: 'demo-antony', name: 'Demo Saint (unconfigured)', image: placeholderIconDataUri(), thumb: placeholderIconDataUri(),
      intro: '', feast: null, feastKey: null,
      chapters: chaptersA,
      linkedQuotes: linkQuotesToChapters([
        'He who sits in solitude and is quiet hath escaped from three wars.',
        'This exact line does not appear in the text, so it is excluded.'
      ], chaptersA)
    },
    {
      id: 'demo-silouan', name: 'Demo Saint Two', image: placeholderIconDataUri(), thumb: placeholderIconDataUri(),
      intro: '', feast: null, feastKey: null,
      chapters: chaptersB,
      linkedQuotes: linkQuotesToChapters(['Keep your mind in hell, and despair not.'], chaptersB)
    }
  ];
}

async function fetchText(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`fetch failed: ${url}`);
  return res.text();
}

/* GitHub's unauthenticated API allows 60 requests/hour per IP, spent one
   per page load — fine for visitors, not for a device-testing session
   (40+ reloads/hour is normal), after which loadSaints() falls through
   to the demo and real images vanish. Caching the folder listing means
   a reload costs nothing, and a listing already seen keeps working even
   once the limit is hit. */
const TREE_CACHE_KEY = 'saints-tree-cache-v1';
const TREE_CACHE_MS = 10 * 60 * 1000;

/* Mobile browsers routinely suspend a backgrounded tab rather than
   killing it — switching back after minutes or hours often restores the
   exact DOM/JS state from whenever the page last actually ran, with no
   script re-execution at all. Without this, "reopening" the site can
   silently show whatever was current at first load indefinitely: the
   saint count frozen, images that failed once staying failed, no retry
   ever happening, even though the code itself is completely fine and
   would show fresh data on an actual reload.
   Two signals catch this: 'pageshow' with event.persisted is the
   unambiguous case (the page came from the back-forward cache, so
   nothing here has run since); a long-hidden tab becoming visible again
   is the more common one on mobile, treated as stale once it's been
   hidden longer than the tree cache's own validity window — no point
   reloading for a quick app-switch-and-back, since the data wouldn't
   have changed regardless. */
window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
let hiddenAt = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && (Date.now() - hiddenAt) > TREE_CACHE_MS) location.reload();
  hiddenAt = null;
});

function readTreeCache(url) {
  try {
    const raw = localStorage.getItem(TREE_CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    return (c && c.url === url && Array.isArray(c.tree)) ? c : null;
  } catch (e) { return null; }
}

async function fetchTree(treeUrl) {
  const cached = readTreeCache(treeUrl);
  if (cached && (Date.now() - cached.at) < TREE_CACHE_MS) {
    return { tree: cached.tree, cache: 'fresh', at: cached.at };
  }
  try {
    const res = await fetch(treeUrl);
    if (!res.ok) throw new Error(`GitHub API returned ${res.status} for ${treeUrl}`);
    const json = await res.json();
    if (!json.tree) throw new Error('GitHub API response had no tree');
    try {
      localStorage.setItem(TREE_CACHE_KEY, JSON.stringify({ url: treeUrl, at: Date.now(), tree: json.tree }));
    } catch (e) { /* private mode / quota — caching is an optimisation, not a requirement */ }
    return { tree: json.tree, cache: 'live' };
  } catch (err) {
    // Rather than drop straight to demo data, reuse the last known good
    // listing. The folder names change far less often than the rate
    // limit resets, so a stale listing is nearly always still correct.
    if (cached) {
      console.warn('GitHub API unavailable, reusing the cached folder listing —', err.message);
      return { tree: cached.tree, cache: 'stale', at: cached.at };
    }
    throw err;
  }
}

async function loadSaints() {
  if (GITHUB_OWNER === 'YOUR_GITHUB_USERNAME' || GITHUB_REPO === 'YOUR_REPO_NAME') {
    console.warn('GITHUB_OWNER/GITHUB_REPO are not configured — showing the built-in demo. Fill them in at the top of the script.');
    return { saints: fallbackSaints(), source: 'unconfigured' };
  }
  try {
    const treeUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
    const { tree: treeEntries, cache, at: cacheAt } = await fetchTree(treeUrl);
    const tree = { tree: treeEntries };

    const folders = {};
    tree.tree
      .filter(item => item.type === 'blob' && item.path.startsWith('assets/saints/'))
      .forEach(item => {
        const rel = item.path.slice('assets/saints/'.length);
        const slash = rel.indexOf('/');
        if (slash === -1) return;
        const folder = rel.slice(0, slash);
        const file = rel.slice(slash + 1);
        if (file.includes('/')) return; // ignore nested subfolders
        (folders[folder] = folders[folder] || []).push(file);
      });

    if (!Object.keys(folders).length) {
      console.warn(`No files found under assets/saints/ in ${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}. Check the path and branch name.`);
      return { saints: fallbackSaints(), source: 'empty' };
    }

    const skipped = [];
    const folderNames = Object.keys(folders).sort();
    const results = await Promise.all(folderNames.map(async (folder) => {
      const files = folders[folder];
      const isImageExt = f => /\.(jpe?g|png|webp|gif|avif|heic|heif|bmp|svg)$/i.test(f);
      const image = files.find(f => isImageExt(f) && !/-thumb\.[^.]+$/i.test(f) && !/-dark\.[^.]+$/i.test(f));
      const quotesFile = files.find(f => f.toLowerCase() === 'quotes.txt');
      const introFile = files.find(f => f.toLowerCase() === 'intro.txt');
      const chapterFiles = files.filter(f => /\.txt$/i.test(f) && !/^(quotes|intro)\.txt$/i.test(f)).sort(naturalCompare);
      if (!image) { skipped.push(folder); return null; }

      const base = `assets/saints/${encodeURIComponent(folder)}/`;
      const [quotesRaw, introRaw, chapters] = await Promise.all([
        quotesFile ? fetchText(base + encodeURIComponent(quotesFile)).catch(() => '') : Promise.resolve(''),
        introFile ? fetchText(base + encodeURIComponent(introFile)).catch(() => '') : Promise.resolve(''),
        Promise.all(chapterFiles.map(async (cf) => {
          const body = await fetchText(base + encodeURIComponent(cf)).catch((e) => { console.warn(`Could not fetch ${base}${cf}:`, e); return ''; });
          return { title: cf.replace(/\.txt$/i, ''), body: body.trim() };
        }))
      ]);
      const quoteLines = quotesRaw.split('\n').map(l => l.trim()).filter(Boolean);
      const parsed = parseSaintFolder(folder);
      const intro = parseIntro(introRaw);

      const imageForMode = f => base + encodeURIComponent(f);
      const thumbOf = f => f.replace(/\.[^.]+$/, '-thumb.jpg');

      return {
        id: folder,
        name: parsed.display,
        base: parsed.base,
        sortKey: parsed.sortKey,
        image: imageForMode(image),
        thumb: imageForMode(thumbOf(image)),
        intro: intro.text,
        feast: intro.feast,
        feastKey: intro.feastKey,
        chapters,
        linkedQuotes: linkQuotesToChapters(quoteLines, chapters)
      };
    }));
    /* Chronological, not alphabetical. Folders with no parseable year
       keep their alphabetical order and sit after the dated ones rather
       than being dropped into the middle of the timeline at year zero. */
    const saints = results.filter(Boolean).sort((a, b) => {
      if (a.sortKey === null && b.sortKey === null) return naturalCompare(a.name, b.name);
      if (a.sortKey === null) return 1;
      if (b.sortKey === null) return -1;
      if (a.sortKey !== b.sortKey) return a.sortKey - b.sortKey;
      return naturalCompare(a.base, b.base);
    });
    if (skipped.length) console.warn('Skipped folders with no image file:', skipped);
    if (!saints.length) return { saints: fallbackSaints(), source: 'empty' };
    return { saints, source: 'live', skipped, cache, cacheAt };
  } catch (err) {
    console.warn('Falling back to the built-in demo saints — GitHub fetch failed:', err);
    return { saints: fallbackSaints(), source: 'error' };
  }
}

let SAINTS = [];

/* =====================================================================
   HALL OF SAINTS — carousel
===================================================================== */
const hallTrack = document.getElementById('hall-track');
const hallStatus = document.getElementById('hall-status');
const LOOP_BUFFER = 24; // Reverted from 40. That widening was meant to give native touch
                         // momentum extra room to run before a correction was needed, but a real
                         // device recording showed the auto-scroll dropping frames irregularly —
                         // consistent with the extra ~40 DOM nodes (98 vs 58 children) costing
                         // real per-frame layout/paint work on actual mobile hardware, invisible
                         // in this sandbox's testing. 24 is what the original file used.

/* Deck geometry. Every image is drawn at ONE shared scale factor, and every
   saint's name sits on the same horizontal line — so widths and heights are
   both ragged, reflecting the real proportions of each picture rather than a
   common crop, while the typography stays regular.

   That name line is a fixed fraction of the viewport, NOT wherever the
   tallest image happens to end. Deriving it from the image meant the
   tallest saint set the line, which on most screens drove it almost to the
   bottom edge — and since the compact modal's panel begins below the name,
   that left the chapters and quotes with no room to appear in at all. The
   images are now fitted to the space above the line instead of the line
   being pushed down to clear the images.

   Consequence worth knowing: since the scale factor is applied to source
   pixel dimensions, every saint image must be exported at the same pixel
   density. One exported at 2x renders twice the size of its neighbours,
   and the page has no way to tell that apart from a genuinely larger icon. */
const CARD_CAPTION_GAP = 12;
const NAME_LINE_FRACTION_DESKTOP = 5 / 9; // of viewport height, measured to the top of the name
// Compact/mobile sits the name higher (3/8 vs 5/9) so the image renders
// smaller and the source-text panel below it gets more room.
const NAME_LINE_FRACTION_COMPACT = 3 / 8;
const MOBILE_BREAKPOINT = 700; // matches the header's own @media(max-width:700px)
function nameLineFraction() {
  return window.innerWidth <= MOBILE_BREAKPOINT ? NAME_LINE_FRACTION_COMPACT : NAME_LINE_FRACTION_DESKTOP;
}
const DECK_SIDE_MARGIN = 20;      // keeps the widest card clear of both screen edges

function layoutHallCards() {
  const items = [...hallTrack.querySelectorAll('.saint-item')];
  if (!items.length) return;
  // A hidden view has no layout: the track measures 0x0 and every card
  // would be sized against that, silently wrecking the deck for when it
  // comes back. The nav handler re-runs this on the way in.
  if (!hallTrack.clientHeight || !hallTrack.clientWidth) return;
  // Absolute y of every card's top edge — all items top-align in the track,
  // so one measurement covers them all.
  const cardTopAbs = hallTrack.getBoundingClientRect().top + parseFloat(getComputedStyle(items[0]).marginTop);
  const nameLineY = window.innerHeight * nameLineFraction();
  const availH = Math.max(80, nameLineY - CARD_CAPTION_GAP - cardTopAbs);
  const maxImgH = Math.max(...SAINTS.map(s => s.imgH || FALLBACK_IMAGE_H));
  /* Height alone can't set the scale: on a narrow screen a tall-enough
     card comes out wider than the viewport (measured on a 375px phone,
     the widest saint rendered 429px across and hung off both edges).
     Whichever axis runs out first wins. */
  const maxImgW = Math.max(...SAINTS.map(s => s.imgW || FALLBACK_IMAGE_W));
  const availW = Math.max(80, hallTrack.clientWidth - DECK_SIDE_MARGIN);
  const scale = Math.min(availH / maxImgH, availW / maxImgW);
  deckMaxCardW = maxImgW * scale; // read by isModalCompact() — see its comment
  layoutModalColumns();           // the modal's middle column IS this width

  items.forEach(item => {
    const s = item._saint;
    if (!s) return;
    const w = (s.imgW || FALLBACK_IMAGE_W) * scale;
    const h = (s.imgH || FALLBACK_IMAGE_H) * scale;
    const card = item.querySelector('.saint-card');
    card.style.setProperty('--card-w', w + 'px');
    card.style.setProperty('--card-h', h + 'px');
    const caption = item.querySelector('.saint-caption');
    /* Closes the gap from this image's own bottom down to the fixed name
       line — availH, not the tallest rendered card. Those are equal only
       while height is the binding axis; when width binds, every card is
       shorter than the budget and keying off the tallest one would lift the
       whole row of names off the line they are supposed to share. */
    caption.style.marginTop = (availH - h + CARD_CAPTION_GAP) + 'px';
    // Pin the text blocks to the image's width so the item's own width is
    // exactly the card's. Left free, a long name would make the item wider
    // than its picture, which changes the row's spacing and the box the
    // modal animates.
    caption.style.width = w + 'px';
    const intro = item.querySelector('.saint-intro');
    if (intro) intro.style.width = w + 'px';
  });
}

/* Calendar order runs the church year rather than the timeline. A saint
   whose intro.txt carries no feast line keeps its chronological position
   and sits after the dated ones — the same convention parseSaintFolder's
   null sortKey already uses for undated folders.

   That fallback is what makes this self-converting: with no intro.txt
   anywhere, this returns exactly the chronological order, and each saint
   moves into its calendar position as its own intro.txt lands. There is no
   flag to flip once enough of them exist. */
let hallOrder = 'calendar';

function orderedSaints() {
  if (hallOrder !== 'calendar') return SAINTS;
  const dated = SAINTS.filter(s => s.feastKey !== null).sort((a, b) => a.feastKey - b.feastKey);
  const undated = SAINTS.filter(s => s.feastKey === null);
  return [...dated, ...undated];
}

document.querySelectorAll('#hall-order-nav a').forEach(a => {
  a.addEventListener('click', () => {
    // Re-rendering replaces every node in the row, which would strand an
    // open modal's fixed-position card and its placeholder.
    if (hallBusy || currentHallOpen || a.dataset.order === hallOrder) return;
    document.querySelectorAll('#hall-order-nav a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    hallOrder = a.dataset.order;
    renderHall();
  });
});

function renderHall() {
  hallTrack.innerHTML = '';
  if (!SAINTS.length) {
    hallStatus.textContent = 'No saints found in assets/saints.';
    hallStatus.style.display = 'flex';
    return;
  }
  hallStatus.style.display = 'none';

  const loopSaints = loopSafeList(orderedSaints());
  const head = cyclicSlice(loopSaints, loopSaints.length - LOOP_BUFFER, LOOP_BUFFER);
  const tail = cyclicSlice(loopSaints, 0, LOOP_BUFFER);
  const full = [...head, ...loopSaints, ...tail];

  full.forEach((s) => {
    const item = document.createElement('div');
    item.className = 'saint-item';
    item.dataset.id = s.id;
    item._saint = s; // layoutHallCards() needs this item's own pixel dimensions; every loop clone points at the same saint object
    item.innerHTML = `
      <div class="saint-card"><img class="thumb" src="${s.thumb}" alt="" aria-hidden="true"><img class="full" data-src="${s.image}" alt="${s.name}" decoding="async" onload="this.classList.add('loaded')" onerror="this.style.display='none';console.warn('Saint image failed to load:', this.getAttribute('src'))"></div>
      <div class="saint-caption">${s.name}</div>
      ${s.intro ? `<div class="saint-intro">${escapeHtml(s.intro)}</div>` : ''}`;
    item.addEventListener('click', () => {
      if (hallBusy) return;
      if (item.classList.contains('selected')) { if (hallClose.onclick) hallClose.onclick(); return; }
      // a deliberate tap can't wait out the dwell timer for the real image
      promoteHallImage(item.querySelector('.saint-card img.full'));
      openHallModal(item, s);
    });
    hallTrack.appendChild(item);
  });

  // Before the measure() below, not after — the loop-wrap geometry is read
  // from real offsets now, so the cards have to be at their final sizes
  // first or every bound would be measured against a collapsed row.
  layoutHallCards();

  requestAnimationFrame(() => {
    hallInertia.measure();
    const first = hallTrack.children[LOOP_BUFFER];
    if (first) hallInertia.resetTo(first.offsetLeft);
    createHallPromoteObserver();
  });
}

const hallInertia = attachLoopScroll(hallTrack, LOOP_BUFFER, () => loopSafeList(orderedSaints()).length,
  { axis: 'x', blocked: () => hallBusy || !!currentHallOpen });
const hallDrift = attachIdleDrift(hallTrack, hallInertia);

/* =====================================================================
   HALL FULL-IMAGE PROMOTION — render() leaves every .saint-card img.full
   without a src (only data-src), so a fast fling across the
   loop buffer doesn't force every passing card to decode a full-res
   image at once. A shared IntersectionObserver watches every .full img;
   entering the margin starts a dwell timer before the real src gets set,
   so a card only pays the decode cost once the user has actually
   lingered near it — leaving before the timer fires cancels it.
   Applied uniformly to every item (real + loop clones); clones just
   happen to sit off-screen so their dwell timers rarely fire.
===================================================================== */
const HALL_PROMOTE_DWELL = 0;
const hallPendingPromotes = new Map(); // img.full -> pending setTimeout id
let hallPromoteObserver = null;
let hallPromoteObserverPrimed = false; // first callback batch = items already in range at observe() time — those skip the dwell

function promoteHallImage(img) {
  if (!img || img.getAttribute('src')) return;
  const pending = hallPendingPromotes.get(img);
  if (pending) { clearTimeout(pending); hallPendingPromotes.delete(img); }
  if (img.dataset.src) img.setAttribute('src', img.dataset.src);
}

function createHallPromoteObserver() {
  if (hallPromoteObserver) hallPromoteObserver.disconnect();
  hallPendingPromotes.forEach(id => clearTimeout(id));
  hallPendingPromotes.clear();
  hallPromoteObserverPrimed = false;
  // rootMargin can't be mutated after creation, so this is a fixed
  // approximation (one card stride, measured for the screen this loaded
  // on) rather than something recalculated on every scroll. It's only
  // rebuilt — same approach, remeasured — on a genuine resize, see below.
  const stride = hallInertia.getStride() || Math.max(window.innerWidth, window.innerHeight);
  const margin = Math.ceil(stride);
  hallPromoteObserver = new IntersectionObserver((entries) => {
    const primingBatch = !hallPromoteObserverPrimed;
    hallPromoteObserverPrimed = true;
    entries.forEach((entry) => {
      const img = entry.target;
      if (!entry.isIntersecting) {
        const pending = hallPendingPromotes.get(img);
        if (pending) { clearTimeout(pending); hallPendingPromotes.delete(img); }
        return;
      }
      if (primingBatch) { promoteHallImage(img); return; }
      if (img.getAttribute('src') || hallPendingPromotes.has(img)) return;
      const id = setTimeout(() => { hallPendingPromotes.delete(img); promoteHallImage(img); }, HALL_PROMOTE_DWELL);
      hallPendingPromotes.set(img, id);
    });
  }, { root: hallTrack, rootMargin: `0px ${margin}px 0px ${margin}px`, threshold: 0 });
  hallTrack.querySelectorAll('.saint-card img.full').forEach(img => hallPromoteObserver.observe(img));
}

const hallQuotesCarouselDesktop = createQuoteCarousel(document.getElementById('hall-quotes-track-desktop'), 7, () => hallBusy);
const hallQuotesCarouselMobile = createQuoteCarousel(document.getElementById('hall-quotes-track-mobile'), 3, () => hallBusy);

// The panel itself no longer scrolls — its pane does, so that is the root
// the reveal sentinels and sticky headers have to be measured against.
