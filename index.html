async function fetchText(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`fetch failed: ${url}`);
  return res.text();
}

/* GitHub's unauthenticated API allows 60 requests/hour per IP, spent one
   per page load — fine for visitors, not for a device-testing session
   (40+ reloads/hour is normal), after which loadSaints() falls through
   to the demo and real images vanish. Caching the folder listing means
   a reload costs nothing, and a listing already seen keeps working even
   once the limit is hit. */
const TREE_CACHE_KEY = 'saints-tree-cache-v1';
const TREE_CACHE_MS = 10 * 60 * 1000;

/* Mobile browsers routinely suspend a backgrounded tab rather than
   killing it — switching back after minutes or hours often restores the
   exact DOM/JS state from whenever the page last actually ran, with no
   script re-execution at all. Without this, "reopening" the site can
   silently show whatever was current at first load indefinitely: the
   saint count frozen, images that failed once staying failed, no retry
   ever happening, even though the code itself is completely fine and
   would show fresh data on an actual reload.
   Two signals catch this: 'pageshow' with event.persisted is the
   unambiguous case (the page came from the back-forward cache, so
   nothing here has run since); a long-hidden tab becoming visible again
   is the more common one on mobile, treated as stale once it's been
   hidden longer than the tree cache's own validity window — no point
   reloading for a quick app-switch-and-back, since the data wouldn't
   have changed regardless. */
window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
let hiddenAt = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && (Date.now() - hiddenAt) > TREE_CACHE_MS) location.reload();
  hiddenAt = null;
});

function readTreeCache(url) {
  try {
    const raw = localStorage.getItem(TREE_CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    return (c && c.url === url && Array.isArray(c.tree)) ? c : null;
  } catch (e) { return null; }
}

async function fetchTree(treeUrl) {
  const cached = readTreeCache(treeUrl);
  if (cached && (Date.now() - cached.at) < TREE_CACHE_MS) {
    return { tree: cached.tree, cache: 'fresh', at: cached.at };
  }
  try {
    const res = await fetch(treeUrl);
    if (!res.ok) throw new Error(`GitHub API returned ${res.status} for ${treeUrl}`);
    const json = await res.json();
    if (!json.tree) throw new Error('GitHub API response had no tree');
    try {
      localStorage.setItem(TREE_CACHE_KEY, JSON.stringify({ url: treeUrl, at: Date.now(), tree: json.tree }));
    } catch (e) { /* private mode / quota — caching is an optimisation, not a requirement */ }
    return { tree: json.tree, cache: 'live' };
  } catch (err) {
    // Rather than drop straight to demo data, reuse the last known good
    // listing. The folder names change far less often than the rate
    // limit resets, so a stale listing is nearly always still correct.
    if (cached) {
      console.warn('GitHub API unavailable, reusing the cached folder listing —', err.message);
      return { tree: cached.tree, cache: 'stale', at: cached.at };
    }
    throw err;
  }
}

async function loadSaints() {
  if (GITHUB_OWNER === 'YOUR_GITHUB_USERNAME' || GITHUB_REPO === 'YOUR_REPO_NAME') {
    console.warn('GITHUB_OWNER/GITHUB_REPO are not configured — showing the built-in demo. Fill them in at the top of the script.');
    return { saints: fallbackSaints(), source: 'unconfigured' };
  }
  try {
    const treeUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
    const { tree: treeEntries, cache, at: cacheAt } = await fetchTree(treeUrl);
    const tree = { tree: treeEntries };

    const folders = {};
    tree.tree
      .filter(item => item.type === 'blob' && item.path.startsWith('assets/saints/'))
      .forEach(item => {
        const rel = item.path.slice('assets/saints/'.length);
        const slash = rel.indexOf('/');
        if (slash === -1) return;
        const folder = rel.slice(0, slash);
        const file = rel.slice(slash + 1);
        if (file.includes('/')) return; // ignore nested subfolders
        (folders[folder] = folders[folder] || []).push(file);
      });

    if (!Object.keys(folders).length) {
      console.warn(`No files found under assets/saints/ in ${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}. Check the path and branch name.`);
      return { saints: fallbackSaints(), source: 'empty' };
    }

    const skipped = [];
    const folderNames = Object.keys(folders).sort();
    const results = await Promise.all(folderNames.map(async (folder) => {
      const files = folders[folder];
      const isImageExt = f => /\.(jpe?g|png|webp|gif|avif|heic|heif|bmp|svg)$/i.test(f);
      const image = files.find(f => isImageExt(f) && !/-thumb\.[^.]+$/i.test(f) && !/-dark\.[^.]+$/i.test(f));
      const quotesFile = files.find(f => f.toLowerCase() === 'quotes.txt');
      const chapterFiles = files.filter(f => /\.txt$/i.test(f) && f.toLowerCase() !== 'quotes.txt').sort(naturalCompare);
      if (!image) { skipped.push(folder); return null; }

      const base = `assets/saints/${encodeURIComponent(folder)}/`;
      const [quotesRaw, chapters] = await Promise.all([
        quotesFile ? fetchText(base + encodeURIComponent(quotesFile)).catch(() => '') : Promise.resolve(''),
        Promise.all(chapterFiles.map(async (cf) => {
          const body = await fetchText(base + encodeURIComponent(cf)).catch((e) => { console.warn(`Could not fetch ${base}${cf}:`, e); return ''; });
          return { title: cf.replace(/\.txt$/i, ''), body: body.trim() };
        }))
      ]);
      const quoteLines = quotesRaw.split('\n').map(l => l.trim()).filter(Boolean);
      const parsed = parseSaintFolder(folder);

      const darkFile = image.replace(/(\.[^.]+)$/, '-dark$1');
      const hasDark = files.some(f => f.toLowerCase() === darkFile.toLowerCase());
      const imageForMode = f => base + encodeURIComponent(f);
      const thumbOf = f => f.replace(/\.[^.]+$/, '-thumb.jpg');

      return {
        id: folder,
        name: parsed.display,
        base: parsed.base,
        sortKey: parsed.sortKey,
        image: imageForMode(image),
        thumb: imageForMode(thumbOf(image)),
        imageDark: hasDark ? imageForMode(darkFile) : imageForMode(image),
        thumbDark: hasDark ? imageForMode(thumbOf(darkFile)) : imageForMode(thumbOf(image)),
        chapters,
        linkedQuotes: linkQuotesToChapters(quoteLines, chapters)
      };
    }));
    /* Chronological, not alphabetical. Folders with no parseable year
       keep their alphabetical order and sit after the dated ones rather
       than being dropped into the middle of the timeline at year zero. */
    const saints = results.filter(Boolean).sort((a, b) => {
      if (a.sortKey === null && b.sortKey === null) return naturalCompare(a.name, b.name);
      if (a.sortKey === null) return 1;
      if (b.sortKey === null) return -1;
      if (a.sortKey !== b.sortKey) return a.sortKey - b.sortKey;
      return naturalCompare(a.base, b.base);
    });
    if (skipped.length) console.warn('Skipped folders with no image file:', skipped);
    if (!saints.length) return { saints: fallbackSaints(), source: 'empty' };
    return { saints, source: 'live', skipped, cache, cacheAt };
  } catch (err) {
    console.warn('Falling back to the built-in demo saints — GitHub fetch failed:', err);
    return { saints: fallbackSaints(), source: 'error' };
  }
}

let SAINTS = [];

/* =====================================================================
   HALL OF SAINTS — carousel
===================================================================== */
const hallTrack = document.getElementById('hall-track');
const hallStatus = document.getElementById('hall-status');
const LOOP_BUFFER = 24; // Reverted from 40. That widening was meant to give native touch
                         // momentum extra room to run before a correction was needed, but a real
                         // device recording showed the auto-scroll dropping frames irregularly —
                         // consistent with the extra ~40 DOM nodes (98 vs 58 children) costing
                         // real per-frame layout/paint work on actual mobile hardware, invisible
                         // in this sandbox's testing. 24 is what the original file used.

function renderHall() {
  hallTrack.innerHTML = '';
  if (!SAINTS.length) {
    hallStatus.textContent = 'No saints found in assets/saints.';
    hallStatus.style.display = 'flex';
    return;
  }
  hallStatus.style.display = 'none';

  const loopSaints = loopSafeList(SAINTS);
  const head = cyclicSlice(loopSaints, loopSaints.length - LOOP_BUFFER, LOOP_BUFFER);
  const tail = cyclicSlice(loopSaints, 0, LOOP_BUFFER);
  const full = [...head, ...loopSaints, ...tail];

  const isDark = document.documentElement.classList.contains('dark');
  full.forEach((s) => {
    const item = document.createElement('div');
    item.className = 'saint-item';
    item.dataset.id = s.id;
    const thumbSrc = isDark ? s.thumbDark : s.thumb;
    item.innerHTML = `
      <div class="saint-card"><img class="thumb" src="${thumbSrc}" data-light="${s.thumb}" data-dark="${s.thumbDark}" alt="" aria-hidden="true"><img class="full" data-light="${s.image}" data-dark="${s.imageDark}" alt="${s.name}" decoding="async" onload="this.classList.add('loaded')" onerror="this.style.display='none';console.warn('Saint image failed to load:', this.getAttribute('src'))"></div>
      <div class="saint-caption">${s.name}</div>`;
    item.addEventListener('click', () => {
      if (hallBusy) return;
      if (item.classList.contains('selected')) { if (hallClose.onclick) hallClose.onclick(); return; }
      // a deliberate tap can't wait out the dwell timer for the real image
      promoteHallImage(item.querySelector('.saint-card img.full'));
      openHallModal(item, s);
    });
    hallTrack.appendChild(item);
  });

  requestAnimationFrame(() => {
    hallInertia.measure();
    const first = hallTrack.children[LOOP_BUFFER];
    if (first) hallInertia.resetTo(first.offsetLeft);
    createHallPromoteObserver();
  });
}

const hallInertia = attachLoopScroll(hallTrack, LOOP_BUFFER, () => loopSafeList(SAINTS).length,
  { axis: 'x', blocked: () => hallBusy || !!currentHallOpen });
const hallDrift = attachIdleDrift(hallTrack, hallInertia);

/* =====================================================================
   HALL FULL-IMAGE PROMOTION — render() leaves every .saint-card img.full
   without a src (only data-light/data-dark), so a fast fling across the
   loop buffer doesn't force every passing card to decode a full-res
   image at once. A shared IntersectionObserver watches every .full img;
   entering the margin starts a dwell timer before the real src gets set,
   so a card only pays the decode cost once the user has actually
   lingered near it — leaving before the timer fires cancels it.
   Applied uniformly to every item (real + loop clones); clones just
   happen to sit off-screen so their dwell timers rarely fire.
===================================================================== */
const HALL_PROMOTE_DWELL = 0;
const hallPendingPromotes = new Map(); // img.full -> pending setTimeout id
let hallPromoteObserver = null;
let hallPromoteObserverPrimed = false; // first callback batch = items already in range at observe() time — those skip the dwell

function promoteHallImage(img) {
  if (!img || img.getAttribute('src')) return;
  const pending = hallPendingPromotes.get(img);
  if (pending) { clearTimeout(pending); hallPendingPromotes.delete(img); }
  const isDark = document.documentElement.classList.contains('dark');
  const src = isDark ? img.dataset.dark : img.dataset.light;
  if (src) img.setAttribute('src', src);
}

function createHallPromoteObserver() {
  if (hallPromoteObserver) hallPromoteObserver.disconnect();
  hallPendingPromotes.forEach(id => clearTimeout(id));
  hallPendingPromotes.clear();
  hallPromoteObserverPrimed = false;
  // rootMargin can't be mutated after creation, so this is a fixed
  // approximation (one card stride, measured for the screen this loaded
  // on) rather than something recalculated on every scroll. It's only
  // rebuilt — same approach, remeasured — on a genuine resize, see below.
  const stride = hallInertia.getStride() || Math.max(window.innerWidth, window.innerHeight);
  const margin = Math.ceil(stride);
  hallPromoteObserver = new IntersectionObserver((entries) => {
    const primingBatch = !hallPromoteObserverPrimed;
    hallPromoteObserverPrimed = true;
    entries.forEach((entry) => {
      const img = entry.target;
      if (!entry.isIntersecting) {
        const pending = hallPendingPromotes.get(img);
        if (pending) { clearTimeout(pending); hallPendingPromotes.delete(img); }
        return;
      }
      if (primingBatch) { promoteHallImage(img); return; }
      if (img.getAttribute('src') || hallPendingPromotes.has(img)) return;
      const id = setTimeout(() => { hallPendingPromotes.delete(img); promoteHallImage(img); }, HALL_PROMOTE_DWELL);
      hallPendingPromotes.set(img, id);
    });
  }, { root: hallTrack, rootMargin: `0px ${margin}px 0px ${margin}px`, threshold: 0 });
  hallTrack.querySelectorAll('.saint-card img.full').forEach(img => hallPromoteObserver.observe(img));
}

const hallQuotesCarouselDesktop = createQuoteCarousel(document.getElementById('hall-quotes-track-desktop'), 7, () => hallBusy);
const hallQuotesCarouselMobile = createQuoteCarousel(document.getElementById('hall-quotes-track-mobile'), 3, () => hallBusy);

const hallChaptersDesktop = createChapterController(
  document.getElementById('hall-chapters-desktop'),
  () => document.getElementById('hall-chapters-desktop')
);
function getMobileStickyClearance() {
  // page header + the sticky bar's actual current height (now responsive
  // to viewport height, not a fixed value, and its own padding already
  // includes the comfortable gap below it). Measuring this directly means
  // it can never drift out of sync with the bar's real layout, unlike a
  // hardcoded constant that has to be manually recomputed by hand every
  // time the bar's own height changes.
  const bar = document.getElementById('mobile-hero-bar');
  return 30 + (bar ? bar.offsetHeight : 169);
}
function syncMobileChapterStickyTop() {
  // The chapter headers' sticky position is additive with their scrolling
  // container's own padding-top (30px, for the page header) — so top:0
  // resolves to y=30, not to "right below the bar" as it might seem. This
  // only ever looked correct for a single always-first chapter, whose
  // natural (pre-scroll) position already sat further down than that
  // threshold. Once a second chapter is revealed and the first one's
  // natural position scrolls back past y=30, it snaps to the panel's top
  // edge instead of staying below the bar. Setting an explicit value
  // (bar height + gap) fixes this for every revealed chapter, not just
  // the first.
  const bar = document.getElementById('mobile-hero-bar');
  const barHeight = bar ? bar.offsetHeight : 169;
  document.documentElement.style.setProperty('--mobile-chapter-sticky-top', barHeight + 'px');
}
const hallChaptersMobile = createChapterController(
  document.getElementById('hall-chapters-mobile'),
  () => document.getElementById('hall-mobile-panel'),
  getMobileStickyClearance
);

/* ---- chapter accordion (shared by desktop + mobile panels) ---- */
/* Chapters progressively reveal as the reader nears the end of the
   current one (a sentinel at each chapter's bottom), not as an exclusive
   one-at-a-time accordion. Scrolling back up past the first-revealed
   chapter's start reveals the one before it, mirroring the forward
   behaviour. See stickyObserver below for how headers hand off. */
function createChapterController(container, getScrollRoot, getStickyOffset = () => 0) {
  let firstOpen = null;
  let revealedUpTo = -1;
  let nextObserver = null;
  let prevObserver = null;
  /* Only the highest-index revealed chapter past the sticky line ever
     shows its header — earlier ones that are also past it get hidden,
     un-hiding the moment scrolling carries them below the line again.
     Needed because a header only becomes position:sticky once ITS OWN
     chapter is revealed, and reveal is itself scroll-triggered — so
     there's a window where an earlier header is already stuck but the
     one meant to cover it hasn't engaged yet. stickyObserver watches
     each revealed chapter's start-sentinel with a top-shifted root
     margin matching the sticky offset, firing when that chapter's start
     crosses the line in either direction. */
  let stickyObserver = null;
  const stuckSet = new Set();
  const observedSentinels = new Set();

  // Clicking the highlighted quote itself clears it. Attached once here
  // (not inside render()) so repeated renders don't accumulate listeners.
  container.addEventListener('click', (e) => {
    const anchor = e.target.closest('.quote-anchor');
    if (anchor && anchor.classList.contains('hl')) {
      anchor.classList.remove('hl');
      if (currentHighlightEl === anchor) currentHighlightEl = null;
    }
  });

  function ensureStickyObserver() {
    if (stickyObserver) return;
    stickyObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const chapterEl = entry.target.closest('.chapter');
        if (!chapterEl) return;
        const i = Number(chapterEl.dataset.i);
        if (entry.isIntersecting) {
          stuckSet.delete(i);
        } else if (entry.rootBounds && entry.boundingClientRect.top < entry.rootBounds.top) {
          // Not intersecting because the sentinel has scrolled ABOVE the
          // sticky line — this chapter is genuinely behind us.
          stuckSet.add(i);
        } else {
          // Not intersecting for the OTHER reason: it simply hasn't been
          // scrolled into view yet (still below the sticky line, or below
          // the panel entirely). Not passed — make sure it's cleared even
          // if it was never added, since a chapter can be revealed (and
          // start being observed) already below the fold.
          stuckSet.delete(i);
        }
      });
      updateActiveHeader();
    }, { root: getScrollRoot(), rootMargin: `-${getStickyOffset()}px 0px 0px 0px`, threshold: 0 });
  }

  function updateActiveHeader() {
    const activeIndex = stuckSet.size ? Math.max(...stuckSet) : -1;
    container.querySelectorAll('.chapter').forEach(ch => {
      const i = Number(ch.dataset.i);
      ch.classList.toggle('header-passed', stuckSet.has(i) && i !== activeIndex);
    });
  }

  function applyVisibility() {
    ensureStickyObserver();
    container.querySelectorAll('.chapter').forEach(ch => {
      const i = Number(ch.dataset.i);
      const revealed = firstOpen !== null && i >= firstOpen && i <= revealedUpTo;
      ch.classList.toggle('revealed', revealed);
      if (revealed && !observedSentinels.has(i)) {
        const sentinel = ch.querySelector('.chapter-start-sentinel');
        if (sentinel) { stickyObserver.observe(sentinel); observedSentinels.add(i); }
      }
    });
    container.classList.toggle('has-open', firstOpen !== null);
  }

  function disconnectNext() { if (nextObserver) { nextObserver.disconnect(); nextObserver = null; } }
  function disconnectPrev() { if (prevObserver) { prevObserver.disconnect(); prevObserver = null; } }
  function disconnectSticky() {
    if (stickyObserver) { stickyObserver.disconnect(); stickyObserver = null; }
    stuckSet.clear();
    observedSentinels.clear();
  }
  function disconnectAll() { disconnectNext(); disconnectPrev(); disconnectSticky(); }

  function watchNext() {
    disconnectNext();
    const chapters = container.querySelectorAll('.chapter');
    if (revealedUpTo < 0 || revealedUpTo >= chapters.length - 1) return;
    const current = container.querySelector(`.chapter[data-i="${revealedUpTo}"]`);
    const sentinel = current && current.querySelector('.chapter-end-sentinel');
    if (!sentinel) return;
    const setupTime = performance.now();
    nextObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        // IntersectionObserver always fires once immediately on observe(),
        // reporting the current state even with nothing having changed.
        // Ignore only that — a callback arriving within a few ms of setup
        // is that mandatory report, not a real scroll. Anything after is
        // genuine, however fast the user scrolled.
        if (performance.now() - setupTime < 50) return;
        if (entry.isIntersecting) {
          revealedUpTo = Math.min(revealedUpTo + 1, chapters.length - 1);
          applyVisibility();
          watchNext();
        }
      });
    }, { root: getScrollRoot(), threshold: 0.01 });
    nextObserver.observe(sentinel);
  }

  // Position of `el`'s top edge within `root`'s scrollable content,
  // independent of `el`'s offsetParent chain (which is often some other
  // positioned ancestor, not the scroll container itself — offsetTop
  // alone gave the wrong coordinate space here).
  function scrollOffsetWithin(el, root) {
    return el.getBoundingClientRect().top - root.getBoundingClientRect().top + root.scrollTop;
  }

  function revealPrevious() {
    if (firstOpen === null || firstOpen <= 0) return;
    const root = getScrollRoot();
    const beforeHeight = root.scrollHeight;
    const beforeScroll = root.scrollTop;
    firstOpen = Math.max(0, firstOpen - 1);
    applyVisibility();
    // revealing the previous chapter inserts its height above the current
    // view — compensate scrollTop by the same amount so the content on
    // screen doesn't jump, and the reveal feels like a continuous scroll
    // rather than a snap to the new chapter's top
    const grew = root.scrollHeight - beforeHeight;
    root.scrollTop = beforeScroll + grew;
    watchPrev();
  }

  function watchPrev() {
    disconnectPrev();
    if (firstOpen === null || firstOpen <= 0) return;
    const current = container.querySelector(`.chapter[data-i="${firstOpen}"]`);
    const sentinel = current && current.querySelector('.chapter-start-sentinel');
    if (!sentinel) return;
    const setupTime = performance.now();
    prevObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        // This handles the "continuous reading, scrolled down then back up"
        // case. It can't handle "chapter 2 opened directly, try to scroll
        // up immediately" — IntersectionObserver's root has no concept of
        // the sticky bar visually covering part of the viewport, so the
        // sentinel reads as "intersecting" the instant it's anywhere
        // within the scrollable area, sticky overlay or not. That case is
        // handled separately below, by reacting to the raw input directly.
        if (performance.now() - setupTime < 50) return;
        if (entry.isIntersecting) revealPrevious();
      });
    }, { root: getScrollRoot(), threshold: 0.01 });
    prevObserver.observe(sentinel);
  }

  // Direct fallback for "opened a later chapter, try to scroll up with no
  // real scroll room yet" — reacts to the raw gesture instead of relying
  // on a visibility transition that can't exist in this situation.
  const scrollRootEl = getScrollRoot();
  if (scrollRootEl) {
    scrollRootEl.addEventListener('wheel', (e) => {
      if (e.deltaY < 0 && scrollRootEl.scrollTop <= 5) revealPrevious();
    }, { passive: true });
    let touchStartY = null;
    scrollRootEl.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
    scrollRootEl.addEventListener('touchmove', (e) => {
      if (touchStartY === null) return;
      const dy = e.touches[0].clientY - touchStartY;
      if (dy > 5 && scrollRootEl.scrollTop <= 5) {
        revealPrevious();
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });
  }

  function openFrom(index) {
    firstOpen = index;
    revealedUpTo = index;
    applyVisibility();
    watchNext();
    watchPrev();
    const chapterEl = container.querySelector(`.chapter[data-i="${index}"]`);
    const root = getScrollRoot();
    if (chapterEl && root) root.scrollTop = scrollOffsetWithin(chapterEl, root) - getStickyOffset();
  }

  function close() {
    firstOpen = null;
    revealedUpTo = -1;
    disconnectAll();
    applyVisibility();
  }

  function render(chapters) {
    close();
    container.innerHTML = '';
    chapters.forEach((ch, i) => {
      const el = document.createElement('div');
      el.className = 'chapter';
      el.dataset.i = i;
      el.innerHTML = `<div class="chapter-start-sentinel"></div><button class="chapter-header" type="button">${ch.title}</button><div class="chapter-body">${ch.html}<div class="chapter-end-sentinel"></div></div>`;
      el.querySelector('.chapter-header').addEventListener('click', () => {
        if (el.classList.contains('revealed')) close();
        else openFrom(i);
      });
      container.appendChild(el);
    });
  }

  return { render, openFrom, close };
}

let currentHighlightEl = null;
function jumpToQuote(linkedQuote) {
  const compact = currentHallOpen ? isModalCompact(currentHallOpen.origRect) : true;
  const container = compact
    ? document.getElementById('hall-chapters-mobile')
    : document.getElementById('hall-chapters-desktop');
  const controller = compact ? hallChaptersMobile : hallChaptersDesktop;
  controller.openFrom(linkedQuote.chapterIndex);

  requestAnimationFrame(() => {
    const anchor = container.querySelector(`.quote-anchor[data-idx="${linkedQuote.quoteIndex}"]`);
    if (!anchor) return;
    if (currentHighlightEl && currentHighlightEl !== anchor) currentHighlightEl.classList.remove('hl');

    const scrollBox = compact ? document.getElementById('hall-mobile-panel') : container;
    const clearance = compact ? getMobileStickyClearance() : 0;
    const anchorTop = anchor.getBoundingClientRect().top - scrollBox.getBoundingClientRect().top + scrollBox.scrollTop;
    const visibleHeight = scrollBox.clientHeight - clearance;
    const targetTop = anchorTop - clearance - (visibleHeight / 2) + (anchor.offsetHeight / 2);
    const startTop = scrollBox.scrollTop;
    tween(1000, t => { scrollBox.scrollTop = lerp(startTop, targetTop, t); }, () => {
      anchor.classList.add('hl');
      currentHighlightEl = anchor;
    });
  });
}

/* ---- mobile hero dock (the actual image shrinks and docks top-right,
   not a separate faked-up thumbnail) ---- */
const mobileHeroBar = document.getElementById('mobile-hero-bar');

const HEADER_H = 30;

function mobileDockTarget(origRect) {
  const dockH = Math.max(90, Math.min(160, window.innerHeight * 0.15)); // matches .quotes-viewport.small's clamp() exactly, so the two align as one clean row
  const scale = dockH / origRect.height;
  const dockW = origRect.width * scale;
  return { top: HEADER_H + 26, left: window.innerWidth - dockW - 46, width: dockW, height: dockH };
}

/* ---- Hall modal ---- */
const hallModalQuotes = document.getElementById('hall-modal-quotes');
const hallModalText = document.getElementById('hall-modal-text');
const hallMobilePanel = document.getElementById('hall-mobile-panel');
const hallClose = document.getElementById('hall-close');

let currentHallOpen = null; // { itemEl, origRect } while a Hall modal is open
let modalCompactMode = null; // tracks compact vs split-panel while a Hall modal is open

function computeHallTarget(origRect, mobile) {
  if (mobile) {
    // On mobile the image docks straight to its final small top-right spot —
    // no separate large "hero" stage, and it never moves again on scroll.
    const d = mobileDockTarget(origRect);
    return { targetH: d.height, targetW: d.width, targetTop: d.top, targetLeft: d.left, scale: d.height / origRect.height };
  }
  // Desktop: no resizing at all, exactly matching the deck card's size —
  // only move it horizontally to the centre.
  const targetH = origRect.height;
  const targetW = origRect.width;
  const targetTop = origRect.top;
  const targetLeft = (window.innerWidth - targetW) / 2;
  return { targetH, targetW, targetTop, targetLeft, scale: 1 };
}

let hallBusy = false; // true while an open/close animation sequence is in flight — blocks overlapping clicks that would race two tweens against the same element

function openHallModal(itemEl, data) {
  if (hallBusy || itemEl.classList.contains('selected')) return;
  hallBusy = true;
  hallDrift.pause();
  // Switches the track to touch-action:none for the duration of the
  // animation, so a stray swipe can't move the row out from under a tween
  // that just captured its position — see setLocked's own comment. There
  // is no in-flight momentum to separately cancel here: native momentum
  // was already suppressed the instant the tap that opens this modal
  // ended the gesture, same as it always was for any other tap.
  hallInertia.setLocked(true);
  hallQuotesCarouselDesktop.setLocked(true);
  hallQuotesCarouselMobile.setLocked(true);
  const rect = itemEl.getBoundingClientRect();
  const compact = isModalCompact(rect);
  const captionEl = itemEl.querySelector('.saint-caption');
  /* Mobile only: freeze the caption to its current on-screen position
     (position:fixed) before its opacity fade starts, so it fades out in
     place instead of riding along with the shrinking image. Desktop
     keeps the caption visible and normally flowing, so skip this there. */
  const capRect = (compact && captionEl) ? captionEl.getBoundingClientRect() : null;
  // Must be read BEFORE .detach is applied below — that class sets
  // margin:0 on the caption, so reading this after would silently lose
  // the true margin and under-correct captionSpace by exactly that much.
  const capMarginTop = capRect ? parseFloat(getComputedStyle(captionEl).marginTop || '0') : 0;
  if (capRect) {
    captionEl.classList.add('detach');
    captionEl.style.top = capRect.top + 'px';
    captionEl.style.left = capRect.left + 'px';
    captionEl.style.width = capRect.width + 'px';
  }
  /* itemEl is a flex column: .saint-card (image) first, .saint-caption
     after — so the card's top exactly equals itemEl's top, and the
     caption only extends itemEl's BOTTOM edge (verified directly). That
     extra height belongs in the animation on desktop, where the caption
     stays visible next to the modal. On mobile it doesn't: the caption
     fades out and the dock only ever shows the image, so including it
     stretches the image past its true aspect ratio for the whole
     animation (.saint-card fills 100% of whatever height is animating)
     and skews computeHallTarget's own aspect-ratio math — then snaps
     back the instant the animation ends and inline styles clear.
     largeRect corrects the height only; top/left are already right. */
  const captionSpace = capRect ? capRect.height + capMarginTop : 0;
  const largeRect = captionSpace
    ? { top: rect.top, left: rect.left, width: rect.width, height: rect.height - captionSpace }
    : rect;
  modalCompactMode = compact;
  document.body.classList.toggle('modal-compact', compact);

  const placeholder = createPlaceholder(itemEl, rect, 'item-placeholder');

  setSiblingsDim(hallTrack, '.saint-item', itemEl, true);

  itemEl.style.top = largeRect.top + 'px';
  itemEl.style.left = largeRect.left + 'px';
  itemEl.style.width = largeRect.width + 'px';
  itemEl.style.height = largeRect.height + 'px';
  itemEl.classList.add('selected');

  const { targetH, targetW, targetTop, targetLeft } = computeHallTarget(largeRect, compact);
  currentHallOpen = { itemEl, origRect: rect, placeholder, captionSpace };

  tween(1500, (t) => {
    itemEl.style.top = lerp(largeRect.top, targetTop, t) + 'px';
    itemEl.style.left = lerp(largeRect.left, targetLeft, t) + 'px';
    itemEl.style.width = lerp(largeRect.width, targetW, t) + 'px';
    itemEl.style.height = lerp(largeRect.height, targetH, t) + 'px';
  });

  // build chapter HTML once (with quote anchors embedded) and populate both panels
  const chaptersHtml = data.chapters.map((ch, ci) => ({
    title: ch.title,
    html: buildChapterHtml(ch.body, data.linkedQuotes.filter(lq => lq.chapterIndex === ci)
      .map(lq => ({ offset: lq.offset, length: lq.text.length, quoteIndex: lq.quoteIndex })))
  }));
  hallChaptersDesktop.render(chaptersHtml);
  hallChaptersMobile.render(chaptersHtml);

  hallQuotesCarouselDesktop.render(data.linkedQuotes, jumpToQuote);
  hallQuotesCarouselMobile.render(data.linkedQuotes, jumpToQuote);

  document.getElementById('mobile-saint-name').textContent = data.name;
  syncMobileChapterStickyTop();
  requestAnimationFrame(syncMobileChapterStickyTop); // re-check once the name's actual layout (e.g. if it wraps) has settled

  setTimeout(() => {
    hallModalQuotes.classList.add('reveal');
    hallModalText.classList.add('reveal');
    hallMobilePanel.classList.add('reveal');
    hallClose.classList.add('show');
    hallBusy = false;
    // The row itself stays locked (hallInertia.setLocked stays true) for
    // as long as the modal is open — matching wheel's blocked(), which
    // checks currentHallOpen too. The quote carousels are different: the
    // reader is meant to scroll them right now, so they only lock for
    // this animation window.
    hallQuotesCarouselDesktop.setLocked(false);
    hallQuotesCarouselMobile.setLocked(false);
  }, 1500);

  hallClose.onclick = () => { if (!hallBusy) closeHallModal(itemEl, placeholder); };
}

function closeHallModal(itemEl, placeholder) {
  hallBusy = true;
  hallDrift.resume(); // 5s idle countdown restarts fresh from now
  // Read before clearing — see openHallModal's comment on why the deck-
  // sized endpoint of this tween needs the same height correction the
  // open tween used (top and left are already exactly right — see
  // openHallModal's comment), and why itemEl's own rect isn't a
  // caption-inflated measurement the way the deck placeholder's is:
  // itemEl's current size is whatever the open tween last set it to
  // (the small docked size), not this saint-item's full deck size.
  const captionSpace = currentHallOpen ? currentHallOpen.captionSpace : 0;
  currentHallOpen = null;
  modalCompactMode = null;
  hallModalQuotes.classList.remove('reveal');
  hallModalText.classList.remove('reveal');
  hallMobilePanel.classList.remove('reveal');
  hallClose.classList.remove('show');
  hallChaptersDesktop.close();
  hallChaptersMobile.close();
  currentHighlightEl = null;

  const rect = placeholder.getBoundingClientRect();
  const from = itemEl.getBoundingClientRect();
  const largeHeight = rect.height - captionSpace;

  tween(1500, (t) => {
    itemEl.style.top = lerp(from.top, rect.top, t) + 'px';
    itemEl.style.left = lerp(from.left, rect.left, t) + 'px';
    itemEl.style.width = lerp(from.width, rect.width, t) + 'px';
    itemEl.style.height = lerp(from.height, largeHeight, t) + 'px';
  }, () => {
    itemEl.classList.remove('selected');
    itemEl.removeAttribute('style');
    // Un-freeze the caption at the same instant it starts fading back in
    // (body.modal-compact's removal above triggers that fade) — it needs
    // to be back in normal flow, matching wherever the deck card actually
    // resettled, not still pinned to the position captured at open time.
    const captionEl = itemEl.querySelector('.saint-caption');
    if (captionEl) { captionEl.classList.remove('detach'); captionEl.removeAttribute('style'); }
    placeholder.remove();
    document.body.classList.remove('modal-compact');
    setSiblingsDim(hallTrack, '.saint-item', null, false);
    hallBusy = false;
    // Only now — matching wheel scrolling, which stays blocked for the
    // whole time the modal is open (hallBusy || currentHallOpen), not
    // just while it's animating. Releasing this any earlier would let a
    // swipe move the row while the card is still visibly open.
    hallInertia.setLocked(false);
    // The quote carousels are the opposite: they're meant to stay
    // scrollable while the modal is open (that's the whole point — the
    // reader is scrolling quotes right now), so they only lock for the
    // hallBusy animation window, matching their own blocked() predicate.
    hallQuotesCarouselDesktop.setLocked(false);
    hallQuotesCarouselMobile.setLocked(false);
  });
}

/* =====================================================================
   ARMORY — vertical "spear" quotes, modal
===================================================================== */
const armoryTrack = document.getElementById('armory-track');
const armoryAttribution = document.getElementById('armory-attribution');
const armoryClose = document.getElementById('armory-close');
const ARMORY_BUFFER = 24; // see LOOP_BUFFER's comment — reverted for the same reason

const QUOTES_FALLBACK = `
St Antony the Great
He who sits in solitude and is quiet hath escaped from three wars.

St Antony the Great
Life and death depend on our neighbour.

John 15:12
Love one another, as I have loved you.

Psalm 46:10
Be still, and know that I am God.
`.trim();

function parseArmoryQuotes(raw) {
  const lines = raw.split('\n');
  const out = [];
  for (let i = 0; i < lines.length; i += 3) {
    const source = (lines[i] || '').trim();
    const quote = (lines[i + 1] || '').trim();
    if (source && quote) out.push({ source, quote });
  }
  return out;
}

let ARMORY_QUOTES = [];

function renderArmory() {
  armoryTrack.innerHTML = '';
  const loopQuotes = loopSafeList(ARMORY_QUOTES);
  const head = cyclicSlice(loopQuotes, loopQuotes.length - ARMORY_BUFFER, ARMORY_BUFFER);
  const tail = cyclicSlice(loopQuotes, 0, ARMORY_BUFFER);
  const full = [...head, ...loopQuotes, ...tail];

  full.forEach((q) => {
    const el = document.createElement('div');
    el.className = 'spear';
    el.innerHTML = `
      <div class="hilt"><div class="pommel"></div><div class="grip"></div><div class="guard"></div></div>
      <div class="shaft-text">${q.quote}</div>`;
    el.addEventListener('click', () => {
      if (armoryBusy) return;
      if (el.classList.contains('selected')) { if (armoryClose.onclick) armoryClose.onclick(); return; }
      openArmoryModal(el, q);
    });
    armoryTrack.appendChild(el);
  });

  requestAnimationFrame(() => {
    armoryInertia.measure();
    const first = armoryTrack.children[ARMORY_BUFFER];
    if (first) armoryInertia.resetTo(first.offsetLeft);
  });
}

const armoryInertia = attachLoopScroll(armoryTrack, ARMORY_BUFFER, () => loopSafeList(ARMORY_QUOTES).length,
  { axis: 'x', blocked: () => armoryBusy || !!currentArmoryOpen });
const armoryDrift = attachIdleDrift(armoryTrack, armoryInertia);

function armoryScaleFor(rect) {
  const desired = 1.5;
  const maxAllowed = (window.innerWidth - 24) / rect.height;
  return Math.min(desired, maxAllowed);
}

let currentArmoryOpen = null; // { spearEl, origRect } while an Armory modal is open

function armorySpearTarget(origRect) {
  const scale = armoryScaleFor(origRect);
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2 - 30;
  return {
    scale,
    targetTop: cy - origRect.height / 2,
    targetLeft: cx - origRect.width / 2,
    attributionTop: cy + (origRect.width * scale) / 2 + 26
  };
}

let armoryBusy = false; // true while an open/close animation sequence is in flight — blocks overlapping clicks that would race two tweens against the same element

function openArmoryModal(spearEl, q) {
  if (armoryBusy || spearEl.classList.contains('selected')) return;
  armoryBusy = true;
  armoryDrift.pause();
  armoryInertia.setLocked(true); // released once the modal is fully closed — see openHallModal's comment
  const rect = spearEl.getBoundingClientRect();

  const placeholder = createPlaceholder(spearEl, rect, 'spear-placeholder');

  setSiblingsDim(armoryTrack, '.spear', spearEl, true);

  spearEl.style.top = rect.top + 'px';
  spearEl.style.left = rect.left + 'px';
  spearEl.style.width = rect.width + 'px';
  spearEl.style.height = rect.height + 'px';
  spearEl.style.transform = 'rotate(0deg) scale(1)';
  spearEl.classList.add('selected');

  currentArmoryOpen = { spearEl, origRect: rect };
  const { scale, targetTop, targetLeft, attributionTop } = armorySpearTarget(rect);

  tween(1500, (t) => {
    spearEl.style.top = lerp(rect.top, targetTop, t) + 'px';
    spearEl.style.left = lerp(rect.left, targetLeft, t) + 'px';
    const r = lerp(0, -90, t);
    const s = lerp(1, scale, t);
    spearEl.style.transform = `rotate(${r}deg) scale(${s})`;
  });

  armoryAttribution.style.top = attributionTop + 'px';
  armoryAttribution.style.left = '50%';

  const isSaint = SAINTS.some(s => saintMatchesSource(s, q.source));
  let html;
  if (isSaint) {
    html = `&mdash; <a href="#" data-jump-saint="${q.source}">${q.source}</a>`;
  } else {
    const url = `https://www.biblegateway.com/passage/?search=${encodeURIComponent(q.source)}`;
    html = `&mdash; <a href="${url}" target="_blank" rel="noopener">${q.source}</a>`;
  }
  armoryAttribution.innerHTML = html;

  setTimeout(() => {
    armoryAttribution.classList.add('reveal');
    armoryClose.classList.add('show');
    armoryBusy = false;
  }, 1500);

  const jumpLink = armoryAttribution.querySelector('[data-jump-saint]');
  if (jumpLink) {
    jumpLink.onclick = (e) => {
      e.preventDefault();
      if (armoryBusy) return;
      closeArmoryModal(spearEl, placeholder);
      document.querySelector('header nav a[data-view="hall"]').click();
      const target = SAINTS.find(s => saintMatchesSource(s, q.source));
      if (target) {
        setTimeout(() => {
          const itemEl = [...hallTrack.querySelectorAll('.saint-item')].find(el => el.dataset.id === target.id);
          if (itemEl) openHallModal(itemEl, target);
        }, 200);
      }
    };
  }

  armoryClose.onclick = () => { if (!armoryBusy) closeArmoryModal(spearEl, placeholder); };
}

/* The placeholder's captured box was a close but not pixel-perfect stand-in
   for the spear's true flex-computed resting slot (the hilt's padding/gap
   made the two diverge slightly) — enough to be visible as a small jump
   right at the end of the sheathing animation. Measuring the spear directly
   in a momentary, unpainted flow state removes that guesswork entirely. */
function measureTrueRestingRect(spearEl, placeholder) {
  const savedStyle = spearEl.getAttribute('style');
  const savedClass = spearEl.className;
  const savedPlaceholderDisplay = placeholder.style.display;
  placeholder.style.display = 'none';
  spearEl.className = 'spear';
  spearEl.removeAttribute('style');
  const rect = spearEl.getBoundingClientRect();
  spearEl.setAttribute('style', savedStyle);
  spearEl.className = savedClass;
  placeholder.style.display = savedPlaceholderDisplay;
  return rect;
}

function closeArmoryModal(spearEl, placeholder) {
  armoryBusy = true;
  armoryDrift.resume(); // 5s idle countdown restarts fresh from now
  currentArmoryOpen = null;
  armoryAttribution.classList.remove('reveal');
  armoryClose.classList.remove('show');

  // Read where the spear ACTUALLY is right now, directly, rather than
  // recomputing it via a formula that has to exactly reproduce reality.
  const fromTop = parseFloat(spearEl.style.top) || 0;
  const fromLeft = parseFloat(spearEl.style.left) || 0;
  const scaleMatch = /scale\(([\d.]+)\)/.exec(spearEl.style.transform || '');
  const fromScale = scaleMatch ? parseFloat(scaleMatch[1]) : 1;

  // Rough resting rect, good enough for picking the overshoot point —
  // the exact final landing spot is handled separately below, with zero
  // prediction involved.
  const roughRect = measureTrueRestingRect(spearEl, placeholder);
  const overshootTop = roughRect.top - 30;

  setSiblingsDim(armoryTrack, '.spear', null, false);

  tween(1000, (t) => {
    spearEl.style.top = lerp(fromTop, overshootTop, t) + 'px';
    spearEl.style.left = lerp(fromLeft, roughRect.left, t) + 'px';
    const r = lerp(-90, 0, t);
    const s = lerp(fromScale, 1, t);
    spearEl.style.transform = `rotate(${r}deg) scale(${s})`;
  }, () => {
    // FLIP: snapshot the overshoot spot, THEN actually put the spear in
    // its real flow position (ground truth — not a prediction), measure
    // where that truly landed, invert back to the overshoot spot with a
    // transform, then animate that transform away to zero. Since the
    // "final" position is measured after really being there, it cannot
    // be wrong.
    const overshootTopNow = parseFloat(spearEl.style.top) || 0;
    const overshootLeftNow = parseFloat(spearEl.style.left) || 0;

    spearEl.classList.remove('selected');
    spearEl.removeAttribute('style');
    placeholder.remove();
    const finalRect = spearEl.getBoundingClientRect();

    const dTop = overshootTopNow - finalRect.top;
    const dLeft = overshootLeftNow - finalRect.left;
    spearEl.style.transform = `translate(${dLeft}px, ${dTop}px)`;
    void spearEl.offsetHeight; // force reflow so this inverted state is registered before animating away from it

    tween(417, (t2) => {
      spearEl.style.transform = `translate(${lerp(dLeft, 0, t2)}px, ${lerp(dTop, 0, t2)}px)`;
    }, () => {
      spearEl.style.transform = '';
      armoryBusy = false;
      armoryInertia.setLocked(false);
    });
  });
}

/* =====================================================================
   INIT
===================================================================== */
/* The loading screen is dismissed on three independent triggers, because
   any one of them alone has a failure mode: the data resolving (normal
   case), a minimum on-screen time (so a warm cache doesn't produce a
   single-frame flash of text), and a hard ceiling (so a hung request can
   never leave a visitor staring at a permanently blank overlay). */
const LOADER_MIN_MS = 2000;
const LOADER_MAX_MS = 9000;
const loaderShownAt = performance.now();
let loaderDismissed = false;

function dismissLoader() {
  if (loaderDismissed) return;
  loaderDismissed = true;
  const el = document.getElementById('loading-screen');
  if (!el) return;
  const wait = Math.max(0, LOADER_MIN_MS - (performance.now() - loaderShownAt));
  setTimeout(() => {
    el.classList.add('done');
    // Remove rather than just hide: a full-viewport fixed overlay left in
    // place would swallow the first tap on the carousel.
    setTimeout(() => el.remove(), 700);
  }, wait);
}
setTimeout(dismissLoader, LOADER_MAX_MS);

loadSaints().then(({ saints, source, skipped, cache, cacheAt }) => {
  SAINTS = saints;
  renderHall();
  const badge = document.getElementById('data-source-badge');
  const messages = {
    unconfigured: 'Demo data — set GITHUB_OWNER/REPO at the top of the script',
    error: 'Demo data — GitHub fetch failed, see console',
    empty: 'Demo data — no folders found under assets/saints/, see console',
    live: `Loaded ${saints.length} saint(s) from GitHub`
  };
  let text = messages[source] || '';
  // Which of the three listing paths ran matters when debugging missing
  // images: 'fresh' is normal on a quick reload; 'stale' means the API
  // was unreachable just now (usually the rate limit) and this is the
  // last known-good listing. Showing the actual age, not just the label,
  // is what actually lets a stuck cache be diagnosed from the outside —
  // "(cached listing)" alone looks identical whether it's 30 seconds or
  // 12 hours old, and those mean very different things.
  if (source === 'live' && (cache === 'fresh' || cache === 'stale') && cacheAt) {
    const ageMin = Math.round((Date.now() - cacheAt) / 60000);
    const ageStr = ageMin < 60 ? `${ageMin}m` : `${Math.floor(ageMin / 60)}h ${ageMin % 60}m`;
    text += cache === 'fresh' ? ` (cached ${ageStr} ago)` : ` (cached ${ageStr} ago — API unavailable)`;
  }
  if (skipped && skipped.length) text += ` — skipped (no recognised image file): ${skipped.join(', ')}`;
  if (source === 'live') text += ' — tap to refresh';
  badge.textContent = text;
  badge.style.display = 'block';
  // A direct, guaranteed way to force fresh data regardless of *why* the
  // cache looks stuck — clears the cached listing and does a real reload,
  // not just a re-render, so there's no dependency on diagnosing the
  // cause first.
  badge.style.cursor = 'pointer';
  badge.onclick = () => {
    try { localStorage.removeItem(TREE_CACHE_KEY); } catch (e) { /* ignore */ }
    location.reload();
  };
}).catch((err) => {
  console.warn('Saint loading failed unexpectedly:', err);
}).finally(() => {
  // Measure once the cards are really in the DOM, then hand over.
  hallInertia.measure();
  dismissLoader();
});

fetch('assets/text/quotes.txt')
  .then(r => { if (!r.ok) throw new Error('no file'); return r.text(); })
  .then(text => {
    const parsed = parseArmoryQuotes(text);
    if (!parsed.length) throw new Error('quotes.txt fetched OK but parsed to zero entries — check the source/quote/blank-line format');
    ARMORY_QUOTES = parsed;
    document.getElementById('armory-source-badge').textContent = `Loaded ${parsed.length} quote(s) from assets/text/quotes.txt`;
  })
  .catch((err) => {
    console.warn('Armory: falling back to built-in demo quotes —', err.message);
    ARMORY_QUOTES = parseArmoryQuotes(QUOTES_FALLBACK);
    document.getElementById('armory-source-badge').textContent = 'Demo quotes — see console for why assets/text/quotes.txt wasn\'t used';
  })
  .finally(() => {
    document.getElementById('armory-source-badge').style.display = 'block';
    renderArmory();
  });

/* Repositions the open Hall modal on resize. If the resize also crossed
   the split-panel/compact threshold, crossfades between the two layouts
   instead of snapping — fade the current panel set out, swap layout +
   reposition the card while invisible, fade the new panel set in. */
function refreshHallModalLayout() {
  if (!currentHallOpen) return;

  // Sibling cards resize live (their height is vh-based via aspect-ratio),
  // but the placeholder reserving this card's slot in the row was frozen
  // at open time — if it drifts out of sync with its resizing neighbours,
  // a gap or overlap appears once the card returns to the row on close.
  const sibling = hallTrack.querySelector('.saint-item.dim');
  if (sibling && currentHallOpen.placeholder) {
    const sibRect = sibling.getBoundingClientRect();
    currentHallOpen.placeholder.style.width = sibRect.width + 'px';
    currentHallOpen.placeholder.style.height = sibRect.height + 'px';
    currentHallOpen.origRect = sibRect;
  }

  const { itemEl, origRect, captionSpace } = currentHallOpen;
  const compact = isModalCompact(origRect);
  // Same correction as openHallModal/closeHallModal — see openHallModal's
  // comment. captionSpace is 0 whenever this modal opened on desktop, so
  // this is a no-op there.
  const largeRect = (compact && captionSpace)
    ? { top: origRect.top, left: origRect.left, width: origRect.width, height: origRect.height - captionSpace }
    : origRect;

  if (compact === modalCompactMode) {
    const { targetH, targetW, targetTop, targetLeft } = computeHallTarget(largeRect, compact);
    itemEl.style.top = targetTop + 'px';
    itemEl.style.left = targetLeft + 'px';
    itemEl.style.width = targetW + 'px';
    itemEl.style.height = targetH + 'px';
    return;
  }

  modalCompactMode = compact;
  hallModalQuotes.classList.remove('reveal');
  hallModalText.classList.remove('reveal');
  hallMobilePanel.classList.remove('reveal');

  setTimeout(() => {
    document.body.classList.toggle('modal-compact', compact);
    const { targetH, targetW, targetTop, targetLeft } = computeHallTarget(largeRect, compact);
    itemEl.style.top = targetTop + 'px';
    itemEl.style.left = targetLeft + 'px';
    itemEl.style.width = targetW + 'px';
    itemEl.style.height = targetH + 'px';
    requestAnimationFrame(() => {
      hallModalQuotes.classList.add('reveal');
      hallModalText.classList.add('reveal');
      hallMobilePanel.classList.add('reveal');
    });
  }, 500);
}

let lastResizeWidth = window.innerWidth;
let lastResizeHeight = window.innerHeight;
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  // Mobile browsers fire 'resize' when the address bar hides/shows during
  // ordinary scrolling — that's a real innerHeight change but not a real
  // resize the layout should react to. A genuine resize either changes
  // the width, or changes the height by much more than address-bar chrome
  // ever does (a rotation, or an actual desktop window resize).
  const significant = w !== lastResizeWidth || Math.abs(h - lastResizeHeight) > 150;
  lastResizeWidth = w;
  lastResizeHeight = h;
  if (!significant) return;

  hallInertia.measure();
  armoryInertia.measure();
  createHallPromoteObserver();
  syncMobileChapterStickyTop();

  refreshHallModalLayout();

  if (currentArmoryOpen) {
    const { spearEl, origRect } = currentArmoryOpen;
    const { scale, targetTop, targetLeft, attributionTop } = armorySpearTarget(origRect);
    spearEl.style.top = targetTop + 'px';
    spearEl.style.left = targetLeft + 'px';
    spearEl.style.transform = `rotate(-90deg) scale(${scale})`;
    armoryAttribution.style.top = attributionTop + 'px';
  }
});
</script>
