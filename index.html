const hallChaptersDesktop = createFlatChaptersController(
  document.getElementById('hall-chapters-desktop'),
  () => document.getElementById('desktop-chapters-pane')
);
/* Both controllers now take the default zero sticky offset. The compact
   one used to need getMobileStickyClearance() — the page header plus the
   measured height of a sticky hero bar that overlaid the top of its scroll
   root. Neither exists now: #mobile-texts-pane is its own scroll root and
   starts below the mode nav, so its top edge is the sticky line. */
const hallChaptersMobile = createChapterController(
  document.getElementById('hall-chapters-mobile'),
  () => document.getElementById('mobile-texts-pane')
);

/* ---- chapter accordion (shared by desktop + mobile panels) ---- */
/* Chapters progressively reveal as the reader nears the end of the
   current one (a sentinel at each chapter's bottom), not as an exclusive
   one-at-a-time accordion. Scrolling back up past the first-revealed
   chapter's start reveals the one before it, mirroring the forward
   behaviour. See stickyObserver below for how headers hand off. */
function createChapterController(container, getScrollRoot, getStickyOffset = () => 0) {
  let firstOpen = null;
  let revealedUpTo = -1;
  let nextObserver = null;
  let prevObserver = null;
  /* Only the highest-index revealed chapter past the sticky line ever
     shows its header — earlier ones that are also past it get hidden,
     un-hiding the moment scrolling carries them below the line again.
     Needed because a header only becomes position:sticky once ITS OWN
     chapter is revealed, and reveal is itself scroll-triggered — so
     there's a window where an earlier header is already stuck but the
     one meant to cover it hasn't engaged yet. stickyObserver watches
     each revealed chapter's start-sentinel with a top-shifted root
     margin matching the sticky offset, firing when that chapter's start
     crosses the line in either direction. */
  let stickyObserver = null;
  const stuckSet = new Set();
  const observedSentinels = new Set();

  // Clicking the highlighted quote itself clears it. Attached once here
  // (not inside render()) so repeated renders don't accumulate listeners.
  container.addEventListener('click', (e) => {
    const anchor = e.target.closest('.quote-anchor');
    if (anchor && anchor.classList.contains('hl')) {
      anchor.classList.remove('hl');
      if (currentHighlightEl === anchor) currentHighlightEl = null;
    }
  });

  function ensureStickyObserver() {
    if (stickyObserver) return;
    stickyObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const chapterEl = entry.target.closest('.chapter');
        if (!chapterEl) return;
        const i = Number(chapterEl.dataset.i);
        if (entry.isIntersecting) {
          stuckSet.delete(i);
        } else if (entry.rootBounds && entry.boundingClientRect.top < entry.rootBounds.top) {
          // Not intersecting because the sentinel has scrolled ABOVE the
          // sticky line — this chapter is genuinely behind us.
          stuckSet.add(i);
        } else {
          // Not intersecting for the OTHER reason: it simply hasn't been
          // scrolled into view yet (still below the sticky line, or below
          // the panel entirely). Not passed — make sure it's cleared even
          // if it was never added, since a chapter can be revealed (and
          // start being observed) already below the fold.
          stuckSet.delete(i);
        }
      });
      updateActiveHeader();
    }, { root: getScrollRoot(), rootMargin: `-${getStickyOffset()}px 0px 0px 0px`, threshold: 0 });
  }

  function updateActiveHeader() {
    const activeIndex = stuckSet.size ? Math.max(...stuckSet) : -1;
    container.querySelectorAll('.chapter').forEach(ch => {
      const i = Number(ch.dataset.i);
      ch.classList.toggle('header-passed', stuckSet.has(i) && i !== activeIndex);
    });
  }

  /* Blank space below the last revealed chapter, sized so that chapter can
     always be scrolled right up to the top of the pane.

     Without it, a chapter shorter than the pane leaves no scroll room at
     all, and revealPrevious()'s scroll compensation — set scrollTop forward
     by exactly the height just inserted above — asks for a position the
     scroller cannot reach. The browser clamps it, and the content lurches
     by precisely (paneHeight - lastChapterHeight). That is the "scroll up a
     hair, jump a whole screen" behaviour. With the tail present the
     compensated target is always valid, so the visible text does not move
     at all when an earlier chapter is revealed above it. */
  function syncTail() {
    const tail = container.querySelector('.chapters-tail');
    const root = getScrollRoot();
    if (!tail || !root) return;
    const revealed = [...container.querySelectorAll('.chapter.revealed')];
    const last = revealed[revealed.length - 1];
    tail.style.height = last ? Math.max(0, root.clientHeight - last.offsetHeight) + 'px' : '0px';
  }

  function applyVisibility() {
    ensureStickyObserver();
    container.querySelectorAll('.chapter').forEach(ch => {
      const i = Number(ch.dataset.i);
      const revealed = firstOpen !== null && i >= firstOpen && i <= revealedUpTo;
      ch.classList.toggle('revealed', revealed);
      if (revealed && !observedSentinels.has(i)) {
        const sentinel = ch.querySelector('.chapter-start-sentinel');
        if (sentinel) { stickyObserver.observe(sentinel); observedSentinels.add(i); }
      }
    });
    container.classList.toggle('has-open', firstOpen !== null);
    syncTail();
  }

  function disconnectNext() { if (nextObserver) { nextObserver.disconnect(); nextObserver = null; } }
  function disconnectPrev() { if (prevObserver) { prevObserver.disconnect(); prevObserver = null; } }
  function disconnectSticky() {
    if (stickyObserver) { stickyObserver.disconnect(); stickyObserver = null; }
    stuckSet.clear();
    observedSentinels.clear();
  }
  function disconnectAll() { disconnectNext(); disconnectPrev(); disconnectSticky(); }

  function watchNext() {
    disconnectNext();
    const chapters = container.querySelectorAll('.chapter');
    if (revealedUpTo < 0 || revealedUpTo >= chapters.length - 1) return;
    const current = container.querySelector(`.chapter[data-i="${revealedUpTo}"]`);
    const sentinel = current && current.querySelector('.chapter-end-sentinel');
    if (!sentinel) return;
    const setupTime = performance.now();
    nextObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        // IntersectionObserver always fires once immediately on observe(),
        // reporting the current state even with nothing having changed.
        // Ignore only that — a callback arriving within a few ms of setup
        // is that mandatory report, not a real scroll. Anything after is
        // genuine, however fast the user scrolled.
        if (performance.now() - setupTime < 50) return;
        if (entry.isIntersecting) {
          revealedUpTo = Math.min(revealedUpTo + 1, chapters.length - 1);
          applyVisibility();
          watchNext();
        }
      });
    }, { root: getScrollRoot(), threshold: 0.01 });
    nextObserver.observe(sentinel);
  }

  // Position of `el`'s top edge within `root`'s scrollable content,
  // independent of `el`'s offsetParent chain (which is often some other
  // positioned ancestor, not the scroll container itself — offsetTop
  // alone gave the wrong coordinate space here).
  function scrollOffsetWithin(el, root) {
    return el.getBoundingClientRect().top - root.getBoundingClientRect().top + root.scrollTop;
  }

  function revealPrevious() {
    if (firstOpen === null || firstOpen <= 0) return;
    const root = getScrollRoot();
    const beforeHeight = root.scrollHeight;
    const beforeScroll = root.scrollTop;
    firstOpen = Math.max(0, firstOpen - 1);
    applyVisibility();
    // revealing the previous chapter inserts its height above the current
    // view — compensate scrollTop by the same amount so the content on
    // screen doesn't jump, and the reveal feels like a continuous scroll
    // rather than a snap to the new chapter's top
    const grew = root.scrollHeight - beforeHeight;
    root.scrollTop = beforeScroll + grew;
    watchPrev();
  }

  function watchPrev() {
    disconnectPrev();
    if (firstOpen === null || firstOpen <= 0) return;
    const current = container.querySelector(`.chapter[data-i="${firstOpen}"]`);
    const sentinel = current && current.querySelector('.chapter-start-sentinel');
    if (!sentinel) return;
    const setupTime = performance.now();
    prevObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        // This handles the "continuous reading, scrolled down then back up"
        // case. It can't handle "chapter 2 opened directly, try to scroll
        // up immediately" — IntersectionObserver's root has no concept of
        // the sticky bar visually covering part of the viewport, so the
        // sentinel reads as "intersecting" the instant it's anywhere
        // within the scrollable area, sticky overlay or not. That case is
        // handled separately below, by reacting to the raw input directly.
        if (performance.now() - setupTime < 50) return;
        if (entry.isIntersecting) revealPrevious();
      });
    }, { root: getScrollRoot(), threshold: 0.01 });
    prevObserver.observe(sentinel);
  }

  // Direct fallback for "opened a later chapter, try to scroll up with no
  // real scroll room yet" — reacts to the raw gesture instead of relying
  // on a visibility transition that can't exist in this situation.
  const scrollRootEl = getScrollRoot();
  if (scrollRootEl) {
    scrollRootEl.addEventListener('wheel', (e) => {
      if (e.deltaY < 0 && scrollRootEl.scrollTop <= 5) revealPrevious();
    }, { passive: true });
    let touchStartY = null;
    scrollRootEl.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
    scrollRootEl.addEventListener('touchmove', (e) => {
      if (touchStartY === null) return;
      const dy = e.touches[0].clientY - touchStartY;
      if (dy > 5 && scrollRootEl.scrollTop <= 5) {
        revealPrevious();
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });
  }

  function openFrom(index) {
    firstOpen = index;
    revealedUpTo = index;
    applyVisibility();
    watchNext();
    watchPrev();
    const chapterEl = container.querySelector(`.chapter[data-i="${index}"]`);
    const root = getScrollRoot();
    if (chapterEl && root) root.scrollTop = scrollOffsetWithin(chapterEl, root) - getStickyOffset();
  }

  function close() {
    firstOpen = null;
    revealedUpTo = -1;
    disconnectAll();
    applyVisibility();
  }

  function render(chapters) {
    close();
    container.innerHTML = '';
    chapters.forEach((ch, i) => {
      const el = document.createElement('div');
      el.className = 'chapter';
      el.dataset.i = i;
      el.innerHTML = `<div class="chapter-start-sentinel"></div><button class="chapter-header" type="button">${ch.title}</button><div class="chapter-body">${ch.html}<div class="chapter-end-sentinel"></div></div>`;
      el.querySelector('.chapter-header').addEventListener('click', () => {
        if (el.classList.contains('revealed')) close();
        else openFrom(i);
      });
      container.appendChild(el);
    });
    const tail = document.createElement('div');
    tail.className = 'chapters-tail';
    container.appendChild(tail); // height managed by syncTail()
  }

  return { render, openFrom, close, syncTail };
}

/* Desktop's right-hand pane, simplified: no accordion, no sticky headers —
   every chapter prints in full as one long scroll, and the contents list on
   the left is the only thing that moves you around it (openFrom just
   scrolls the pane to that chapter's top). Mobile keeps the progressive
   accordion above (createChapterController) since it has no separate
   contents column to navigate by. */
function createFlatChaptersController(container, getScrollRoot) {
  // Same purpose as the equivalent listener in createChapterController:
  // clicking an already-highlighted quote clears it.
  container.addEventListener('click', (e) => {
    const anchor = e.target.closest('.quote-anchor');
    if (anchor && anchor.classList.contains('hl')) {
      anchor.classList.remove('hl');
      if (currentHighlightEl === anchor) currentHighlightEl = null;
    }
  });

  function render(chapters) {
    container.innerHTML = '';
    chapters.forEach((ch, i) => {
      const el = document.createElement('div');
      el.className = 'chapter revealed';
      el.dataset.i = i;
      el.innerHTML = `<div class="chapter-header">${ch.title}</div><div class="chapter-body">${ch.html}</div>`;
      container.appendChild(el);
    });
    const root = getScrollRoot();
    if (root) root.scrollTop = 0;
  }

  function openFrom(index) {
    const root = getScrollRoot();
    const el = container.querySelector(`.chapter[data-i="${index}"]`);
    if (!el || !root) return;
    // Bounding-rect diff rather than offsetTop — el's offsetParent chain
    // doesn't necessarily run through root, same reasoning as
    // scrollOffsetWithin above.
    root.scrollTop = el.getBoundingClientRect().top - root.getBoundingClientRect().top + root.scrollTop;
  }

  function close() {
    const root = getScrollRoot();
    if (root) root.scrollTop = 0;
  }

  return { render, openFrom, close, syncTail(){} };
}

let currentHighlightEl = null;
function jumpToQuote(linkedQuote) {
  const compact = currentHallOpen ? isModalCompact(currentHallOpen.origRect) : true;
  const container = compact
    ? document.getElementById('hall-chapters-mobile')
    : document.getElementById('hall-chapters-desktop');
  // Either layout shows one thing at a time, and the chapter this quote
  // lives in is not the thing currently showing — switch across before
  // trying to scroll to it, or the target sits inside a display:none pane
  // where every offset reads zero. Each path also moves its own selection
  // indicator, so the reader can see where the quote took them.
  if (compact) {
    setHallMobileMode('texts');
    hallChaptersMobile.openFrom(linkedQuote.chapterIndex);
  } else {
    setDesktopContent('chapter', linkedQuote.chapterIndex); // itself calls openFrom
  }

  requestAnimationFrame(() => {
    const anchor = container.querySelector(`.quote-anchor[data-idx="${linkedQuote.quoteIndex}"]`);
    if (!anchor) return;
    if (currentHighlightEl && currentHighlightEl !== anchor) currentHighlightEl.classList.remove('hl');

    // No sticky clearance in either layout now — each pane's own top edge
    // is the sticky line, with nothing overlaying it.
    const scrollBox = document.getElementById(compact ? 'mobile-texts-pane' : 'desktop-chapters-pane');
    const anchorTop = anchor.getBoundingClientRect().top - scrollBox.getBoundingClientRect().top + scrollBox.scrollTop;
    const targetTop = anchorTop - (scrollBox.clientHeight / 2) + (anchor.offsetHeight / 2);
    const startTop = scrollBox.scrollTop;
    tween(1000, t => { scrollBox.scrollTop = lerp(startTop, targetTop, t); }, () => {
      anchor.classList.add('hl');
      currentHighlightEl = anchor;
    });
  });
}

const HEADER_H = 30;

/* ---- Hall modal ---- */
const hallContents = document.getElementById('hall-contents');
const hallModalText = document.getElementById('hall-modal-text');
const hallMobilePanel = document.getElementById('hall-mobile-panel');
const hallClose = document.getElementById('hall-close');

let currentHallOpen = null; // { itemEl, origRect } while a Hall modal is open
let modalCompactMode = null; // tracks compact vs split-panel while a Hall modal is open

/* No resizing in either layout — the card keeps its deck size and only
   moves horizontally. Compact centres it on screen; desktop lands it in the
   middle column, centred within the fixed card-column width so saints of
   different widths all sit on the same axis between the contents list and
   the text. */
function computeHallTarget(origRect, compact) {
  const targetLeft = compact
    ? (window.innerWidth - origRect.width) / 2
    : MODAL_PAD + MODAL_CONTENTS_W + MODAL_GAP + (deckMaxCardW - origRect.width) / 2;
  return {
    targetH: origRect.height,
    targetW: origRect.width,
    targetTop: origRect.top,
    targetLeft
  };
}

/* Desktop content selection. The contents list is the only control — there
   is no mode toggle here, unlike compact: "Key Quotes" is simply the first
   entry, and every chapter follows it. */
let desktopContent = null;
function setDesktopContent(kind, chapterIndex) {
  desktopContent = kind;
  document.getElementById('desktop-quotes-pane').classList.toggle('active', kind === 'quotes');
  document.getElementById('desktop-chapters-pane').classList.toggle('active', kind === 'chapter');
  document.querySelectorAll('#hall-contents-list .contents-item').forEach(b => {
    b.classList.toggle('active', kind === 'quotes'
      ? b.dataset.content === 'quotes'
      : b.dataset.content === 'chapter' && Number(b.dataset.i) === chapterIndex);
  });
  // Offsets read while a pane is display:none are all zero (the pane has
  // just been switched to .active this same tick) — defer to the next
  // frame once it's really laid out, same reasoning for both branches.
  if (kind === 'chapter') requestAnimationFrame(() => hallChaptersDesktop.openFrom(chapterIndex));
  else requestAnimationFrame(hallQuotesCarouselDesktop.remeasure);
}

function renderContentsList(data) {
  const list = document.getElementById('hall-contents-list');
  list.innerHTML = '';
  const add = (label, kind, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'contents-item';
    b.dataset.content = kind;
    if (i !== undefined) b.dataset.i = i;
    b.textContent = label;
    // A saint whose quotes.txt lines don't appear verbatim in a chapter
    // ends up with none — offer the entry as unavailable rather than as a
    // link to an empty pane.
    if (kind === 'quotes' && !data.linkedQuotes.length) b.disabled = true;
    else b.addEventListener('click', () => setDesktopContent(kind, i));
    list.appendChild(b);
  };
  add('Key Quotes', 'quotes');
  data.chapters.forEach((ch, i) => add(ch.title, 'chapter', i));
  setDesktopContent(data.linkedQuotes.length ? 'quotes' : 'chapter', data.linkedQuotes.length ? undefined : 0);
}

/* Where the compact panel's top edge sits: directly under the saint's name,
   measured rather than derived, since the name's own height depends on
   whether it wrapped. Nothing moves vertically during the open tween, so
   this is stable from the moment .selected is applied. */
const MOBILE_PANEL_GAP = 14;
function syncMobilePanelTop() {
  if (!currentHallOpen || !modalCompactMode) return;
  const cap = currentHallOpen.itemEl.querySelector('.saint-caption');
  if (!cap) return;
  const top = Math.round(cap.getBoundingClientRect().bottom + MOBILE_PANEL_GAP);
  document.documentElement.style.setProperty('--mobile-panel-top', top + 'px');
}

/* Key Quotes / Source Texts. Compact only — the desktop split panel shows
   both at once and has no need to choose. */
let hallMobileMode = 'quotes';
function setHallMobileMode(mode) {
  hallMobileMode = mode;
  document.querySelectorAll('#hall-mode-nav a').forEach(a => a.classList.toggle('active', a.dataset.mode === mode));
  document.getElementById('mobile-quotes-pane').classList.toggle('active', mode === 'quotes');
  document.getElementById('mobile-texts-pane').classList.toggle('active', mode === 'texts');
  // The quotes pane is display:none while Source Texts is showing, and a
  // display:none element measures every offset as 0 — so the loop-scroll
  // geometry captured while hidden is meaningless and has to be retaken
  // the moment the pane is real again.
  if (mode === 'quotes') requestAnimationFrame(hallQuotesCarouselMobile.remeasure);
}
document.querySelectorAll('#hall-mode-nav a').forEach(a => {
  a.addEventListener('click', () => setHallMobileMode(a.dataset.mode));
});

let hallBusy = false; // true while an open/close animation sequence is in flight — blocks overlapping clicks that would race two tweens against the same element

function openHallModal(itemEl, data) {
  if (hallBusy || itemEl.classList.contains('selected')) return;
  hallBusy = true;
  hallDrift.pause();
  // Switches the track to touch-action:none for the duration of the
  // animation, so a stray swipe can't move the row out from under a tween
  // that just captured its position — see setLocked's own comment. There
  // is no in-flight momentum to separately cancel here: native momentum
  // was already suppressed the instant the tap that opens this modal
  // ended the gesture, same as it always was for any other tap.
  hallInertia.setLocked(true);
  hallQuotesCarouselDesktop.setLocked(true);
  hallQuotesCarouselMobile.setLocked(true);
  /* No caption bookkeeping any more. The caption used to be frozen to a
     fixed position and faded out on mobile, and its height subtracted from
     the animated box, because the image shrank into a dock there and the
     caption was not part of that. Now the whole item — image and name
     together — simply slides sideways at its deck size, so rect is the
     animation box in both layouts, unmodified. */
  const rect = itemEl.getBoundingClientRect();
  const compact = isModalCompact(rect);
  modalCompactMode = compact;
  document.body.classList.toggle('modal-compact', compact);

  const placeholder = createPlaceholder(itemEl, rect, 'item-placeholder');

  setSiblingsDim(hallTrack, '.saint-item', itemEl, true);
  document.getElementById('hall-order-nav').classList.add('dim');

  itemEl.style.top = rect.top + 'px';
  itemEl.style.left = rect.left + 'px';
  itemEl.style.width = rect.width + 'px';
  itemEl.style.height = rect.height + 'px';
  itemEl.classList.add('selected');

  const { targetTop, targetLeft } = computeHallTarget(rect, compact);
  currentHallOpen = { itemEl, origRect: rect, placeholder };

  // Width and height are held at the deck's values for the whole tween —
  // only the horizontal position changes. They stay set inline because the
  // item is position:fixed and would otherwise shrink-wrap its content.
  tween(1500, (t) => {
    itemEl.style.left = lerp(rect.left, targetLeft, t) + 'px';
  });
  itemEl.style.top = targetTop + 'px';

  // build chapter HTML once (with quote anchors embedded) and populate both panels
  const chaptersHtml = data.chapters.map((ch, ci) => ({
    title: ch.title,
    html: buildChapterHtml(ch.body, data.linkedQuotes.filter(lq => lq.chapterIndex === ci)
      .map(lq => ({ offset: lq.offset, length: lq.text.length, quoteIndex: lq.quoteIndex })))
  }));
  hallChaptersDesktop.render(chaptersHtml);
  hallChaptersMobile.render(chaptersHtml);

  renderContentsList(data);
  hallQuotesCarouselDesktop.render(data.linkedQuotes, jumpToQuote);
  hallQuotesCarouselMobile.render(data.linkedQuotes, jumpToQuote);

  // Key Quotes by default, whatever mode the last saint was left in — but
  // only when there are any. A saint whose quotes.txt lines don't appear
  // verbatim in its chapters ends up with none, and opening onto an empty
  // pane would read as the modal having failed to load.
  const hasQuotes = data.linkedQuotes.length > 0;
  document.getElementById('hall-mode-nav').classList.toggle('no-quotes', !hasQuotes);
  setHallMobileMode(hasQuotes ? 'quotes' : 'texts');
  syncMobilePanelTop();
  requestAnimationFrame(syncMobilePanelTop); // re-check once the name's actual layout (e.g. if it wrapped to two lines) has settled

  setTimeout(() => {
    hallContents.classList.add('reveal');
    hallModalText.classList.add('reveal');
    hallMobilePanel.classList.add('reveal');
    hallClose.classList.add('show');
    hallBusy = false;
    // The mobile carousel rendered while its panel was still display:none
    // (the panel only becomes visible with body.modal-compact), so its
    // offsets were all zero at render time — retake them now it is real.
    if (compact) hallQuotesCarouselMobile.remeasure();
    // The row itself stays locked (hallInertia.setLocked stays true) for
    // as long as the modal is open — matching wheel's blocked(), which
    // checks currentHallOpen too. The quote carousels are different: the
    // reader is meant to scroll them right now, so they only lock for
    // this animation window.
    hallQuotesCarouselDesktop.setLocked(false);
    hallQuotesCarouselMobile.setLocked(false);
  }, 1500);

  hallClose.onclick = () => { if (!hallBusy) closeHallModal(itemEl, placeholder); };
}

function closeHallModal(itemEl, placeholder) {
  hallBusy = true;
  hallDrift.resume(); // 5s idle countdown restarts fresh from now
  currentHallOpen = null;
  modalCompactMode = null;
  hallContents.classList.remove('reveal');
  hallModalText.classList.remove('reveal');
  hallMobilePanel.classList.remove('reveal');
  hallClose.classList.remove('show');
  hallChaptersDesktop.close();
  hallChaptersMobile.close();
  currentHighlightEl = null;

  // The placeholder's box IS the deck slot, with no correction needed: the
  // item never changed size, so its open dimensions and its resting ones
  // are the same numbers.
  const rect = placeholder.getBoundingClientRect();
  const from = itemEl.getBoundingClientRect();

  tween(1500, (t) => {
    itemEl.style.top = lerp(from.top, rect.top, t) + 'px';
    itemEl.style.left = lerp(from.left, rect.left, t) + 'px';
  }, () => {
    itemEl.classList.remove('selected');
    itemEl.removeAttribute('style');
    placeholder.remove();
    document.body.classList.remove('modal-compact');
    setSiblingsDim(hallTrack, '.saint-item', null, false);
    document.getElementById('hall-order-nav').classList.remove('dim');
    hallBusy = false;
    // Only now — matching wheel scrolling, which stays blocked for the
    // whole time the modal is open (hallBusy || currentHallOpen), not
    // just while it's animating. Releasing this any earlier would let a
    // swipe move the row while the card is still visibly open.
    hallInertia.setLocked(false);
    // The quote carousels are the opposite: they're meant to stay
    // scrollable while the modal is open (that's the whole point — the
    // reader is scrolling quotes right now), so they only lock for the
    // hallBusy animation window, matching their own blocked() predicate.
    hallQuotesCarouselDesktop.setLocked(false);
    hallQuotesCarouselMobile.setLocked(false);
  });
}

/* =====================================================================
   TEXT — a single vertical column of quotes, each linked to its source.

   Formerly the "Armory": a horizontal rack of rotating spear elements,
   each of which flew to the centre of the screen and expanded when
   tapped. That whole interaction is gone — there is no modal, no
   selection, no tween. The list simply scrolls, and drifts upward on its
   own when left alone.
===================================================================== */
const armoryTrack = document.getElementById('armory-track');
const ARMORY_BUFFER = 24; // see LOOP_BUFFER's comment — reverted for the same reason

const QUOTES_FALLBACK = `
St Antony the Great
He who sits in solitude and is quiet hath escaped from three wars.

St Antony the Great
Life and death depend on our neighbour.

John 15:12
Love one another, as I have loved you.

Psalm 46:10
Be still, and know that I am God.
`.trim();

function parseArmoryQuotes(raw) {
  const lines = raw.split('\n');
  const out = [];
  for (let i = 0; i < lines.length; i += 3) {
    const source = (lines[i] || '').trim();
    const quote = (lines[i + 1] || '').trim();
    if (source && quote) out.push({ source, quote });
  }
  return out;
}

let ARMORY_QUOTES = [];

function renderArmory() {
  armoryTrack.innerHTML = '';
  const loopQuotes = loopSafeList(ARMORY_QUOTES);
  const head = cyclicSlice(loopQuotes, loopQuotes.length - ARMORY_BUFFER, ARMORY_BUFFER);
  const tail = cyclicSlice(loopQuotes, 0, ARMORY_BUFFER);

  [...head, ...loopQuotes, ...tail].forEach((q) => {
    const el = document.createElement('div');
    el.className = 'quote-entry';
    // A source naming one of the saints links across to that saint rather
    // than out to Bible Gateway, which has nothing to return for it.
    const isSaint = SAINTS.some(s => saintMatchesSource(s, q.source));
    const label = escapeHtml(q.source);
    const link = isSaint
      ? `<a href="#" data-jump-saint="${label}">${label}</a>`
      : `<a href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(q.source)}" target="_blank" rel="noopener">${label}</a>`;
    // quotes.txt already carries its own quotation marks — see the file.
    el.innerHTML = `<div class="quote-body">${escapeHtml(q.quote)}</div><div class="quote-source">&mdash; ${link}</div>`;
    armoryTrack.appendChild(el);
  });

  requestAnimationFrame(() => {
    armoryInertia.measure();
    const first = armoryTrack.children[ARMORY_BUFFER];
    if (first) armoryInertia.resetTo(first.offsetTop);
  });
}

// Delegated, not per-entry: the clone buffer means this list holds dozens
// of copies of every quote, and one listener on the container outlives
// each re-render instead of being reattached to all of them.
armoryTrack.addEventListener('click', (e) => {
  const link = e.target.closest('[data-jump-saint]');
  if (!link) return;
  e.preventDefault();
  const target = SAINTS.find(s => saintMatchesSource(s, link.dataset.jumpSaint));
  if (!target) return;
  document.querySelector('header nav a[data-view="hall"]').click();
  // The Hall row has to be laid out and on screen before openHallModal can
  // measure the card it is animating from.
  setTimeout(() => {
    const itemEl = [...hallTrack.querySelectorAll('.saint-item')].find(el => el.dataset.id === target.id);
    if (itemEl) openHallModal(itemEl, target);
  }, 200);
});

const armoryInertia = attachLoopScroll(armoryTrack, ARMORY_BUFFER, () => loopSafeList(ARMORY_QUOTES).length,
  { axis: 'y' });
// Shorter idle than the Hall's 5s default: this list is meant to read as
// continuously drifting, so it resumes soon after a scroll rather than
// waiting out a long pause.
const armoryDrift = attachIdleDrift(armoryTrack, armoryInertia, { axis: 'y', idleMs: 1200 });
// Saints is the tab on screen at load, so Text starts frozen. The nav
// handler swaps which of the two is running from here on.
armoryDrift.pause();


/* =====================================================================
   INIT
===================================================================== */
/* The loading screen is dismissed on three independent triggers, because
   any one of them alone has a failure mode: the data resolving (normal
   case), a minimum on-screen time (so a warm cache doesn't produce a
   single-frame flash of text), and a hard ceiling (so a hung request can
   never leave a visitor staring at a permanently blank overlay). */
const LOADER_MIN_MS = 2000;
const LOADER_MAX_MS = 9000;
const loaderShownAt = performance.now();
let loaderDismissed = false;

function dismissLoader() {
  if (loaderDismissed) return;
  loaderDismissed = true;
  const el = document.getElementById('loading-screen');
  if (!el) return;
  const wait = Math.max(0, LOADER_MIN_MS - (performance.now() - loaderShownAt));
  setTimeout(() => {
    el.classList.add('done');
    // Remove rather than just hide: a full-viewport fixed overlay left in
    // place would swallow the first tap on the carousel.
    setTimeout(() => el.remove(), 700);
  }, wait);
}
setTimeout(dismissLoader, LOADER_MAX_MS);

loadSaints().then(async ({ saints, source, skipped, cache, cacheAt }) => {
  SAINTS = saints;
  // Awaited before the first renderHall(), not after — see probeImageSizes.
  // The loader is still up while this runs, and its own 9s ceiling caps
  // the wait regardless.
  await probeImageSizes(SAINTS);
  renderHall();
  const badge = document.getElementById('data-source-badge');
  const messages = {
    unconfigured: 'Demo data — set GITHUB_OWNER/REPO at the top of the script',
    error: 'Demo data — GitHub fetch failed, see console',
    empty: 'Demo data — no folders found under assets/saints/, see console',
    live: `Loaded ${saints.length} saint(s) from GitHub`
  };
  let text = messages[source] || '';
  // Which of the three listing paths ran matters when debugging missing
  // images: 'fresh' is normal on a quick reload; 'stale' means the API
  // was unreachable just now (usually the rate limit) and this is the
  // last known-good listing. Showing the actual age, not just the label,
  // is what actually lets a stuck cache be diagnosed from the outside —
  // "(cached listing)" alone looks identical whether it's 30 seconds or
  // 12 hours old, and those mean very different things.
  if (source === 'live' && (cache === 'fresh' || cache === 'stale') && cacheAt) {
    const ageMin = Math.round((Date.now() - cacheAt) / 60000);
    const ageStr = ageMin < 60 ? `${ageMin}m` : `${Math.floor(ageMin / 60)}h ${ageMin % 60}m`;
    text += cache === 'fresh' ? ` (cached ${ageStr} ago)` : ` (cached ${ageStr} ago — API unavailable)`;
  }
  if (skipped && skipped.length) text += ` — skipped (no recognised image file): ${skipped.join(', ')}`;
  if (source === 'live') text += ' — tap to refresh';
  badge.textContent = text;
  badge.style.display = 'block';
  // A direct, guaranteed way to force fresh data regardless of *why* the
  // cache looks stuck — clears the cached listing and does a real reload,
  // not just a re-render, so there's no dependency on diagnosing the
  // cause first.
  badge.style.cursor = 'pointer';
  badge.onclick = () => {
    try { localStorage.removeItem(TREE_CACHE_KEY); } catch (e) { /* ignore */ }
    location.reload();
  };
}).catch((err) => {
  console.warn('Saint loading failed unexpectedly:', err);
}).finally(() => {
  // Measure once the cards are really in the DOM, then hand over.
  hallInertia.measure();
  dismissLoader();
});

fetch('assets/text/quotes.txt')
  .then(r => { if (!r.ok) throw new Error('no file'); return r.text(); })
  .then(text => {
    const parsed = parseArmoryQuotes(text);
    if (!parsed.length) throw new Error('quotes.txt fetched OK but parsed to zero entries — check the source/quote/blank-line format');
    ARMORY_QUOTES = parsed;
    document.getElementById('armory-source-badge').textContent = `Loaded ${parsed.length} quote(s) from assets/text/quotes.txt`;
  })
  .catch((err) => {
    console.warn('Armory: falling back to built-in demo quotes —', err.message);
    ARMORY_QUOTES = parseArmoryQuotes(QUOTES_FALLBACK);
    document.getElementById('armory-source-badge').textContent = 'Demo quotes — see console for why assets/text/quotes.txt wasn\'t used';
  })
  .finally(() => {
    document.getElementById('armory-source-badge').style.display = 'block';
    renderArmory();
  });

/* Repositions the open Hall modal on resize. If the resize also crossed
   the split-panel/compact threshold, crossfades between the two layouts
   instead of snapping — fade the current panel set out, swap layout +
   reposition the card while invisible, fade the new panel set in. */
function refreshHallModalLayout() {
  if (!currentHallOpen) return;

  const { itemEl, placeholder } = currentHallOpen;

  /* Cards resize live with the viewport, but the placeholder holding this
     one's slot in the row was frozen at open time — left to drift, it
     leaves a gap or an overlap when the card returns on close.

     It has to be re-measured from a DOM clone of the SAME saint, not from
     any convenient dimmed neighbour. That shortcut was correct only while
     every card was an identical 1:2.4 box; cards are now sized from each
     image's own pixel dimensions, so a neighbour's rect is simply a
     different saint's size. The loop buffer guarantees a twin exists —
     every saint is rendered many times over. */
  const twin = [...hallTrack.querySelectorAll('.saint-item')]
    .find(el => el !== itemEl && el._saint === itemEl._saint);
  if (twin && placeholder) {
    const twinRect = twin.getBoundingClientRect();
    placeholder.style.width = twinRect.width + 'px';
    placeholder.style.height = twinRect.height + 'px';
    currentHallOpen.origRect = twinRect;
  }

  const origRect = currentHallOpen.origRect;
  const compact = isModalCompact(origRect);

  // The card is its deck size in both layouts, so a layout switch changes
  // only which panels are shown — the card itself just re-centres.
  const applyGeometry = () => {
    const { targetTop, targetLeft } = computeHallTarget(origRect, compact);
    itemEl.style.top = targetTop + 'px';
    itemEl.style.left = targetLeft + 'px';
    itemEl.style.width = origRect.width + 'px';
    itemEl.style.height = origRect.height + 'px';
    syncMobilePanelTop();
  };

  if (compact === modalCompactMode) { applyGeometry(); return; }

  modalCompactMode = compact;
  hallContents.classList.remove('reveal');
  hallModalText.classList.remove('reveal');
  hallMobilePanel.classList.remove('reveal');

  setTimeout(() => {
    document.body.classList.toggle('modal-compact', compact);
    applyGeometry();
    requestAnimationFrame(() => {
      hallContents.classList.add('reveal');
      hallModalText.classList.add('reveal');
      hallMobilePanel.classList.add('reveal');
      // Whichever carousel was hidden before the switch measured itself as
      // zero-sized; the one now on screen needs its geometry retaken.
      if (compact) hallQuotesCarouselMobile.remeasure();
      else hallQuotesCarouselDesktop.remeasure();
    });
  }, 500);
}

let lastResizeWidth = window.innerWidth;
let lastResizeHeight = window.innerHeight;
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  // Mobile browsers fire 'resize' when the address bar hides/shows during
  // ordinary scrolling — that's a real innerHeight change but not a real
  // resize the layout should react to. A genuine resize either changes
  // the width, or changes the height by much more than address-bar chrome
  // ever does (a rotation, or an actual desktop window resize).
  const significant = w !== lastResizeWidth || Math.abs(h - lastResizeHeight) > 150;
  lastResizeWidth = w;
  lastResizeHeight = h;
  if (!significant) return;

  layoutHallCards(); // must precede measure() — see renderHall's own call
  hallInertia.measure();
  armoryInertia.measure();
  createHallPromoteObserver();

  refreshHallModalLayout(); // re-centres the open card and re-syncs the compact panel's top edge
  // The tail is sized off the pane's height, which the resize just changed.
  hallChaptersDesktop.syncTail();
  hallChaptersMobile.syncTail();
  // The Text view needs nothing here: its entries are plain flow content
  // that reflows on its own, and there is no longer a positioned element
  // whose coordinates would have to be recomputed.
});
</script>

</body>
</html>
