<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Orthodox Saint</title>
<meta name="description" content="The saints of the Orthodox Church, church by church - Russian, Romanian and Greek, each in its own calendar." />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e5e4dd" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1412" />
<!-- The eight-pointed Orthodox cross (author, 2026-08-24). It replaces the
     gold cell of the veneration badge, which was the mark of an element
     removed at Amendment 25 — so the favicon had been spending gold on a
     thing that no longer exists. Drawn in ink, not gold: DESIGN.md §2
     reserved gold for a finding about veneration, and a site mark was not
     one. *Reversed by the author, 2026-08-25: "make the site icon gold
     colour orthodox cross."* The mark is `--gold` in both themes now
     (#A98237 day, #C79A4B vigil), so §2's "gold is spent nowhere" is once
     again untrue of the favicon — this time by instruction rather than by
     oversight, and recorded as such in DESIGN.md §2. The SVG carries its own
     prefers-color-scheme rule so the cross keeps its footing on a dark tab
     strip. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Cstyle%3E*{fill:%23A98237}@media(prefers-color-scheme:dark){*{fill:%23C79A4B}}%3C/style%3E%3Crect%20x='7'%20y='1'%20width='2'%20height='13.4'/%3E%3Crect%20x='5'%20y='2.6'%20width='6'%20height='1.5'/%3E%3Crect%20x='3'%20y='5.6'%20width='10'%20height='2'/%3E%3Cpolygon%20points='4,9.8%2012,11.4%2012,13%204,11.4'/%3E%3C/svg%3E" />

<script>
  // Theme before first paint. Runs ahead of any stylesheet so the first
  // painted frame is already the right colour — later would flash, and would
  // also fire the theme fade on load. Reads the same key settings.js owns: a
  // stored 'light' or 'dark' is the reader's choice; anything else (nothing,
  // or the old 'system') means follow the OS (author, 2026-08-22).
  (function () {
    try {
      var theme = JSON.parse(localStorage.getItem('gos-settings') || '{}').theme;
      var dark =
        theme === 'dark' ||
        (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {
      /* storage disabled — system-light default, harmless */
    }
  })();
</script>
</head>
<body>
  <div id="veil">
    <!-- Painted from the pack at boot (author, 2026-08-25: the title follows
         the chosen language). The English stands in the markup so the veil
         has something to show in the moment before the modules parse, and
         because it is what a reader with no stored choice gets anyway. -->
    <div class="veil-name" data-site-name>Orthodoxy Daily</div>
    <div class="veil-line"></div>
  </div>

  <header class="chrome">
    <a class="site-name" href="/" data-site-name>Orthodoxy Daily</a>
    <nav class="site-nav" id="site-nav" aria-label="Site"></nav>
    <!-- The calendar control names the church the site reads and opens the
         chooser in the panel below the header (author, 2026-08-22; it was
         Select Tradition until then). It sits in its own box rather than in
         the corner because the two part company on a narrow screen (author,
         2026-08-24): there it drops to the nav's line, under the toggles. -->
    <div class="chrome-calendar">
      <button id="church-open" type="button" class="church-open utility"
        aria-controls="church-panel" aria-expanded="false"></button>
    </div>
    <div class="chrome-corner">
      <!-- The language control (author, 2026-08-24): a globe mark and the
           current language's code, five languages in the panel below. Beside
           it the theme toggle, a sun/moon icon. Today's date stood here from
           2026-08-21 to 2026-08-22. -->
      <button id="lang-open" type="button" class="church-open utility"
        aria-controls="lang-panel" aria-expanded="false"></button>
      <button id="theme-toggle" type="button" class="icon-button"></button>
    </div>
  </header>
  <div class="church-panel" id="church-panel" hidden></div>
  <div class="church-panel" id="lang-panel" hidden></div>

  <main class="chrome">
    <div id="view"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
