<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test</title>

<script>
  // Applied before <style> even parses, so the very first paint already
  // has the right theme — doing this later (e.g. in the main script at
  // the bottom of <body>) would show a flash of the wrong theme first,
  // and would also visibly trigger the 2s fade on every page load.
  (function () {
    try {
      if (localStorage.getItem('dark-mode') === '1') document.documentElement.classList.add('dark');
    } catch (e) { /* private-mode / storage disabled — default to light, harmless */ }
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root{
    --bg: #ffffff;
    --ink: #1c1a16;
    --ink-soft: #55524a;
    --line-grey: #b7b1a2;
    --line-grey-soft: #e2ddd0;
    --rubric: #8a2e26;
    --hl: #f5e05a;
  }
  /* Dark mode — toggled via .dark on <html> (not <body>) so the very
     first paint already has the right background, no flash. Only --bg
     and --ink are exact values from the brief (rgb(15,13,15) /
     rgb(245,245,245)); the rest are this file's existing accent colours
     re-tuned to the same relative roles (soft text, dividers, the red
     accent, the quote highlight) so they read correctly against a
     near-black background instead of disappearing or glaring. */
  html.dark{
    --bg: rgb(15,13,15);
    --ink: rgb(245,245,245);
    --ink-soft: rgb(170,166,158);
    --line-grey: rgb(90,86,79);
    --line-grey-soft: rgb(38,35,32);
    --rubric: rgb(214,109,97);
    --hl: rgb(199,169,58);
  }
  /* Applies to every element with its own background/text/border colour
     — deliberately broad rather than an enumerated list, since that list
     would need updating every time a new coloured element is added.
     Elements with their own more specific transition (hover states, the
     loading bar's pulse) keep that faster one; CSS resolves per-property
     by specificity, so this only fills in the elements that don't
     already declare their own. */
  *{ box-sizing:border-box; transition: background-color 2s ease, color 2s ease, border-color 2s ease, fill 2s ease, stroke 2s ease; }

  /* ---- loading screen ---------------------------------------------
     Opacity and colour only. The site's rule that position/rotation/scale
     are tweened in JS rather than CSS is about animations that have to
     stay in sync with measured layout; nothing here moves, so a keyframe
     is the simpler tool and it runs off the main thread. */
  #loading-screen{
    position:fixed; inset:0; z-index:200;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    /* Fades itself out, then is removed from the DOM entirely so it can
       never intercept a tap once the site is live. */
    transition:opacity .55s ease, background-color 2s ease;
  }
  #loading-screen.done{ opacity:0; pointer-events:none; }
  .loading-stack{
    text-align:center;
    padding:24px;
    max-width:min(560px, 88vw);
    animation:loading-breathe 3.4s ease-in-out infinite;
  }
  .loading-stack p{
    margin:0 0 9px 0;
    font-size:15px;
    line-height:1.55;
    color:var(--ink);
    font-style:italic;
    /* Greek, Cyrillic, Arabic, Chinese and Devanagari all need to fall
       through to whatever the platform ships (Noto on Android) — Times
       has no glyphs for most of these, and without a fallback the lines
       would render as tofu boxes. */
    font-family:'Times New Roman', Times, 'Noto Serif', 'Noto Naskh Arabic',
                'Noto Serif Devanagari', 'Noto Serif CJK SC', serif;
  }
  .loading-stack p[lang="ar"]{ font-size:17px; }
  .loading-stack p[lang="zh"], .loading-stack p[lang="hi"]{ font-style:normal; }
  .loading-ref{
    margin-top:16px !important;
    font-style:normal !important;
    font-size:11px !important;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .loading-bar{
    margin:26px auto 0 auto;
    width:min(240px, 60vw);
    height:1px;
    background:var(--line-grey);
    animation:loading-pulse 1.8s ease-in-out infinite;
  }
  @keyframes loading-breathe{
    0%, 100% { opacity:0.25; }
    50%      { opacity:1; }
  }
  @keyframes loading-pulse{
    0%, 100% { background:var(--line-grey); }
    50%      { background:var(--ink); }
  }
  /* Respect a stated preference for less motion: the screen still appears
     and still tells the reader what is happening, it just holds steady. */
  @media (prefers-reduced-motion: reduce){
    .loading-stack{ animation:none; opacity:1; }
    .loading-bar{ animation:none; background:var(--ink-soft); }
  }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Times New Roman', Times, serif;
    overflow:hidden;
    /* background matches the Hall images' .25s crossfade (see
       .saint-card's own override below) — otherwise the page behind and
       around the cards kept fading over the sitewide 2s while the image
       itself had already switched, so the "page background" and "image
       background" visibly drifted apart mid-toggle even though they're
       meant to read as the same surface. Text colour keeps the slower
       ambient fade. */
    transition:background-color .25s ease, color 2s ease;
  }
  a{ color:inherit; }

  /* ---------------- Header ---------------- */
  header{
    position:relative;
    z-index:50;
    height:30px;
    background:var(--bg);
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--line-grey-soft);
    padding:0 20px;
  }
  header .brand{
    flex:1 1 0%;
    display:flex;
    align-items:center;
    font-size:16px;
    letter-spacing:0.08em;
    white-space:nowrap;
  }
  header nav{
    flex:1 1 0%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  header nav a{
    cursor:pointer;
    padding-bottom:3px;
    border-bottom:1px solid transparent;
    white-space:nowrap;
    transition:border-color .3s ease, color .3s ease;
  }
  header nav a:hover,
  header nav a.active{
    color:var(--rubric);
    border-color:var(--rubric);
  }
  header .spacer{
    flex:1 1 0%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
  }
  #dark-toggle{
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    font:inherit;
    color:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:color .3s ease;
  }
  #dark-toggle:hover{ color:var(--rubric); }
  #dark-toggle svg{ width:16px; height:16px; }

  @media (max-width:700px){
    header .brand{ font-size:14px; }
    header nav{ gap:34px; justify-content:flex-end; padding-right:4px; }
  }

  main{ height:calc(100vh - 30px); height:calc(100dvh - 30px); position:relative; }

  .view{ position:absolute; inset:0; display:none; }
  .view.active{ display:block; }

  .label{
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--rubric);
    margin-bottom:12px;
    text-align:center;
  }

  /* ---------------- Hall of Saints — carousel ---------------- */
  /* touch-action:pan-x, not the bare default — verified via CDP tracing:
     an element with no touch-action override routes scrollLeft writes
     through Chromium's slow main-thread path; pan-x (like :none) gets
     the fast composited-scroll path, but still permits native touch
     panning unlike :none. setLocked() (attachLoopScroll) only swaps to
     :none for the brief window a modal tween needs the row still, then
     restores pan-x/pan-y — never plain 'auto', which would lose the
     fast path again. */
  #hall-track{
    height:100%;
    display:flex;
    align-items:flex-start;
    gap:10px;
    overflow-x:auto;
    overflow-y:hidden;
    touch-action:pan-x;
    -webkit-user-select:none;
    user-select:none;
    scrollbar-width:none;
  }
  #hall-track::-webkit-scrollbar{ display:none; }
  #hall-status{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-style:italic; color:var(--ink-soft); font-size:14px;
  }

  .saint-item{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:10px;
    margin-bottom:calc(40px + env(safe-area-inset-bottom));
    cursor:pointer;
    /* Keep this short — was 1s, but every DOM clone in the row (a small
       saint count means loopSafeList + the clone buffer produce a
       dozen-plus copies of the same saint) has .dim removed at once when
       a modal closes. At 1s that's a full second of many clones visible
       at different mid-fade opacities — reads as duplicate images
       flashing in, worst on desktop where more of the row is in view. */
    transition:opacity 0.2s ease;
  }
  .saint-item.dim{ opacity:0; pointer-events:none; }

  .saint-card{
    flex:0 0 auto;
    height:calc(100vh - 104px);
    height:calc(100dvh - 104px);
    aspect-ratio:1/2.4;
    overflow:hidden;
    background:var(--bg);
    contain:layout paint;
    /* Overrides the sitewide 2s background fade (see the `*` rule's own
       comment) — at 2s, this card's own background lagged behind the
       .25s image crossfade, showing as a mismatched-colour sliver at the
       image's letterboxed edges for up to 2s after every theme toggle. */
    transition:background-color .25s ease;
  }
  .saint-card{ position:relative; }
  .saint-card img{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none; /* suppress the browser's built-in image-hover search icon */
  }
  /* Thumb paints first (tiny, always cached fast) and sits underneath;
     the full-res image fades in over it once decoded, so a fast scroll
     shows a blurred likeness instead of a blank card. */
  .saint-card img.thumb{
    position:absolute; inset:0;
    filter:blur(8px);
    transform:scale(1.08); /* hides the blur's soft edge fringe */
    transition:opacity .25s ease;
  }
  .saint-card img.full{
    position:relative;
    opacity:0;
    transition:opacity .25s ease;
  }
  .saint-card img.full.loaded{ opacity:1; }
  /* The open/close tween sets width/height directly (JS, not CSS
     transitions — see TWEEN's own comment), which forces a real layout
     + repaint + re-rasterize of the image bitmap on every single frame.
     On a real device with a real (non-trivial) image and a weaker GPU,
     that re-rasterization can visibly lag a frame or more behind the
     container it's supposed to fill — seen as a stale, differently-sized
     "ghost" of the same image bleeding through underneath the current
     frame. will-change promotes the element to its own compositing layer
     ahead of time rather than only once the animation is already
     under way, which is what actually reduces that catch-up lag. */
  .saint-item.selected{ will-change:top, left, width, height; }
  .saint-item.selected .saint-card img{ will-change:width, height; }

  .saint-caption{
    margin-top:10px;
    font-size:11px;
    line-height:14px;
    letter-spacing:0.08em;
    text-align:center;
    text-transform:uppercase;
    color:var(--ink-soft);
    transition:color .3s ease;
  }
  .saint-item:hover .saint-caption{ color:var(--rubric); }
  /* Set only while the Hall modal is opening/open on mobile — see
     openHallModal's comment. top/left/width are set inline per-instance,
     capturing wherever the caption already was on screen. */
  .saint-caption.detach{ position:fixed; margin:0; z-index:39; }

  /* Mobile only: real names can wrap to 2 lines, and the deck sits close
     to the home-indicator safe area — give the caption guaranteed room
     for 2 lines and shrink the card by the same amount, so nothing can
     ever overflow into the safe-area buffer below. Desktop has neither
     constraint, so it keeps the plain single-line budget above. */
  @media (max-width: 768px){
    .saint-card{
      height:calc(100vh - 118px - env(safe-area-inset-bottom));
      height:calc(100dvh - 118px - env(safe-area-inset-bottom));
    }
    .saint-caption{
      min-height:28px;
      max-width:220px;
      margin-left:auto; margin-right:auto;
      display:flex; align-items:center; justify-content:center;
    }
  }

  .saint-item.selected{ position:fixed; z-index:40; margin:0; }
  .saint-item.selected .saint-card{ box-shadow:none !important; }
  body.modal-compact .saint-item.selected .saint-card{ height:100%; width:100%; aspect-ratio:auto; } /* mobile only — the caption is hidden there so the card can fill the whole wrapper; on desktop the caption stays visible and needs its own space within the same wrapper */
  .item-placeholder{ flex:0 0 auto; visibility:hidden; }

  /* ---------------- Hall Modal — desktop split panel ---------------- */
  #hall-modal-quotes, #hall-modal-text{
    position:fixed;
    top:0; height:100%; width:50%;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transition:opacity 1s ease;
    z-index:41;
    pointer-events:none;
  }
  #hall-modal-quotes{ left:0; }
  #hall-modal-text{ right:0; }
  #hall-modal-quotes.reveal, #hall-modal-text.reveal{ opacity:1; pointer-events:auto; }

  .quotes-viewport{
    position:relative;
    width:min(320px, 80vw);
    height:308px;
    overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
  }
  .quotes-viewport.small{ height:clamp(90px, 15vh, 160px); }
  .quotes-track{
    display:flex;
    flex-direction:column;
    height:100%;
    overflow-x:hidden;
    overflow-y:auto;
    touch-action:pan-y; /* see the touch-action comment above #hall-track — pan-y is this axis's equivalent */
    -webkit-user-select:none;
    user-select:none;
    scrollbar-width:none;
  }
  .quotes-track::-webkit-scrollbar{ display:none; }
  .quotes-track .q{
    flex:0 0 auto;
    height:44px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-style:italic;
    font-size:14px;
    color:var(--ink-soft);
    padding:0 14px;
    border-bottom:1px solid var(--line-grey-soft);
    cursor:pointer;
    transition:color .3s ease;
  }
  .quotes-track .q:hover{ color:var(--rubric); }
  .quotes-viewport.small .q{ height:32px; font-size:11.5px; }

  .chapters-panel{
    width:min(420px, 80vw);
    max-height:70vh;
    overflow-y:auto;
    scrollbar-width:none;
  }
  .chapters-panel::-webkit-scrollbar{ display:none; }
  .chapter-header{
    display:block; width:100%; text-align:left;
    background:var(--bg); border:none; font-family:inherit;
    font-size:14px; letter-spacing:0.03em;
    color:var(--ink); cursor:pointer;
    padding:10px 4px; border-bottom:1px solid var(--line-grey-soft);
    transition:color .3s ease, background-color 2s ease;
  }
  .chapter-header:hover{ color:var(--rubric); }
  .chapter.revealed .chapter-header{
    position:sticky; top:0; z-index:2;
  }
  body.modal-compact .mobile-chapters .chapter.revealed .chapter-header{
    top: var(--mobile-chapter-sticky-top, 178px); /* set by syncMobileChapterStickyTop() — keeps every revealed chapter's header pinned below the bar, not just the first one */
  }
  /* An earlier chapter's header that's been scrolled past and superseded
     by a later one — see stickyObserver's comment in
     createChapterController. opacity, not display:none, so it still
     participates in position:sticky's own layout math and comes back
     instantly (no re-render) the moment scrolling carries it below the
     sticky line again. */
  .chapter.header-passed .chapter-header{ opacity:0; pointer-events:none; }
  .chapter-body{ display:none; font-size:15px; line-height:1.7; color:var(--ink-soft); padding:12px 4px 26px 4px; }
  .chapter-body p{ margin-bottom:1em; }
  .chapter.revealed .chapter-body{ display:block; }
  .chapter-start-sentinel, .chapter-end-sentinel{ height:1px; }
  .chapters-panel.has-open .chapter:not(.revealed){ display:none; }
  .quote-anchor{ transition:background-color 1s ease; border-radius:2px; }
  .quote-anchor.hl{ background-color:var(--hl); transition:background-color .2s ease; cursor:pointer; }

  #hall-close{
    position:fixed; top:44px; right:6vw; z-index:42;
    width:34px; height:34px;
    border:1px solid var(--line-grey);
    background:var(--bg);
    display:none; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .3s ease, transform .3s ease, background-color 2s ease;
  }
  #hall-close.show{ display:flex; }
  #hall-close:hover{ border-color:var(--rubric); transform:rotate(90deg); }

  /* ---------------- Hall Modal — compact (mobile-style) layout ----------------
     Driven by body.modal-compact, toggled in JS based on available width
     rather than a fixed viewport breakpoint — see isModalCompact(). This is
     deliberately separate from the header's own @media(max-width:700px). */
  #hall-mobile-panel{ display:none; }
  body.modal-compact #hall-modal-quotes, body.modal-compact #hall-modal-text{ display:none; }
  body.modal-compact #hall-mobile-panel{
    display:block;
    position:fixed; inset:0;
    padding-top:30px; /* clears the real page header — combined with the bar's own top:0 below, this keeps its natural and stuck positions identical, so there's no mismatch between the space it reserves in flow and where it actually paints */
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease, background-color 2s ease;
    z-index:35;
    background:var(--bg);
  }
  body.modal-compact #hall-mobile-panel.reveal{ opacity:1; pointer-events:auto; }

  .mobile-hero-bar{
    position:sticky; top:0; z-index:2; /* the panel's padding-top provides the clearance from the page header — an extra top offset here would double it and also create a natural/stuck position mismatch */
    background:var(--bg);
    border-bottom:1px solid var(--line-grey-soft);
    padding-bottom:20px; /* extends the bar's own opaque coverage down to where the chapter header takes over sticking — without this, that gap was uncovered by any background, letting scrolled-past body text show through it */
  }
  .mobile-hero-row{
    position:relative;
    display:flex; align-items:flex-start; /* top-align, not center — matches the docked image's own top edge exactly, no extra space to redistribute */
    padding:26px 92px 0 12px; /* right space reserves room for the docked image */
    min-height:clamp(90px, 15vh, 160px); /* matches .quotes-viewport.small exactly, and the docked image's height */
  }
  .mobile-hero-bar .quotes-viewport.small{ flex:1; margin:4px 0 0 0; width:auto; }

  .mobile-saint-name{
    padding:11px 12px 8px 12px;
    text-align:center; font-size:14px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--ink);
  }

  .mobile-chapters{ padding:0 18px calc(70px + env(safe-area-inset-bottom)) 18px; }
  .mobile-chapters .chapters-panel{ width:100%; max-height:none; overflow:visible; }

  body.modal-compact .saint-item .saint-caption{ transition:opacity .3s ease; }
  body.modal-compact .saint-item.selected .saint-caption{ opacity:0; pointer-events:none; } /* the deck caption is replaced by the dedicated centred name in the sticky header */

  /* ---------------- Armory ---------------- */
  /* touch-action:pan-x — see the comment above #hall-track. */
  #armory-track{
    height:100%;
    display:flex;
    align-items:center;
    gap:14px;
    overflow-x:auto;
    overflow-y:hidden;
    touch-action:pan-x;
    -webkit-user-select:none;
    user-select:none;
    scrollbar-width:none;
  }
  #armory-track::-webkit-scrollbar{ display:none; }

  .spear{
    flex:0 0 auto;
    width:54px;
    height:calc(100vh - 100px - env(safe-area-inset-bottom));
    height:calc(100dvh - 100px - env(safe-area-inset-bottom));
    margin-top:10px; margin-bottom:calc(40px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:14px;
    cursor:pointer;
    position:relative;
    transition:opacity 0.2s ease; /* was 1s — see .saint-item's comment, same clone-fade issue */
  }
  .spear .hilt{ display:flex; flex-direction:column; align-items:center; gap:3px; flex:0 0 auto; }
  .spear .hilt .pommel{ width:6px; height:6px; border-radius:50%; background:var(--line-grey); transition:background-color .4s ease; }
  .spear .hilt .grip{ width:1.5px; height:9px; background:var(--line-grey); transition:background-color .4s ease; }
  .spear .hilt .guard{ width:24px; height:1.5px; background:var(--line-grey); transition:background-color .4s ease; }
  .spear:hover .hilt .pommel, .spear:hover .hilt .grip, .spear:hover .hilt .guard{ background:var(--rubric); }

  .spear .shaft-text{
    writing-mode:vertical-rl;
    text-orientation:sideways; /* 'mixed' keeps quote marks upright per the Unicode table — force everything to rotate together */
    font-style:italic;
    font-size:13px;
    color:var(--ink-soft);
    flex:1;
    overflow:hidden;
    letter-spacing:0.02em;
    margin-top:10px;
    transition:color .3s ease;
  }
  .spear:hover .shaft-text{ color:var(--ink); }
  .spear.dim{ opacity:0; pointer-events:none; }
  .spear.selected{ position:fixed; z-index:40; margin:0; padding-top:0; background:var(--bg); transform-origin:center center; }
  .spear.selected .hilt{ display:none; }
  .spear-placeholder{ flex:0 0 auto; visibility:hidden; }

  #armory-attribution{
    position:fixed; left:50%; transform:translateX(-50%);
    top:calc(50% + 60px); z-index:41;
    font-style:italic; font-size:14px; color:var(--ink-soft);
    text-align:center; opacity:0; transition:opacity 1s ease, color 2s ease; white-space:nowrap;
  }
  #armory-attribution.reveal{ opacity:1; }
  #armory-attribution a{ border-bottom:1px solid var(--rubric); color:var(--rubric); text-decoration:none; }

  #armory-close{
    position:fixed; top:44px; right:6vw; z-index:42;
    width:34px; height:34px; border:1px solid var(--line-grey);
    background:var(--bg); display:none; align-items:center; justify-content:center;
    cursor:pointer; transition:border-color .3s ease, transform .3s ease, background-color 2s ease;
  }
  #armory-close.show{ display:flex; }
  #armory-close:hover{ border-color:var(--rubric); transform:rotate(90deg); }

  @media (prefers-reduced-motion:reduce){ *{ transition-duration:0.01ms !important; } }
</style>
</head>
<body>

<!-- Sits in the HTML rather than being built by script, so it is painted
     on the very first frame instead of after the JS parses. It is an
     overlay, never display:none on the content behind it — the carousels
     measure item widths from real layout, and hiding them would give a
     stride of zero. -->
<div id="loading-screen" role="status" aria-label="Loading">
  <div class="loading-stack">
    <p lang="en">the prayers of the saints</p>
    <p lang="la">orationes sanctorum</p>
    <p lang="grc">αἱ προσευχαὶ τῶν ἁγίων</p>
    <p lang="ru">молитвы святых</p>
    <p lang="ar" dir="rtl">صلوات القديسين</p>
    <p lang="zh">众圣徒的祈祷</p>
    <p lang="hi">संतों की प्रार्थनाएँ</p>
    <p lang="fr">les prières des saints</p>

<script>
/* =====================================================================
   CONFIG — fill these in with your actual repo details. Without them,
   the site can't ask GitHub what folders exist under assets/saints/,
   and falls back to a small built-in demo so the page still works.
===================================================================== */
const GITHUB_OWNER  = 'simonandpeter';
const GITHUB_REPO   = 'test';
const GITHUB_BRANCH = 'main';

/* The desktop split-panel layout needs real room: the chapters panel
   maxes out at 420px, centred in the right half, and must clear the
   centred card. Computed directly (collision check) rather than a fixed
   pixel breakpoint — independent of the header's own 700px breakpoint,
   since this is about panel geometry, not device type. */
function isModalCompact(origRect) {
  const availH = window.innerHeight - HEADER_H;
  const targetH = availH * 0.62;
  const scale = targetH / origRect.height;
  const targetW = origRect.width * scale;
  const chaptersPanelHalf = 210; // half of the 420px chapters panel
  const buffer = 60;
  const neededWidth = 4 * chaptersPanelHalf + 2 * targetW + buffer;
  return window.innerWidth < neededWidth;
}

/* =====================================================================
   NAV
===================================================================== */
let armoryEverVisible = false;
document.querySelectorAll('header nav a').forEach(a => {
  a.addEventListener('click', () => {
    document.querySelectorAll('header nav a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    const target = a.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(`${target}-view`).classList.add('active');
    // Elements inside a display:none view are never laid out by the
    // browser, so any offsetLeft-based measurement taken while hidden
    // reads as 0 and stays wrong forever, even long after the tab
    // becomes visible. Re-measure once it's actually on screen.
    requestAnimationFrame(() => {
      if (target === 'armory') {
        armoryInertia.measure();
        if (!armoryEverVisible) {
          // Armory starts hidden (Hall is the default tab), so its very
          // first resetTo() — inside renderArmory() — also ran while
          // hidden and landed on a wrong position. Correct it just this
          // once; don't repeat this on later visits or it'd yank the
          // user's own scroll position back to the start every time.
          armoryEverVisible = true;
          const first = armoryTrack.children[ARMORY_BUFFER];
          if (first) armoryInertia.resetTo(first.offsetLeft);
        }
      } else {
        hallInertia.measure();
      }
    });
  });
});

/* Swaps every rendered saint-card image to its light/dark variant in
   place, rather than re-rendering the carousel — a full re-render would
   reset scroll position and retrigger the loop-scroll clone buffer.

   Runs as three explicit phases rather than one simultaneous crossfade:
   images fade fully to opacity 0, only then does the theme class flip (so
   the page/card background starts its own fade), and only once that
   background fade has finished (and the new image variant has actually
   loaded) do the images fade back in. A simultaneous fade let the two
   motions visually race each other; staggering them reads as one
   deliberate transition instead. */
const IMAGE_FADE_MS = 250; // must match .saint-card img's opacity transition duration
const BG_FADE_MS = 250;    // must match body/.saint-card background-color transition duration
let modeToggleId = 0; // bumped on every toggle; lets a superseded in-flight sequence (fast double-toggle) bail out instead of clobbering the newer one

function runModeTransition(isDark) {
  const sequence = ++modeToggleId;
  const changing = Array.from(document.querySelectorAll('.saint-card img.thumb, .saint-card img.full'))
    // full images start with no src (see the Hall promotion block below) —
    // leave them unset so toggling theme doesn't force-decode every
    // not-yet-promoted image; promoteHallImage() reads the theme fresh
    // whenever it does fire.
    .filter(img => !(img.classList.contains('full') && !img.getAttribute('src')))
    .filter(img => {
      const target = isDark ? img.dataset.dark : img.dataset.light;
      return target && img.getAttribute('src') !== target;
    });

  changing.forEach(img => { img.style.opacity = '0'; });

  setTimeout(() => {
    if (sequence !== modeToggleId) return; // a newer toggle already took over

    document.documentElement.classList.toggle('dark', isDark);
    try { localStorage.setItem('dark-mode', isDark ? '1' : '0'); } catch (e) { /* private-mode / storage disabled — toggle still works, just won't persist across reloads */ }

    // swap src now, while every changing image is still invisible — its
    // fetch/decode time varies, so this hides that variance behind the
    // background fade instead of exposing it as a pop.
    const imagesLoaded = changing.map(img => new Promise(resolve => {
      img.addEventListener('load', resolve, { once: true });
      img.addEventListener('error', resolve, { once: true });
      img.setAttribute('src', isDark ? img.dataset.dark : img.dataset.light);
    }));
    const bgSettled = new Promise(resolve => setTimeout(resolve, BG_FADE_MS));

    Promise.all([...imagesLoaded, bgSettled]).then(() => {
      if (sequence !== modeToggleId) return;
      changing.forEach(img => { img.style.opacity = ''; });
    });
  }, changing.length ? IMAGE_FADE_MS : 0);
}

document.getElementById('dark-toggle').addEventListener('click', () => {
  runModeTransition(!document.documentElement.classList.contains('dark'));
});

/* =====================================================================
   TWEEN — every position/rotation/scale animation in this file runs
   through this. No CSS transitions on those properties anywhere —
   see the note at the bottom of the file for why.
===================================================================== */
function tween(duration, onFrame, onComplete) {
  const ease = t => 1 - Math.pow(1 - t, 3);
  const start = performance.now();
  function step(now) {
    const raw = Math.min(1, (now - start) / duration);
    onFrame(ease(raw), raw);
    if (raw < 1) requestAnimationFrame(step);
    else if (onComplete) onComplete();
  }
  requestAnimationFrame(step);
}
function lerp(a, b, t) { return a + (b - a) * t; }

/* Shared by the Hall and Armory open/close flows: reserves an item's row
   slot with a same-sized placeholder while the real element goes
   position:fixed, and dims/undims the rest of the row around it. Takes
   an already-measured rect rather than measuring itemEl itself — by the
   time this runs, callers may have already mutated the element (Hall's
   caption gets detached from flow first, which changes itemEl's OWN
   measured height if this re-measured fresh). */
function createPlaceholder(el, rect, className) {
  const placeholder = document.createElement('div');
  placeholder.className = className;
  placeholder.style.width = rect.width + 'px';
  placeholder.style.height = rect.height + 'px';
  placeholder.style.marginTop = getComputedStyle(el).marginTop;
  placeholder.style.marginBottom = getComputedStyle(el).marginBottom;
  el.after(placeholder);
  return placeholder;
}
function setSiblingsDim(track, itemSelector, exceptEl, dim) {
  track.querySelectorAll(itemSelector).forEach(el => {
    if (dim && el === exceptEl) return;
    el.classList.toggle('dim', dim);
  });
}

/* =====================================================================
   SHARED — infinite-loop carousel, driven by native touch/wheel scrolling
   (not custom JS physics). Native scrolling is what lets Chromium put
   this on its own composited scroll layer — touch-action:none would
   disqualify it and force scrollLeft writes onto the slower main-thread
   path, which is where visible jitter comes from.

   Trade-off: a native scroller has a true edge, and a correction can
   only be applied when it's safe to write scrollLeft (mid-momentum, a
   write on Android cancels the fling outright). So corrections are
   deferred until a gesture and its momentum have plausibly finished,
   backed by a generous clone buffer so a fling has room to run its
   course first. Comfortable for today's dataset sizes; an extremely
   small dataset narrows that margin.
===================================================================== */
function attachLoopScroll(trackEl, bufferCount, getItemCount, opts = {}) {
  const axis = opts.axis || 'x';
  const easeFactor = opts.easeFactor ?? 0.16; // wheel: fraction of the remaining distance closed per frame
  const scrollProp = axis === 'x' ? 'scrollLeft' : 'scrollTop';
  const offsetProp = axis === 'x' ? 'offsetLeft' : 'offsetTop';
  /* Called before anything that would move the track programmatically or
     respond to wheel input. Backed by dynamically toggling touch-action
     on trackEl (see setLocked below) for touch, since native panning
     can't be intercepted after the fact the way a wheel event can. */
  const blocked = opts.blocked || (() => false);

  let targetScroll = 0;
  let isEasing = false;
  let raf = null;
  let stride = 0;

  function measure() {
    const a = trackEl.children[bufferCount];
    const b = trackEl.children[bufferCount + 1];
    const newStride = (a && b) ? (b[offsetProp] - a[offsetProp]) : 0;
    if (stride && newStride && stride !== newStride) {
      // item size changed (e.g. window resized) — rescale the current
      // position by the same ratio so it stays valid instead of drifting
      // further from reality with every resize until scrolling wedges
      const ratio = newStride / stride;
      trackEl[scrollProp] = trackEl[scrollProp] * ratio;
      targetScroll = targetScroll * ratio;
    }
    stride = newStride;
  }

  function checkLoop() {
    const count = getItemCount();
    if (!stride || !count) return;
    const headSpan = bufferCount * stride;
    const bodySpan = count * stride;
    if (bodySpan <= 0) return;
    const lowerBound = headSpan - stride * (bufferCount - 1);
    const upperBound = headSpan + bodySpan;
    const pos = trackEl[scrollProp];
    if (pos < lowerBound) {
      const n = Math.ceil((lowerBound - pos) / bodySpan);
      trackEl[scrollProp] += n * bodySpan;
      targetScroll += n * bodySpan;
    } else if (pos > upperBound) {
      const n = Math.ceil((pos - upperBound) / bodySpan);
      trackEl[scrollProp] -= n * bodySpan;
      targetScroll -= n * bodySpan;
    }
  }

  function tick() {
    const current = trackEl[scrollProp];
    const diff = targetScroll - current;
    if (Math.abs(diff) < 0.5) {
      trackEl[scrollProp] = targetScroll;
      isEasing = false;
      raf = null;
      checkLoop();
      return;
    }
    trackEl[scrollProp] = current + diff * easeFactor;
    checkLoop();
    raf = requestAnimationFrame(tick);
  }

  function wrapTarget() {
    const count = getItemCount();
    if (!stride || !count) return;
    const headSpan = bufferCount * stride;
    const bodySpan = count * stride;
    if (bodySpan <= 0) return;
    const lowerBound = headSpan - stride * (bufferCount - 1);
    const upperBound = headSpan + bodySpan;
    if (targetScroll < lowerBound) {
      targetScroll += Math.ceil((lowerBound - targetScroll) / bodySpan) * bodySpan;
    } else if (targetScroll > upperBound) {
      targetScroll -= Math.ceil((targetScroll - upperBound) / bodySpan) * bodySpan;
    }
    /* Bring current into the SAME wrap-generation as the target, computed
       fresh from the actual gap each call — NOT by re-applying "shift
       current by whatever we just shifted target by". That simpler
       version compounds: a burst of wheel events faster than one paint
       (a real trackpad can do this) fires wrapTarget() several times
       before current ever moves, and each shift stacks on the last,
       walking current straight to the true DOM edge (verified: as few
       as 5-7 rapid events). Recomputing fresh instead converges toward
       the same small residual gap no matter how many times it runs. */
    if (bodySpan > 0) {
      const gap = trackEl[scrollProp] - targetScroll;
      const n = Math.round(gap / bodySpan);
      if (n !== 0) trackEl[scrollProp] -= n * bodySpan;
    }
  }

  trackEl.addEventListener('wheel', (e) => {
    if (blocked()) { e.preventDefault(); return; }
    let delta;
    if (axis === 'x') {
      delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    } else {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      delta = e.deltaY;
      e.stopPropagation();
    }
    if (!delta) return;
    e.preventDefault();
    targetScroll += delta;
    wrapTarget();
    isEasing = true;
    if (!raf) raf = requestAnimationFrame(tick);
  }, { passive: false });

  let touchActive = false;

  trackEl.addEventListener('scroll', () => {
    /* This was the one input path into checkLoop() that never checked
       blocked() — every other one (wheel, touch) does. A resize event
       (the address bar hiding while scrolling inside an open modal's
       panel is a very common way to trigger one on mobile) calls
       measure(), which rescales scrollLeft to stay proportionally valid
       — necessary, not something to skip — and that write fires this
       listener. Without the guard, checkLoop() could then silently wrap
       the row by a whole body-span while the modal is open and the row
       is hidden behind it. Since the small dataset means several DOM
       clones of the same saint exist across the buffer, the visible
       effect on close was a "ghost" of the same image fading in at the
       old position while the real one returned somewhere else — a
       different, still-visible clone catching the same undim step. */
    if (isEasing || blocked()) return;
    targetScroll = trackEl[scrollProp];
    if (touchActive) return; // don't write to scrollLeft mid-gesture — see touchstart/touchend below
    checkLoop();
  });

  // Native touch/momentum scrolling can keep driving scrollLeft for a
  // while after the finger lifts, and correcting it (writing to
  // scrollLeft) while a gesture or its momentum is still active doesn't
  // just fail to stick — on Android it desyncs the browser's own
  // touch-scroll tracking for the element, so it stops responding to
  // further touches altogether. Suppress corrections for the whole
  // gesture, plus a generous settle window afterwards, then correct once
  // it's safe.
  trackEl.addEventListener('touchstart', () => {
    touchActive = true;
    /* A touch always wins over a still-converging wheel ease (easeFactor
       is gentle, so a big glide takes several frames to settle) —
       otherwise tick() keeps overwriting scrollLeft under the touch and
       the two fight, barely moving anything. Stop the ease outright and
       hand off to native panning. */
    isEasing = false;
    if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
  }, { passive: true });
  trackEl.addEventListener('touchend', () => {
    setTimeout(() => { touchActive = false; }, 700);
    [750, 1200].forEach(delay => {
      setTimeout(() => {
        if (isEasing) return;
        targetScroll = trackEl[scrollProp];
        checkLoop();
      }, delay);
    });
  }, { passive: true });

  return {
    measure,
    getStride: () => stride,
    resetTo(value) { trackEl[scrollProp] = value; targetScroll = value; },
    // For external drivers (idle drift) that move scrollLeft themselves
    // outside of this module's own wheel/tick logic. Runs the loop-wrap
    // check synchronously, in the caller's own frame, rather than the
    // caller having to wait for the native 'scroll' event this module
    // also listens to — which fires async and isn't guaranteed to land
    // before the caller's next update, risking the two racing each other.
    syncAndWrap() {
      if (isEasing || blocked()) return 0;
      const before = trackEl[scrollProp];
      targetScroll = before;
      checkLoop();
      return trackEl[scrollProp] - before; // 0 on ordinary frames; the exact jump size only when a loop-wrap correction actually fired
    },
    /* Toggles the element between native-pannable (default, for
       compositor smoothness) and programmatic-only (during a modal
       tween, so a stray swipe can't move the row mid-animation).
       touch-action is read at gesture start, so this only ever takes
       effect for the NEXT touch — safe to call mid-tween. */
    setLocked(v) { trackEl.style.touchAction = v ? 'none' : (axis === 'x' ? 'pan-x' : 'pan-y'); }
  };
}

/* Idle auto-scroll, deliberately kept separate from attachLoopScroll's own
   wheel/touch logic. It only ever does one thing — nudge scrollLeft
   forward — but calls back into the loop API's own syncAndWrap()
   synchronously after each nudge, so the infinite-loop wrap is checked in
   the same frame rather than via an async 'scroll' event racing against
   drift's own next update. */
function attachIdleDrift(trackEl, loopApi, opts = {}) {
  const idleMs = opts.idleMs ?? 5000;
  const speed = opts.speed ?? 22; // px/s — the speed drift cruises at once it's ramped up
  /* Drift ramps up on the exact mirror of tick()'s wheel-ease decay:
     velocity rises toward `speed` by closing the remaining gap by this
     same fraction each frame. Reusing tick()'s own constant (not a
     separate tuned value) is what makes it a true inverse. */
  const rampFactor = opts.rampFactor ?? 0.16;
  const scrollProp = (opts.axis || 'x') === 'x' ? 'scrollLeft' : 'scrollTop';

  let lastInteraction = performance.now();
  let paused = false;
  let active = false;
  let pos = null;
  let currentSpeed = 0;
  let lastFrame = performance.now();

  function markInteraction() {
    lastInteraction = performance.now();
    active = false;
    pos = null;
    currentSpeed = 0;
  }
  trackEl.addEventListener('wheel', markInteraction, { passive: true });
  // touch gestures never fire 'wheel' — without these, drift had no way to
  // know mobile scrolling was happening at all, and kept nudging scrollLeft
  // on top of it, fighting the user's own touch-scroll.
  trackEl.addEventListener('touchstart', markInteraction, { passive: true });
  trackEl.addEventListener('touchmove', markInteraction, { passive: true });

  function frame(now) {
    const dt = Math.min(now - lastFrame, 50);
    lastFrame = now;
    if (!paused) {
      const idleFor = now - lastInteraction;
      if (idleFor > idleMs) {
        if (!active) { active = true; pos = trackEl[scrollProp]; currentSpeed = 0; }
        // Same shape as tick()'s deceleration, run toward `speed` instead
        // of toward zero — accelerates quickly at first, then eases into
        // cruising speed rather than snapping straight to it.
        currentSpeed += (speed - currentSpeed) * rampFactor;
        pos += currentSpeed * (dt / 1000);
        trackEl[scrollProp] = pos;
        // synchronous correction, right here, no waiting on an async event —
        // add the delta, don't replace pos with the (rounded) DOM readback
        pos += loopApi.syncAndWrap();
      } else if (active) {
        active = false;
        pos = null;
        currentSpeed = 0;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    pause() { paused = true; active = false; pos = null; currentSpeed = 0; },
    resume() { paused = false; lastInteraction = performance.now(); }
  };
}

function cyclicSlice(list, start, count) {
  const out = [];
  const n = list.length;
  if (n === 0) return out;
  for (let i = 0; i < count; i++) out.push(list[((start + i) % n + n) % n]);
  return out;
}

// With very few unique items, the infinite-loop's body span is so small
// relative to normal scroll speed that it wraps almost continuously —
// which looks and feels like it's stuck bouncing in place rather than
// scrolling smoothly, even though the position math is correct. Virtually
// repeating the real items (looping over them with modulo) up to a
// minimum count fixes this without duplicating any real data or state.
const MIN_LOOP_COUNT = 10;
function loopSafeList(list) {
  const n = list.length;
  if (n === 0) return [];
  if (n >= MIN_LOOP_COUNT) return list;
  const reps = Math.ceil(MIN_LOOP_COUNT / n);
  const out = [];
  for (let r = 0; r < reps; r++) out.push(...list);
  return out;
}

/* items: [{text, ...}]; onItemClick receives the item */
/* Attaches the scroll loop exactly ONCE per container. Re-rendering the
   same carousel repeatedly (e.g. opening a new saint's modal) must reuse
   this, not call attachLoopScroll again — every call adds its own
   wheel/scroll listeners to the same persistent DOM node, and several of
   them competing for the same scrollTop is what eventually broke this. */
function createQuoteCarousel(containerEl, rows, blocked) {
  const buffer = Math.max(rows, 24); // generous, so fast wheel-flicks never outrun the clone buffer (same fix as the Armory rack)
  let items = [];
  const loop = attachLoopScroll(containerEl, buffer, () => items.length, { axis: 'y', blocked });

  function render(newItems, onItemClick) {
    items = newItems;
    containerEl.innerHTML = '';
    if (!items.length) return;
    const head = cyclicSlice(items, items.length - buffer, buffer);
    const tail = cyclicSlice(items, 0, buffer);
    const full = [...head, ...items, ...tail];
    full.forEach(item => {
      const el = document.createElement('div');
      el.className = 'q';
      el.textContent = `\u201C${item.text}\u201D`;
      if (onItemClick) el.addEventListener('click', (e) => { e.stopPropagation(); onItemClick(item); });
      containerEl.appendChild(el);
    });
    requestAnimationFrame(() => {
      loop.measure();
      const first = containerEl.children[buffer];
      if (first) loop.resetTo(first.offsetTop);
    });
  }

  return { render, setLocked: loop.setLocked };
}

/* =====================================================================
   DATA — one folder per saint under assets/saints/, auto-discovered
   via the GitHub API (one call lists the whole repo tree). For each
   folder: the first image file becomes the card art, quotes.txt (one
   quote per line) becomes the key sayings, and every other .txt file
   becomes a chapter — ordered numerically by the number at the start
   of its filename (so "11." sorts after "9.", not between "1." and
   "2."). Add a folder, the carousel picks it up automatically.
===================================================================== */
function naturalCompare(a, b) {
  const na = parseInt((a.match(/^\d+/) || ['999999'])[0], 10);
  const nb = parseInt((b.match(/^\d+/) || ['999999'])[0], 10);
  if (na !== nb) return na - nb;
  return a.localeCompare(b);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Wraps exact substring matches in <span class="quote-anchor" data-idx="n">
   so a click on the matching carousel quote can scrollIntoView + highlight
   it directly, with no runtime text-searching at click time. */
function buildChapterHtml(rawBody, anchors) {
  let html = '';
  let cursor = 0;
  [...anchors].sort((a, b) => a.offset - b.offset).forEach(a => {
    html += escapeHtml(rawBody.slice(cursor, a.offset));
    const chunk = rawBody.slice(a.offset, a.offset + a.length);
    html += `<span class="quote-anchor" data-idx="${a.quoteIndex}">${escapeHtml(chunk)}</span>`;
    cursor = a.offset + a.length;
  });
  html += escapeHtml(rawBody.slice(cursor));
  return html.split(/\n{2,}/).map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`).join('');
}

/* For each quote, find the first chapter containing it verbatim. Quotes
   with no exact match anywhere are dropped from the carousel entirely
   (per spec — no link, no display). */
function linkQuotesToChapters(quoteLines, chapters) {
  const linked = [];
  quoteLines.forEach((text) => {
    for (let ci = 0; ci < chapters.length; ci++) {
      const offset = chapters[ci].body.indexOf(text);
      if (offset !== -1) {
        linked.push({ text, chapterIndex: ci, offset });
        break;
      }
    }
  });
  return linked.map((lq, i) => ({ ...lq, quoteIndex: i }));
}

/* Saint folders carry a sortable year-of-death prefix: four digits then
   B/C for BC/AD — "0353C St Antony the Great", "1450B Moses". Neither
   belongs on screen, so this turns it back into readable form.
   `display` is what the reader sees; `base` is the bare name, used for
   matching Armory quote sources (which have no year prefix) — matching
   on `display` instead would break attribution the moment a folder was
   renamed. */
function parseSaintFolder(folder) {
  const m = /^(\d{1,4})\s*([BbCc])[\s._\-—]*(.+)$/.exec(folder.trim());
  if (!m) return { display: folder, base: folder, sortKey: null };
  const year = parseInt(m[1], 10);
  const isBC = m[2].toUpperCase() === 'B';
  const era = isBC ? 'BC' : 'AD';
  const base = m[3].trim();
  if (!base) return { display: folder, base: folder, sortKey: null };
  /* Alphabetical folder order breaks across the era boundary ("1450B
     Moses" falls between "0353C" and "1859C") and runs BC years
     backwards. Signing the year (BC negative) fixes both with one
     numeric sort. */
  return { display: `${year}${era} ${base}`, base, sortKey: isBC ? -year : year };
}

function saintMatchesSource(saint, source) {
  const src = source.trim().toLowerCase();
  return (saint.base || saint.name).toLowerCase() === src
      || saint.name.toLowerCase() === src;
}

function placeholderIconDataUri() {
  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">

    <circle cx="100" cy="95" r="26" fill="none" stroke="#55524a" stroke-width="1"/>
    <path d="M100 121 C60 128 48 190 48 280 L152 280 C152 190 140 128 100 121 Z" fill="none" stroke="#55524a" stroke-width="1"/>

}
