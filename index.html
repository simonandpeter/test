<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gallery of Saints</title>
<meta name="description" content="The saints of the Catholic, Eastern Orthodox, Oriental Orthodox and Church of the East traditions, attested church by church." />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e5e4dd" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1412" />
<!-- One gold cell — the attested mark from the veneration badge, the only
     place gold appears in the product. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='%23a98237'/%3E%3C/svg%3E" />

<script>
  // Theme before first paint. Runs ahead of any stylesheet so the first
  // painted frame is already the right colour — later would flash, and would
  // also fire the theme fade on load. Reads the same key settings.js owns;
  // 'system' (the default) follows the OS preference.
  (function () {
    try {
      var theme = (JSON.parse(localStorage.getItem('gos-settings') || '{}').theme) || 'system';
      var dark =
        theme === 'dark' ||
        (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {
      /* storage disabled — system-light default, harmless */
    }
  })();
</script>
</head>
<body>
  <div id="veil">
    <div class="veil-name">Gallery of Saints</div>
    <div class="veil-line"></div>
  </div>

  <header class="chrome">
    <a class="site-name" href="/">Gallery of Saints</a>
    <nav class="site-nav" id="site-nav" aria-label="Site"></nav>
    <div class="chrome-corner">
      <button id="theme-toggle" type="button"></button>
      <!-- Today, abbreviated, under the theme control. It rides inside the
           line box the site name already occupies, so the header is exactly as
           tall with it as without. -->
      <time class="chrome-today" id="chrome-today"></time>
    </div>
  </header>

  <main class="chrome">
    <div id="view"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
