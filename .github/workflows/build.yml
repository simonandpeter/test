name: Build

# The point of running this on push is that the author only ever commits a
# folder: if a saint.json is malformed, CI says so here rather than the saint
# quietly missing from the site.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Validate every saint folder and build the manifest
        run: npm run build:manifest
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Quality floor (axe, keyboard focus, reduced motion, 360px)
        # Brief §13, as an executable gate rather than an aspiration. Runs
        # against a real production build via vite preview.
        run: npm run test:e2e
      - name: Quality floor (Lighthouse accessibility and FCP on throttled 4G)
        # The two §13 criteria no Playwright test could reach. Reports into the
        # run summary as a table.
        #
        # `continue-on-error` because FCP lands *on* the brief's line rather
        # than under it, and a gate decided by a coin toss is worse than no
        # gate. Measured 2026-08-28, the first time either criterion was ever
        # measured: accessibility is **100** on all four routes, and FCP
        # medians-of-three came back 1451/1453/1458/1703 ms on one run and
        # 1459/1484/1470/1490 ms on the next, against a 1500 ms floor. All
        # Saints alone moved 213 ms between two medians. So "does this push
        # pass" is not yet a fact about the push.
        #
        # The one measured lever is the two preloaded Latin subsets: blocking
        # them takes FCP from ~700 ms to ~510 ms on a 4x/1.6 Mbit profile
        # (Playwright, 5 samples each). They earn it — the preload does win the
        # `font-display: optional` race under that same throttle, checked four
        # times out of four — so trading the site's serif for the margin is the
        # author's call and not a session's.
        #
        # **Drop this line when FCP clears 1500 ms with room.** A gate that
        # cannot fail is a report, and this file already knows what happens to
        # reds nobody reads.
        continue-on-error: true
        run: npm run test:lighthouse

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Publish coverage statistics to the run summary
        if: always()
        run: |
          if [ -f data/manifest.meta.json ]; then
            echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/manifest.meta.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build site
        # BASE_PATH serves the app under /<repo>/ on project Pages. When the
        # site moves to a custom domain, delete this env line — nothing else.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: dist

  deploy:
    # Requires Pages to be set to "GitHub Actions" as the source in the repo's
    # settings once, by hand. Until then this job fails and everything before
    # it still runs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
