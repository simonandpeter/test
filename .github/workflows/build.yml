name: Build

# The point of running this on push is that the author only ever commits a
# folder: if a saint.json is malformed, CI says so here rather than the saint
# quietly missing from the site.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Validate every saint folder and build the manifest
        run: npm run build:manifest
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Quality floor (axe, keyboard focus, reduced motion, 360px)
        # Brief §13, as an executable gate rather than an aspiration. Runs
        # against a real production build via vite preview.
        run: npm run test:e2e
      - name: Quality floor (Lighthouse accessibility and FCP on throttled 4G)
        # The two §13 criteria no Playwright test could reach. Reports into the
        # run summary as a table.
        #
        # It blocks, and that took reading a CI run to justify. On the author's
        # desk FCP straddles the 1500 ms line — medians-of-three of
        # 1451/1453/1458/1703 ms one run and 1459/1484/1470/1490 ms the next —
        # and this step shipped `continue-on-error` for exactly one commit on
        # the strength of that, because a gate decided by a coin toss is worse
        # than no gate.
        #
        # The runner disagrees, and the runner is the source of truth. First run
        # (dc6fc22): accessibility **100** on all four routes, FCP **1206-1221
        # ms** against the 1500 ms floor, and the three samples behind each
        # median spread by 3 ms rather than by 200. The desk's variance was a
        # fact about the desk. There is ~280 ms of margin here, so the gate can
        # fail honestly, and a gate that cannot fail is a report.
        #
        # If this goes red on timing rather than on a11y, the measured lever is
        # the two preloaded Latin subsets: blocking them takes FCP from ~700 ms
        # to ~510 ms on a 4x/1.6 Mbit profile. **Do not reach for it casually.**
        # They earn their cost — the preload wins the `font-display: optional`
        # race under that same throttle, four times out of four — so trading the
        # site's serif for the margin is the author's call, not a session's.
        run: npm run test:lighthouse

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Publish coverage statistics to the run summary
        if: always()
        run: |
          if [ -f data/manifest.meta.json ]; then
            echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/manifest.meta.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build site
        # BASE_PATH serves the app under /<repo>/ on project Pages. When the
        # site moves to a custom domain, delete this env line — nothing else.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: dist

  deploy:
    # Requires Pages to be set to "GitHub Actions" as the source in the repo's
    # settings once, by hand. Until then this job fails and everything before
    # it still runs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
